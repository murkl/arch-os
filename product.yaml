# Shared by all modules, the folders beside this file with a module.yaml. A
# name() is a lib.sh function: runtime/README.md

title: Arch OS

# Eyebrow above the blank line, wordmark below.
logo: |
  Arch Linux

   █████  ██████   ██████ ██   ██      ██████  ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██ ██
  ███████ ██████  ██      ███████     ██    ██ ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██      ██
  ██   ██ ██   ██  ██████ ██   ██      ██████  ███████

# Arch blue, and its console slot: iso/README.md#console
accent: "#1793d1"
console-accent: bright-blue
surface: "#3b4252"
console-surface: blue

# Each check is a request to archlinux.org.
status:
  check: check_online()
  every: 30
  pass: Online
  fail: Offline

actions:
  # The system stays mounted after the run.
  chroot:
    title: Open a shell
    description: Opens a shell in the system on the disk. Type exit to leave.
    run: open_shell()
    tty: true

  # A system is installed and repaired from outside itself.
  live-image:
    title: An Arch Linux live system
    run: on_arch_live_image()
    error: Arch Linux live system required. Boot from the Arch OS ISO.

  # A working cable wins: Wi-Fi only where none is online.
  no-cable:
    title: No wired internet
    run: no_cable()

  # systemd unmounts the target and locks the disk on the way down.
  restart:
    title: Restart
    description: Restarts this machine.
    run: restart_machine()

  root:
    title: Running as root
    run: is_root()
    error: Root privileges required. Log in as root and start again.

  # Choosing the row is the consent, so it names what leaves.
  share-log:
    title: Share the log
    description: |
      Uploads the log to paste.rs. Anyone with the link can read it. Passwords
      are excluded.
    run: share_log()
    simulates: true
    error: Upload failed.
    # Its own 3, since the Installer's speaks of the install run.
    errors:
      3: |
        No internet connection

        Connect and try again.
      10: |
        paste.rs unreachable

        Try again later.
    report: |
      Log shared

      Scan the QR code or share the link.
    qr: ARCH_OS_LOG_URL

  shutdown:
    title: Shut down
    description: Turns this machine off.
    run: shut_down_machine()

  # An open or known network connects when chosen. One with a password says
  # no, and wifi-passphrase asks for it.
  wifi:
    title: Connect to Wi-Fi
    description: Connects to a Wi-Fi network.
    group: Configuration
    requires: [wifi-card, no-cable]
    inputs:
      - name: ARCH_OS_WIFI_SSID
        type: list
        title: Network
        required: true
        options-from: options_wifi_networks()
    run: join_wifi()
    on:
      failure: [wifi-passphrase]

  wifi-card:
    title: A Wi-Fi card
    run: has_wifi_card()

  wifi-passphrase:
    title: Wi-Fi network
    inputs:
      - name: ARCH_OS_WIFI_PASSPHRASE
        type: password
        title: Password
        required: true
    run: join_wifi_with_passphrase()
    errors:
      10: |
        Connection to {{ARCH_OS_WIFI_SSID}} failed

        Check the password.
