# Arch OS: what no module answers for its neighbors. The modules are the
# folders beside this file with a module.yaml, the version is the build's. A
# name() is a function of lib.sh: runtime/README.md

title: Arch OS

# Above the blank line the eyebrow, below it the wordmark.
logo: |
  Arch Linux

   █████  ██████   ██████ ██   ██      ██████  ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██ ██
  ███████ ██████  ██      ███████     ██    ██ ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██      ██
  ██   ██ ██   ██  ██████ ██   ██      ██████  ███████

# Arch blue, and on the console the slot the images paint it in: iso/README.md.
accent: "#1793d1"
console-accent: bright-blue
surface: "#3b4252"
console-surface: blue

# Each check is a request to archlinux.org, so one every half minute.
status:
  check: check_online()
  every: 30
  pass: Online
  fail: Offline

actions:
  # Under on: success: the system is still mounted when the run ends.
  chroot:
    title: Open a shell
    description: A shell inside the system on the disk. Leave it with exit.
    run: open_shell()
    tty: true

  # Under requires: a system is installed and repaired from outside itself.
  live-image:
    title: An Arch Linux live image
    run: on_arch_live_image()
    error: |
      Runs only from an Arch Linux live image. Boot this machine from the Arch
      OS ISO.

  # A cable that works is preferred: the wireless network is offered only where
  # none is online.
  no-cable:
    title: No wired internet
    run: no_cable()

  # systemd unmounts the target and locks the disk on the way down.
  restart:
    title: Restart
    description: Restarts this machine.
    run: restart_machine()

  root:
    title: Running as root
    run: is_root()
    error: Root is required. Log in as root and start again.

  # Under on: failure. Choosing the row is the consent, so it says what leaves.
  share-log:
    title: Share the log
    description: |
      Uploads the log to paste.rs for whoever helps you. Anyone with the address
      can read it. Passwords are not included.
    run: share_log()
    simulates: true
    error: The upload to paste.rs failed. Try again in a moment.
    report: |
      Log shared

      Scan the QR code or pass the address below to whoever helps you.
    qr: ARCH_OS_LOG_URL

  shutdown:
    title: Shut down
    description: Turns this machine off.
    run: shut_down_machine()

  # On the dashboard, and opened without internet. An open or known network
  # is joined as it is chosen. One that wants a passphrase says no, and that is
  # asked next.
  wifi:
    title: Connect to Wi-Fi
    description: Connects to a wireless network.
    group: Configuration
    requires: [wifi-card, no-cable]
    inputs:
      - name: ARCH_OS_WIFI_SSID
        type: list
        title: Network
        required: true
        options-from: options_wifi_networks()
    run: join_wifi()
    on:
      failure: [wifi-passphrase]

  # A machine without a card is offered no wireless network.
  wifi-card:
    title: A wireless card
    run: has_wifi_card()

  # Opened where the network wants a passphrase.
  wifi-passphrase:
    title: Wireless network
    inputs:
      - name: ARCH_OS_WIFI_PASSPHRASE
        type: password
        title: Password
        required: true
    run: join_wifi_with_passphrase()
    error: |
      Wrong password for {{ARCH_OS_WIFI_SSID}}, or the network is out of range.
