# Start over and a crash both restart the Recovery. Each run first closes what
# the last one left open.
[Unit]
# No start limit, since nothing else can take over the screen.
StartLimitIntervalSec=0
# Wants, not Requires: answers that cannot be read are asked instead.
Wants=arch-os-seed.service
After=arch-os-seed.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/arch-os recovery --kiosk
Restart=always
# Never through inactive or failed: those fire the ISO unit's OnSuccess= and
# OnFailure= login, which shows during the restart.
RestartMode=direct
RestartSec=200ms
