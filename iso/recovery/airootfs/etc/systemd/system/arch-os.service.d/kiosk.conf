# The Recovery on its partition is the one thing this machine was started for,
# so there is no prompt behind it: leaving it is Reset, which ends the program,
# and this starts it again, fresh - see arch-os-kiosk.
#
# After a crash too, unlike on the ISO. A run of the Recovery that dies halfway
# leaves at most a disk open or mounted, and the first thing its next run does
# is close that before opening it again.
[Unit]
# Never given up on: a screen that stops answering is the one outcome this
# image must not have, and there is nothing behind it to fall back to.
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/local/bin/arch-os-kiosk
Restart=always
RestartSec=1
