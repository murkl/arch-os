# The Recovery on its partition is the one thing this machine was started for,
# so there is no prompt behind it: leaving it is Exit, which ends the program,
# and this starts it again on every answer it had - see arch-os-kiosk.
#
# After a crash too, unlike on the ISO. A run of the Recovery that dies halfway
# leaves at most a disk open or mounted, and the first thing its next run does
# is close that before opening it again.
[Unit]
# Never given up on: a screen that stops answering is the one outcome this
# image must not have, and there is nothing behind it to fall back to. It is
# also what keeps the getty the unit hands tty1 to on the ISO from ever being
# started here: the unit never ends in failure, and only stops with the machine.
StartLimitIntervalSec=0
# The answers, handed over once a boot. Wanted rather than required: answers
# that could not be read are asked instead.
Wants=arch-os-seed.service
After=arch-os-seed.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/arch-os-kiosk
Restart=always
RestartSec=1
