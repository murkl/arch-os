# What the Recovery image is built with: baseline's own settings, and what
# pacman leaves out of every package on the way in. Read by mkarchiso only;
# the image itself keeps the pacman.conf its package ships.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Nobody reads a manual in the Recovery and nothing is compiled there, and it
# runs in C.UTF-8, which glibc carries itself.
NoExtract = usr/share/man/* usr/share/info/* usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/locale/* usr/share/i18n/* usr/share/gir-1.0/*
NoExtract = usr/include/* usr/lib/*.a

# The graphics drivers: it draws on the screen the firmware set up. Of the
# drivers, only these go - every other tree something a recovery needs depends
# on, laptop hotkeys on the network stack's rfkill among them. Measured against
# `modinfo -F depends` of linux 7.2: what is left that needs these is graphics
# passthrough, a camera and an AI accelerator.
NoExtract = usr/lib/modules/*/kernel/drivers/gpu/*

# The firmware is here for the wireless cards. What the same packages carry for
# graphics, cameras, sensors and Bluetooth goes, read off the packages' own
# file lists: nothing here draws, films or pairs anything.
NoExtract = usr/lib/firmware/i915/* usr/lib/firmware/xe/*
NoExtract = usr/lib/firmware/intel/ibt-* usr/lib/firmware/intel/ipu/* usr/lib/firmware/intel/vsc/*
NoExtract = usr/lib/firmware/intel/ish/* usr/lib/firmware/intel/vpu/* usr/lib/firmware/intel/avs/*
NoExtract = usr/lib/firmware/intel/qat/* usr/lib/firmware/qca/* usr/lib/firmware/rtl_bt/*
NoExtract = usr/lib/firmware/mediatek/BT_RAM_CODE_* usr/lib/firmware/mediatek/*/BT_RAM_CODE_*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
