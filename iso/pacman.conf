# Build-time pacman.conf of both images: stock settings plus what pacman skips
# in every package. Read by mkarchiso only. Each image keeps the pacman.conf of
# its pacman package, which pacstrap installs with.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# No manuals and no compiling on either. Both run in C.UTF-8, built into glibc,
# and the Installer lists locales from glibc's SUPPORTED.
NoExtract = usr/share/man/* usr/share/info/* usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/locale/* usr/share/i18n/charmaps/* usr/share/i18n/locales/* usr/share/gir-1.0/*
NoExtract = usr/include/* usr/lib/*.a

# Graphics drivers, since both draw on the firmware's framebuffer. build.sh
# checks that no module a repair or an installation loads depends on them.
NoExtract = usr/lib/modules/*/kernel/drivers/gpu/*

# Firmware serves the network cards and the screen reader's sound. The same
# packages' files for graphics, cameras, sensors and Bluetooth go unused here,
# taken from the packages' file lists.
NoExtract = usr/lib/firmware/i915/* usr/lib/firmware/xe/*
NoExtract = usr/lib/firmware/intel/ibt-* usr/lib/firmware/intel/ipu/* usr/lib/firmware/intel/vsc/*
NoExtract = usr/lib/firmware/intel/ish/* usr/lib/firmware/intel/vpu/*
NoExtract = usr/lib/firmware/intel/qat/* usr/lib/firmware/qca/* usr/lib/firmware/rtl_bt/*
NoExtract = usr/lib/firmware/mediatek/BT_RAM_CODE_* usr/lib/firmware/mediatek/*/BT_RAM_CODE_*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
