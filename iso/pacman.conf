# What both images are built with: the profiles' own settings, and what pacman
# leaves out of every package on the way in. Read by mkarchiso only, each image
# itself keeps the pacman.conf its package ships, which pacstrap installs with.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Nobody reads a manual on either and nothing is compiled there. Both run in
# C.UTF-8, which glibc carries itself, and the Installer lists the locales from
# glibc's SUPPORTED.
NoExtract = usr/share/man/* usr/share/info/* usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/locale/* usr/share/i18n/charmaps/* usr/share/i18n/locales/* usr/share/gir-1.0/*
NoExtract = usr/include/* usr/lib/*.a

# The graphics drivers, since both draw on the firmware's screen. No module a
# repair or an installation loads depends on them, which build.sh checks.
NoExtract = usr/lib/modules/*/kernel/drivers/gpu/*

# The firmware is here for the network cards and the screen reader's sound.
# What the same packages carry for graphics, cameras, sensors and Bluetooth
# goes, read off the packages' own file lists: nothing here draws, films or
# pairs anything.
NoExtract = usr/lib/firmware/i915/* usr/lib/firmware/xe/*
NoExtract = usr/lib/firmware/intel/ibt-* usr/lib/firmware/intel/ipu/* usr/lib/firmware/intel/vsc/*
NoExtract = usr/lib/firmware/intel/ish/* usr/lib/firmware/intel/vpu/*
NoExtract = usr/lib/firmware/intel/qat/* usr/lib/firmware/qca/* usr/lib/firmware/rtl_bt/*
NoExtract = usr/lib/firmware/mediatek/BT_RAM_CODE_* usr/lib/firmware/mediatek/*/BT_RAM_CODE_*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
