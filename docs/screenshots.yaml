# The pictures in docs/screenshots/ and the way to each, see screenshots.py.
#
# One block is one take: the program started from a fresh copy with --dry-run,
# so nothing on this machine changes. One step is one page: wait for `page:`,
# save it as `shot:`, put the cursor on the row `choose:`, then `press:`. Pages
# and rows are named by their trace ids: runtime/README.md#trace
#
# Every answer is set here, since locale, keyboard and time zone default to the
# rendering machine's. The disk cannot be set, so no page showing one is shot.

# The Installer: every answer, then the run.
- module: installer
  steps:
      - page: language
        choose: en
        press: enter
      - page: question ARCH_OS_VCONSOLE_KEYMAP  # auto, the live image's layout
        press: enter
      - page: presets
        press: enter
      - page: question ARCH_OS_USERNAME
        press: [tux, enter]
      # Its narrowing box is open, so the answer is typed.
      - page: question ARCH_OS_LOCALE_LANG
        press: [en_US, enter]
      - page: question ARCH_OS_TIMEZONE
        press: [UTC, enter]
      - page: question ARCH_OS_DISK
        press: enter

      # The dashboard, also a banner card, see make banner. The cursor opens on
      # Install now.
      - page: dashboard
        shot: installer
        press: enter

      # Asked after the dashboard and never written to a file.
      - page: password ARCH_OS_PASSWORD
        press: [tuxpass, enter]
      - page: password ARCH_OS_PASSWORD repeat
        press: [tuxpass, enter]

      - page: confirm
        choose: "yes"
        press: enter

      - page: run done
        shot: installing
        frame: running
