# The pictures in docs/screenshots/, and the way to each, see screenshots.py.
#
# One block is one take: a start of the program from a pristine copy, with
# --dry-run, so nothing on this machine is touched. One step is one page: wait
# for `page:`, photograph it as `shot:`, put the cursor on the row called
# `choose:`, press on.
#
# Every answer is given here rather than left to the machine rendering it: a
# locale, a keyboard and a time zone all default to something read off it. The
# disk cannot be, which is why no page showing one is photographed.

# The Installer: every value it will use, and the run.
- module: installer
  steps:
      - page: Please choose your language
        press: enter
      - page: Console keyboard  # auto, the layout of the live image
        press: enter
      - page: [Profile, Desktop, Core]
        press: enter
      - page: Username
        press: [tux, enter]
      # Its narrowing box is open, so the answer is typed.
      - page: Language and region
        press: [en_US, enter]
      - page: Time zone
        press: [UTC, enter]
      - page: Disk
        press: enter

      # The dashboard, also the page the banner is collaged from, see make
      # banner. Install now is the row the cursor opens on.
      - page: [Install now, Username]
        shot: installer
        press: enter

      # Asked here rather than with the other answers, and written to no file.
      - page: Password
        press: [tuxpass, enter]
      - page: Repeat
        press: [tuxpass, enter]

      # The last page, after the password.
      - page: Install Arch OS on
        choose: "Yes"
        press: enter

      - page: Arch OS installed
        shot: installing
        frame: running
