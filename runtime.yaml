# What this runtime is: the product its modules add up to, and the modules
# themselves.
#
# It sits beside the binary rather than inside any module because no module can
# answer for its neighbours. An installer and a recovery are two programs and
# one product, and the wordmark on the way in, the colour on every page and the
# name over the question of which to open are the product's.
#
# It is also the whole of what makes this binary Arch OS rather than something
# else. Nothing here is compiled in: a different name, a different colour and a
# different list of modules is a different product out of the same runtime.

# Over the pages drawn before a module has been opened — the language, and the
# question of which of them to open. Not translated: it is a name.
name: Arch OS

# Arch blue, pulled towards the terminal's background so it holds on a light one.
accent: "#1793d1"

# Above the blank line is the eyebrow, dimmed; below it the wordmark, in the
# accent.
logo: |
  Arch Linux

   █████  ██████   ██████ ██   ██      ██████  ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██ ██
  ███████ ██████  ██      ███████     ██    ██ ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██      ██
  ██   ██ ██   ██  ██████ ██   ██      ██████  ███████

# What this runtime offers, in the order it offers them. Each name is a folder
# beside this file holding that module's own declaration — installer/ holds
# installer.yaml — and it is the word that opens it outright: `runtime
# --installer`.
#
# Adding a module is a line here and a folder; taking one away is deleting both.
# Nothing else in the runtime knows any of them by name.
modules:
  - installer
  - recovery
