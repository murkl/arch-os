# Deutsch — Übersetzung der Runtime.
#
# Links steht der englische Quelltext, wie er im Go-Code steht; er ist zugleich
# der Schlüssel. Was hier fehlt, bleibt englisch — eine unvollständige Datei ist
# ab der ersten Zeile nützlich.
#
# Eine neue Sprache anlegen: diese Datei unter <code>.yaml kopieren, `language`
# auf den Namen der Sprache in ihrer eigenen Schreibweise setzen und die rechte
# Seite übersetzen.
language: Deutsch
messages:
  # Ohne Installer-Ordner startet nichts. Diese Meldungen erscheinen als einzige
  # außerhalb der Oberfläche, auf stderr.
  "No installer folder found.": "Kein Installer-Ordner gefunden."
  "A folder holding %s is needed. Looked in:": "Es wird ein Ordner mit %s benötigt. Gesucht wurde in:"
  "no installer folder here": "hier liegt kein Installer-Ordner"

  # Tastenhinweise in der Fußzeile.
  "↑↓ move · ⏎ select · q quit": "↑↓ wählen · ⏎ öffnen · q beenden"
  "↑↓ move · ⏎ open · esc back": "↑↓ wählen · ⏎ öffnen · esc zurück"
  "↑↓ move · ⏎ confirm · esc back": "↑↓ wählen · ⏎ bestätigen · esc zurück"
  "⏎ confirm · esc back": "⏎ übernehmen · esc zurück"
  "⏎ start · esc back": "⏎ starten · esc zurück"
  "⏎ continue": "⏎ weiter"
  "⏎ quit": "⏎ beenden"
  "working …": "läuft …"
  "type to filter · ↑↓ move · ⏎ select · esc close": "tippen filtert · ↑↓ wählen · ⏎ wählen · esc schließt"
  "/ filter": "/ filtern"
  "Filter …": "Filtern …"
  "No matches": "Keine Treffer"

  # Der Ablauf, von der Sprachwahl bis zur fertigen Installation.
  "Checking the internet connection …": "Internetverbindung wird geprüft …"
  "Looking for wireless networks …": "WLAN-Netzwerke werden gesucht …"
  "Joining %s …": "Verbinde mit %s …"
  "There is no internet connection.": "Keine Internetverbindung."
  "No wireless networks in range.": "Keine WLAN-Netzwerke in Reichweite."
  "Passphrase": "Passwort"
  "Continue anyway": "Trotzdem fortfahren"
  "↑↓ move · ⏎ join · r rescan · esc skip": "↑↓ wählen · ⏎ verbinden · r neu suchen · esc überspringen"
  "⏎ continue · r retry": "⏎ weiter · r erneut versuchen"
  "The installation downloads everything it installs, so it will not get far without one. Plug in a cable, or press r to look for a network again.": "Die Installation lädt alles herunter, was sie installiert, und kommt ohne Verbindung nicht weit. Stecke ein Kabel ein oder drücke r, um erneut nach einem Netzwerk zu suchen."
  "The installation downloads everything it installs, so it will not get far without one. Plug in a cable, or connect to a wireless network before continuing.": "Die Installation lädt alles herunter, was sie installiert, und kommt ohne Verbindung nicht weit. Stecke ein Kabel ein oder verbinde dich mit einem WLAN, bevor du fortfährst."
  "Checking this machine …": "System wird geprüft …"
  "System check": "Systemprüfung"
  "Cannot continue": "Installation nicht möglich"
  "Interface language": "Sprache der Oberfläche"
  "Choose the language for this installer.": "Sprache für diesen Installer wählen."
  "Install": "Installieren"
  "Start the installation with the answers below.": "Die Installation mit den bisherigen Angaben starten."
  "Settings": "Einstellungen"
  "Every value this installer will use. Choose one to change it.": "Alle Werte, mit denen dieser Installer arbeitet. Zum Ändern einen davon öffnen."
  "asked before installing": "wird vor der Installation abgefragt"
  "Repeat": "Wiederholen"
  "The entries do not match.": "Die Eingaben stimmen nicht überein."
  "Ready to install": "Bereit zur Installation"
  "Start installation": "Installation starten"
  "Installing": "Installation läuft"
  "Installing for %s": "Installation läuft seit %s"
  "%d of %d": "%d von %d"
  "Installation complete in %s": "Installation abgeschlossen in %s"
  "Installation failed": "Installation fehlgeschlagen"

  # Der Weg hinaus. Auf einem Rechner, der nur zum Installieren gestartet wurde,
  # heißt Beenden nicht, ein Programm zu schließen, sondern zu entscheiden, was
  # mit dem Rechner geschieht.
  "Leave": "Beenden"
  "Restart": "Neu starten"
  "Close this machine down and start it again.": "Den Rechner herunterfahren und neu starten."
  "Shut down": "Herunterfahren"
  "Exit to the console": "Installer beenden"
  "Switch this machine off.": "Den Rechner ausschalten."
  "Restarting …": "Neustart läuft …"
  "Shutting down …": "Wird heruntergefahren …"
  "This machine did not do as it was told.": "Der Rechner hat den Befehl nicht ausgeführt."

  # Werte und ihre Prüfung.
  "Yes": "Ja"
  "No": "Nein"
  "This value is required.": "Dieser Wert wird benötigt."
  "This value has the wrong format.": "Dieser Wert hat das falsche Format."
  "Answers given to %s. Edit by hand if you like.": "Angaben für %s. Kann von Hand bearbeitet werden."

  # Der Fehlerbericht.
  "Script": "Skript"
  "Command": "Befehl"
  "Exit code": "Exit-Code"
  "Error": "Fehler"
  "The full log is in %s.": "Das vollständige Protokoll steht in %s."
