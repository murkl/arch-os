# What counts as sound yaml here, for `make lint`. Three of yamllint's defaults
# are switched off, each a convention of the linter rather than a rule of the
# format:
#
#   line-length  the modules' declarations and the catalogs are prose, and a
#                sentence broken at column 80 reads and diffs worse.
#   truthy       `default: no` is an answer to an offer, not a boolean — Oak
#                reads every scalar as the text it was written as. check-keys
#                off because a workflow's `on:` is a key, not a value.
#   comments     the stage lists are annotated one space out, so the comment
#                sits against its entry rather than adrift of it.

extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1

# Build output and the ISO's scratch space — see /Makefile and iso/build.sh.
ignore: |
  /dist/
  /.dev/
  /.oak/
  /iso/archiso/
  /iso/download/
