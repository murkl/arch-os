# What counts as sound yaml here, for `make lint`. Four of yamllint's defaults
# are relaxed, each a convention of the linter rather than a rule of the
# format:
#
#   line-length     the declarations and the catalogs are prose, and a
#                   sentence broken at column 80 reads and diffs worse.
#   document-start  every file is one document, which needs no `---`.
#   truthy          check-keys, because a workflow's `on:` is a key, not a value.
#   comments        a pinned action carries its version one space out, as
#                   Dependabot writes it.

extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1

# What git leaves out is no source either.
ignore-from-file: .gitignore
