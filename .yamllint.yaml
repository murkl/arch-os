# Four defaults relaxed, each a linter convention, not a YAML rule:
#
#   line-length     declarations and catalogs are prose, broken lines diff worse
#   document-start  one document per file, no `---` needed
#   truthy          check-keys off, since a workflow's `on:` is a key
#   comments        Dependabot writes a pinned action's version one space out

extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1

# Same exclusions as git.
ignore-from-file: .gitignore
