# The toolchain every job runs on: every tool this project checks itself with
# is an Arch package, so CI runs the Makefile's own commands.

name: Arch toolchain
description: An Arch container with the given packages, from cache where possible.

inputs:
  packages:
    description: Packages to install, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    # A key that never hits, over a prefix that almost always does: the newest
    # cache is restored and a fresh one saved, so it follows the repositories.
    # mkarchiso fills the live system through this cache too.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/pacman/pkg
        key: pacman-${{ github.job }}-${{ github.run_id }}
        restore-keys: pacman-${{ github.job }}-

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -ra packages <<<"$PACKAGES"
        pacman -Syu --needed --noconfirm pacman-contrib "${packages[@]}"

        # Two versions of each package keep a cache saved on every run small.
        paccache -rk2 -q

        # The checkout belongs to the runner's user, and git refuses somebody
        # else's repository.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
