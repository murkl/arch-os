# The toolchain every job runs on, and the cache that keeps fetching it cheap.
#
# Everything runs on Arch: it is what this project builds, and every tool it
# checks itself with is a package. CI ends up running the literal commands from
# the Makefiles rather than an approximation assembled out of setup actions.

name: Arch toolchain
description: An Arch container with the given packages, from cache where possible.

inputs:
  packages:
    description: Packages to install, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    # The key is the package list and the week, so the ordinary run is an exact
    # hit and writes no cache at all — the two restore-keys below are what a
    # fresh week or a changed list falls back to, and it then saves once. For
    # the ISO job the interesting packages are the ones pacstrap fetches *during*
    # the build, which only that save ever sees, so a week is also how long the
    # image's own downloads are kept.
    - id: cache-key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        {
          echo "packages=$(printf '%s' "$PACKAGES" | sha256sum | cut -c1-12)"
          echo "week=$(date -u +%G-%V)"
        } >>"$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: /var/cache/pacman/pkg
        key: pacman-${{ github.job }}-${{ steps.cache-key.outputs.packages }}-${{ steps.cache-key.outputs.week }}
        restore-keys: |
          pacman-${{ github.job }}-${{ steps.cache-key.outputs.packages }}-
          pacman-${{ github.job }}-

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -ra packages <<<"$PACKAGES"
        pacman -Syu --needed --noconfirm pacman-contrib "${packages[@]}"

        # Two versions of each package is plenty to restore from, and keeps a
        # cache written on every run from growing without end.
        paccache -rk2 -q

        # The checkout belongs to the runner's user and this container is root,
        # which git reads as somebody else's repository.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
