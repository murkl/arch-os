# A commit is built exactly once. What this run assembles is what its own jobs
# check and boot, and — when a tag comes to point at that commit — the very
# files the release workflow hangs on the release page. Nothing downstream ever
# builds again. See docs/CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main, neo]
  pull_request:
  workflow_dispatch:

permissions: {}

# -o pipefail on every step: a failure in the middle of a pipeline is a failure.
defaults:
  run:
    shell: bash

# A branch and its pull request never both run: pushes are watched on the two
# long-lived branches, everything else arrives as a pull request. On main
# nothing is cancelled — that is the run a tag publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # `make check` and nothing this file adds to it: what is checked lives in the
  # Makefiles, so a rule that holds in CI holds at a desk.
  #
  # Nothing here needs a Go toolchain. The runtime is Oak, a project of its own,
  # and every job that needs it downloads the release the Makefile pins.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and a tarball is not a repository.
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make curl shellcheck shfmt yamllint actionlint gettext diffutils

      - run: make check

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: gitleaks

      # This project is installed by piping a script into a shell. A credential
      # that reached the repository would be handed to everybody who did that.
      - name: Secrets in the repository
        run: gitleaks dir . --redact --no-banner

  # The only job that assembles anything. Everything downstream downloads this
  # artefact rather than building again.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
      id-token: write # the provenance below is signed
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make curl

      # Out of oak.yaml, through make, so there is one reading of it and not a
      # second one written into this file.
      - id: version
        run: echo "version=$(make -s version)" >>"$GITHUB_OUTPUT"

      - run: make tarball

      # What ships is what was checked, rather than what was checked plus
      # whatever the packaging did to it. `--inspect` loads a product the way a
      # run does, so this asks of the whole unpacked release what `make check`
      # asks of each module in the tree.
      - name: The tarball holds a working release
        run: |
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          for release in "$unpacked"/*; do
            "$release/oak" --inspect
          done
          (cd dist && sha256sum -c ./*.sha256)

      # Kept long enough on main that a tag pushed weeks later still finds them.
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: ${{ github.ref_name == 'main' && 90 || 7 }}

      # Which commit and which run this file came out of, signed where it is
      # made rather than where it is published — the run that assembled it is
      # the only one that can say so truthfully.
      - name: Sign the provenance
        if: github.ref_name == 'main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: What this built
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/summary.sh "Arch OS ${VERSION}" dist/*.tar.gz

  # An image, out of the file the release page will offer rather than out of a
  # second build of the same sources.
  #
  # An archiso build is a quarter of an hour and a boot test another five
  # minutes, which a pull request does not need: it is judged on the three jobs
  # above. Pushes are watched on the long-lived branches only, so everything
  # that gets here is main, the branch being integrated, or a run started by
  # hand — see the trigger at the top.
  iso:
    name: ISO
    needs: [check, security, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
      # pacstrap mounts /proc and /sys inside the airootfs it is filling.
      options: --privileged
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make archiso

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      # Unpacked where a local build would have left it, under the name the
      # archive carries, so the command below is the one from the Makefile and
      # not a version of it adapted to CI.
      - name: Unpack the release
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          tar -xzf dist/*.tar.gz -C dist

      - run: make -C iso build

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: |
            dist/*.iso
            dist/*.iso.sha256
          retention-days: ${{ github.ref_name == 'main' && 90 || 7 }}

      - name: Sign the provenance
        if: github.ref_name == 'main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.iso

      - name: What this built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/summary.sh "Arch OS ${VERSION} image" dist/*.iso

  # The only job that finds out whether the thing actually starts.
  smoke:
    name: Boot test
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      # qemu falls back to emulation without it, which the timeout below would
      # not sit through.
      options: --device /dev/kvm
    permissions:
      contents: read
    env:
      # Generous on purpose: a slow boot is not a failed boot, and a run that
      # passes never waits this long.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      # netpbm turns the console into something a browser will show: a failed
      # boot is read off the picture, and nothing opens a .ppm.
      - uses: ./.github/actions/arch
        with:
          packages: make qemu-base edk2-ovmf tesseract tesseract-data-eng netpbm

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      - run: make -C iso smoke

      # On a failure this is the only account of what the machine was showing
      # when it gave up.
      - name: The console, as a picture
        if: always()
        run: |
          shopt -s nullglob
          for frame in iso/smoke/*.ppm; do
            pnmtopng "$frame" >"${frame%.ppm}.png"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console
          path: iso/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: What the console showed
        if: always()
        run: |
          if [ "$JOB" = success ]; then
            said="Arch OS came up. The frame it was recognised in is the \`console\` artefact."
          else
            said="The interface did not come up. Every frame of the console is in the \`console\` artefact."
          fi
          printf '## Boot test\n\n%s\n\n' "$said" >>"$GITHUB_STEP_SUMMARY"
        env:
          JOB: ${{ job.status }}
