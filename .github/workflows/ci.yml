# A commit is built exactly once. What this run assembles is what its own jobs
# check and boot, and — when a tag comes to point at that commit — the very
# files the release workflow hangs on the release page. Nothing downstream ever
# builds again. See docs/CONTRIBUTING.md.

name: CI

on:
  # main is the only branch pushed to directly; every other branch reaches CI
  # through its pull request. That is the one arrangement in which a commit
  # cannot be under two runs at once — a branch listed here that is also the
  # head of an open pull request raises both events and is built twice.
  push:
    branches: [main]
  # `ready_for_review` on top of the three defaults: leaving draft is what
  # turns the fast gate into the full one below, so it has to start a run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

# -o pipefail on every step: a failure in the middle of a pipeline is a failure.
defaults:
  run:
    shell: bash

# One run per pull request and one per branch, and a push that arrives while an
# older one is still going takes its place. Only a pull request is cancelled: a
# run on main is the one a tag publishes, and a run started by hand was asked
# for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job names its runner rather than leaving it to `ubuntu-latest`, which
# moves to a new Ubuntu on a date GitHub picks: a toolchain that changes under a
# branch nobody touched is a change nobody made. It is raised here deliberately,
# like any other dependency.
jobs:
  # `make check` and nothing this file adds to it — the secret scan included:
  # what is checked lives in the Makefile, so a rule that holds in CI holds at
  # a desk.
  #
  # Nothing here needs a Go toolchain. The runtime is Oak, a project of its own,
  # and every job that needs it downloads the release the Makefile pins.
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and a tarball is not a repository. A full upgrade rather than
      # a refresh, because installing against a database newer than the system
      # is the one thing Arch does not carry.
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the changelog warning asks what
          # this change did to the file against main, and whether the version
          # at the top of it has already gone out.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: make curl shellcheck shfmt yamllint actionlint gettext diffutils gitleaks kbd tzdata

      # The runtime's checksum is a call to the API, and sixty an hour is what
      # an address that does not say who it is gets - one address for every
      # runner on that machine. Handed to the step that makes the call rather
      # than to the job, so nothing else in it can read the token.
      - run: make check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The only job that assembles anything. Everything downstream downloads this
  # artefact rather than building again.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
      id-token: write # the provenance below is signed
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: make curl

      # Out of oak.yaml, through make, so there is one reading of it and not a
      # second one written into this file.
      - id: version
        run: echo "version=$(make -s version)" >>"$GITHUB_OUTPUT"

      - run: make tarball
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # What ships is what was checked, rather than what was checked plus
      # whatever the packaging did to it. `--inspect` loads a product the way a
      # run does, so this asks of the unpacked release what `make check` asks of
      # the tree it was built from.
      - name: The tarball holds a working release
        run: |
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          for release in "$unpacked"/*; do
            "$release/oak" --inspect
          done

      # Kept long enough on main that a tag pushed weeks later still finds them.
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/*.tar.gz
          retention-days: ${{ github.ref_name == 'main' && 90 || 7 }}

      # Which commit and which run this file came out of, signed where it is
      # made rather than where it is published — the run that assembled it is
      # the only one that can say so truthfully.
      - name: Sign the provenance
        if: github.ref_name == 'main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: What this built
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/summary.sh "Arch OS ${VERSION}" dist/*.tar.gz

  # An image, out of the file the release page will offer rather than out of a
  # second build of the same sources.
  #
  # An archiso build is a quarter of an hour and a smoke test another five
  # minutes, so it is spent on what is about to be merged rather than on every
  # save: main, a run started by hand, and a pull request off this repository
  # once it leaves draft. A draft and a fork are judged on the two jobs above —
  # the first because it says itself that it is not ready, the second because a
  # privileged container is not something an unreviewed change is handed.
  iso:
    name: ISO
    needs: [check, build]
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:latest
      # pacstrap mounts /proc and /sys inside the airootfs it is filling.
      options: --privileged
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: make archiso

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      # Unpacked where a local build would have left it, under the name the
      # archive carries, so the command below is the one from the Makefile and
      # not a version of it adapted to CI.
      - name: Unpack the release
        run: tar -xzf dist/*.tar.gz -C dist

      # The image out of the release that was just downloaded, rather than out
      # of a second build of the same sources. `make iso` would do both.
      - run: make image

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: dist/*.iso
          retention-days: ${{ github.ref_name == 'main' && 90 || 7 }}

      - name: Sign the provenance
        if: github.ref_name == 'main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.iso

      - name: What this built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/summary.sh "Arch OS ${VERSION} image" dist/*.iso

  # The only job that finds out whether the thing actually starts.
  smoke:
    name: Smoke test
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
      # qemu falls back to emulation without it, which the timeout below would
      # not sit through.
      options: --device /dev/kvm
    permissions:
      contents: read
    env:
      # Generous on purpose: a slow boot is not a failed boot, and a run that
      # passes never waits this long.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # netpbm turns the console into something a browser will show: a failed
      # boot is read off the picture, and nothing opens a .ppm.
      - uses: ./.github/actions/arch
        with:
          packages: make qemu-base edk2-ovmf tesseract tesseract-data-eng netpbm

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      - run: make smoke

      # On a failure this is the only account of what the machine was showing
      # when it gave up.
      - name: The console, as a picture
        if: always()
        run: |
          shopt -s nullglob
          for frame in dist/smoke/*.ppm; do
            pnmtopng "$frame" >"${frame%.ppm}.png"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test
          path: dist/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: What the console showed
        if: always()
        run: |
          if [ "$JOB" = success ]; then
            said="Arch OS came up. The frame it was recognised in is the \`smoke-test\` artefact."
          else
            said="The interface did not come up. Every frame of the console is in the \`smoke-test\` artefact."
          fi
          printf '## Smoke test\n\n%s\n\n' "$said" >>"$GITHUB_STEP_SUMMARY"
        env:
          JOB: ${{ job.status }}
