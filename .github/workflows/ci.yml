# Pull requests are checked, and the images built, booted and installed. Weekly
# and by hand also with the Desktop.

name: CI

on:
  pull_request:
  # Arch moves daily, so a weekly run catches an upstream break before a release.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# Explicit bash adds pipefail, as in the Makefile.
defaults:
  run:
    shell: bash

# A push cancels the pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `make check` on Arch, as locally.
  check:
    name: Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The date names the image, the digest pins it. Same as the Image job.
    container: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      # multilib for the Installer's lib32 package checks. git refuses root a
      # checkout owned by the runner's user.
      - run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          pacman -Syu --needed --noconfirm git make rust shellcheck shfmt zsh yamllint \
            actionlint zizmor gettext diffutils gitleaks jq kbd terminus-font tzdata xkeyboard-config
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The whole history: the build reads the last release tag, the scope the
      # merge commit's main parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # rustc is part of the key: a hit from another compiler rebuilds
      # everything and is never saved.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('runtime/Cargo.lock') }}

      - run: make check

      # docs/, Markdown and LICENSE never reach an image.
      - id: scope
        run: |
          image=true
          status=0
          git diff --quiet HEAD^1 HEAD -- ':!docs/' ':!*.md' ':!LICENSE' || status=$?
          case "$status" in
          0) image=false ;;
          1) ;;
          *) exit "$status" ;;
          esac
          echo "image=${image}" >>"$GITHUB_OUTPUT"

  # Build, boot and install in one job: handing gigabytes between jobs costs
  # more than building. Weekly and by hand also with the Desktop.
  image:
    name: Image
    needs: check
    if: ${{ !cancelled() && (needs.check.outputs.image == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    # Above the boot scripts' own limits, so they fail first with a diagnosis.
    timeout-minutes: 180
    container:
      image: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
      # pacstrap mounts inside the airootfs, and qemu without KVM is too slow.
      options: --privileged --device /dev/kvm
    permissions:
      contents: read
    steps:
      # git refuses root a checkout owned by the runner's user.
      - run: |
          pacman -Syu --needed --noconfirm git make rust archiso systemd-ukify diffutils \
            kbd terminus-font qemu-base edk2-ovmf tesseract tesseract-data-eng openssh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The whole history, as the build reads the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # rustc is part of the key: a hit from another compiler rebuilds
      # everything and is never saved.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('runtime/Cargo.lock') }}

      - run: make build image

      - run: make smoke
        env:
          TIMEOUT: 600 # a slow boot is not a failed boot

      - run: make e2e

      # GNOME, drivers, browsers and the AUR, weekly and by hand.
      - run: make e2e START=desktop
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

      # Screens and logs are the only diagnosis of a failed boot.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: boot-tests
          path: |
            dist/smoke/*/*.png
            dist/e2e/*.png
            dist/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7
