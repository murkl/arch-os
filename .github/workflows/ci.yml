# What happens to a commit, from the moment it is pushed to the moment it is a
# release. The branch it is on decides how far it gets — see CONTRIBUTING.md.
#
# A commit is built exactly once. The image and the tarball made here on `dev`
# are the ones a release is published from, because promoting is a fast-forward
# and a fast-forward does not change the commit: what was checked and booted is
# bit for bit what is downloaded.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing is granted here. Each job asks for what it actually writes, and only
# the last one writes anything at all.
permissions: {}

# A superseded run on a working branch is worth nothing. On dev it is worth
# something: that is the run that would have released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

jobs:
  # `make check`, and nothing this file adds to it. What is checked lives in the
  # Makefiles — gofmt, go vet, staticcheck, the tests, the setup tree loaded the
  # way the runtime loads it, shellcheck and shfmt over every script, yamllint
  # and actionlint over every yaml. A rule that holds in CI holds at a desk,
  # because it is the same command.
  check:
    name: Check
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout, not after it: without git, actions/checkout falls
      # back to a tarball, and then there is no HEAD for a version to come from.
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      # gcc is in here for the race detector further down: it is built on
      # cgo, which needs a C compiler that the base image does not carry.
      - uses: ./.github/actions/arch
        with:
          packages: go gcc make shellcheck shfmt staticcheck yamllint actionlint

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ hashFiles('runtime/go.sum') }}-

      - run: make check

      # The deeper question, asked once per push rather than once per save. It
      # doubles a test run that already takes over a minute, which is why it is
      # here and not in `check`.
      - name: Tests under the race detector
        run: make -C runtime test-race

  security:
    name: Security
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: go make govulncheck gitleaks

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ hashFiles('runtime/go.sum') }}-

      # Known vulnerabilities in what the runtime imports, narrowed to the ones
      # its own code can actually reach.
      - name: Vulnerabilities
        run: make -C runtime vuln

      # This project is installed by piping a script into a shell. A credential
      # that reached the tree would be handed to everybody who did that.
      - name: Secrets in the tree
        run: gitleaks dir . --redact --no-banner

  # The release as a machine runs it, and the tarball a stock Arch ISO
  # downloads. Everything downstream is made of this artefact rather than built
  # again — the binary in it is compiled exactly once per commit.
  build:
    name: Build
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: go make

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ hashFiles('runtime/go.sum') }}-

      - run: make tarball

      # Unpacked and loaded with the binary that was packed beside it: the one
      # check that what ships is what was tested, rather than what was tested
      # plus whatever the packaging did to it.
      - name: The tarball holds a working installer
        run: |
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          for tree in "$unpacked"/*; do
            "$tree/installer" -check -dir "$tree"
          done
          (cd dist && sha256sum -c ./*.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/
          retention-days: 7

  # Every branch is checked; only some are turned into an image, because an
  # archiso build is a quarter of an hour and a work in progress does not need
  # one. Anywhere else it is one button away — run this workflow by hand on the
  # branch.
  #
  # `neo` is here because that is where the rewrite is being done, and while it
  # is, an image on every push is worth the quarter of an hour. It is a working
  # branch like any other otherwise: nothing is promoted from it.
  iso:
    name: ISO
    needs: [check, security, build]
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref_name == 'dev'
      || github.ref_name == 'main'
      || github.ref_name == 'neo'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # pacstrap mounts /proc and /sys inside the airootfs it is filling.
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make archiso

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # An artefact travels as a zip, and what comes back out of one is not
      # reliably still executable. build.sh refuses a release it cannot run.
      - name: The installer is executable again
        run: chmod +x release/installer

      - run: make -C iso build

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: dist/
          retention-days: 7

  # The image, booted. Everything above this is a linter's opinion of files; this
  # is the only job that finds out whether the thing actually starts.
  smoke:
    name: Boot test
    needs: iso
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # qemu falls back to emulation without it, which the timeout below would
      # not sit through.
      options: --device /dev/kvm
    permissions:
      contents: read
    env:
      # Generous on purpose: a boot that is slow is not a boot that failed, and
      # a run that passes never waits this long anyway.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make qemu-base edk2-ovmf tesseract tesseract-data-eng

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      - run: make -C iso smoke

      # The console, whichever way it went. On a failure it is the only account
      # of what the machine was showing when it gave up.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console
          path: iso/smoke/
          if-no-files-found: ignore
          retention-days: 7

  # The merge into main, and the release that is the point of it.
  #
  # Nothing is built here. A fast-forward leaves main pointing at the commit the
  # jobs above checked and booted, so the release is published from their
  # artefacts — the same bytes, under a tag.
  promote:
    name: Promote and release
    needs: [check, security, build, iso, smoke]
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the fast-forward, the tag, the release
      id-token: write # the provenance below is signed
      attestations: write
    # main moves in one place, one run at a time.
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # merge-base needs enough history to find one.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      # The whole release model in four lines: main only ever moves forward onto
      # a commit that already passed, and it moves onto that exact commit. If
      # main has grown something dev does not have, that is a person's decision
      # to make, not a push to force.
      - name: Fast-forward main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main is not an ancestor of dev — rebase dev onto main"
            exit 1
          fi
          git push origin HEAD:refs/heads/main

      # The tag is the short commit SHA, like every other version in this
      # project. Skipped rather than failed when it already exists, so re-running
      # a half-finished run finishes it instead of refusing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          version="$(git rev-parse --short HEAD)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version is already published"
            exit 0
          fi
          gh release create "$version" dist/* \
            --title "Arch OS $version" \
            --target "$SHA" \
            --generate-notes

      # Which commit and which run these two files came out of, signed, for
      # anybody who wants more than a checksum written by the same hand.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.iso
            dist/*.tar.gz
