# A commit is built exactly once. The image and the tarball made here on `dev`
# are the ones the release is published from: promoting is a fast-forward, so
# what was checked and booted is bit for bit what is downloaded.
# See CONTRIBUTING.md.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

# Keyed so a branch and its pull request share one group: only the newer of the
# two runs. On dev and main nothing is cancelled — that is the run that releases.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

jobs:
  # `make check` and nothing this file adds to it: what is checked lives in the
  # Makefiles, so a rule that holds in CI holds at a desk.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and then there is no HEAD for a version to come from.
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      # gcc is for the race detector below, which is built on cgo.
      - uses: ./.github/actions/arch
        with:
          packages: go gcc make shellcheck shfmt staticcheck yamllint actionlint gettext diffutils

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-

      - run: make check

      # Once per push rather than once per save: it doubles a test run that
      # already takes over a minute.
      - name: Tests under the race detector
        run: make -C runtime test-race

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: go make govulncheck gitleaks

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-

      - name: Vulnerabilities
        run: make -C runtime vuln

      # This project is installed by piping a script into a shell. A credential
      # that reached the repository would be handed to everybody who did that.
      - name: Secrets in the repository
        run: gitleaks dir . --redact --no-banner

  # The only job that compiles anything. Everything downstream downloads this
  # artefact rather than building again.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: go make

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-${{ github.run_id }}
          restore-keys: go-${{ github.job }}-${{ hashFiles('runtime/go.sum') }}-

      - run: make tarball

      # What ships is what was tested, rather than what was tested plus whatever
      # the packaging did to it. The runtime binary itself takes no flag to load
      # everything and change nothing, so this asks the same question ./tools/
      # inspect asks of a module during its own checks — see modules/installer/
      # Makefile — of the whole unpacked release instead.
      - name: The tarball holds a working release
        run: |
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          for release in "$unpacked"/*; do
            go run -C runtime ./tools/inspect -dir "$release"
          done
          (cd dist && sha256sum -c ./*.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/
          retention-days: 7

  # An archiso build is a quarter of an hour, and a work in progress does not
  # need an image. Run this workflow by hand on a branch to get one.
  iso:
    name: ISO
    needs: [check, security, build]
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref_name == 'dev'
      || github.ref_name == 'main'
      || github.ref_name == 'neo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
      # pacstrap mounts /proc and /sys inside the airootfs it is filling.
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make archiso

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: tarball

      # The image is built out of the file that gets published, so what boots
      # here is what a download unpacks. Kept out of dist/, which this job fills
      # with the image.
      - name: Unpack the release
        run: |
          (cd tarball && sha256sum -c ./*.sha256)
          mkdir -p release
          tar -xzf tarball/*.tar.gz --strip-components=1 -C release

      - run: make -C iso build

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: dist/
          retention-days: 7

  # The only job that finds out whether the thing actually starts.
  smoke:
    name: Boot test
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      # qemu falls back to emulation without it, which the timeout below would
      # not sit through.
      options: --device /dev/kvm
    permissions:
      contents: read
    env:
      # Generous on purpose: a slow boot is not a failed boot, and a run that
      # passes never waits this long.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make qemu-base edk2-ovmf tesseract tesseract-data-eng

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      - run: make -C iso smoke

      # On a failure this is the only account of what the machine was showing
      # when it gave up.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console
          path: iso/smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Nothing is built here. A fast-forward leaves main pointing at the commit the
  # jobs above checked and booted, so the release is published from their
  # artefacts — the same bytes, under a tag.
  promote:
    name: Promote and release
    needs: [check, security, build, iso, smoke]
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the fast-forward, the tag, the release
      id-token: write # the provenance below is signed
      attestations: write
    # main moves in one place, one run at a time.
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # merge-base needs enough history to find one.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      # main only ever moves forward, and onto a commit that already passed.
      - name: Fast-forward main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main is not an ancestor of dev — rebase dev onto main"
            exit 1
          fi
          git push origin HEAD:refs/heads/main

      # The tag is the short commit SHA, like every other version here. Skipped
      # rather than failed when it exists, so re-running a half-finished run
      # finishes it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          version="$(git rev-parse --short HEAD)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version is already published"
            exit 0
          fi
          gh release create "$version" dist/* \
            --title "Arch OS $version" \
            --target "$SHA" \
            --generate-notes

      # Which commit and which run these files came out of, signed.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.iso
            dist/*.tar.gz
