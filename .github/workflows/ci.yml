# Pull requests are checked, and the images built, booted and installed. On
# main, release-please keeps a release pull request open, and merging it tags
# the version and publishes the release with the images it booted.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Every step in bash with pipefail, as the Makefile runs its recipes.
defaults:
  run:
    shell: bash

# A new push replaces a pull request's run. On main they queue, so no release
# is cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release pull request, or once that is merged, the tag and a draft page.
  # Done as the account, not as the workflow's bot: GitHub holds the checks of
  # a bot's pull request until someone approves its runs.
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      version: ${{ steps.please.outputs.version }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The repository has no secret RELEASE_TOKEN. docs/CONTRIBUTING.md says how to make it, then rerun this job."
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: please
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # `make check` on Arch, as at a desk.
  check:
    name: Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The date names the base, the digest pins it. The Image job uses the same.
    container: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      # multilib, since the Installer's lib32 package names are checked too. The
      # checkout is the runner's user's, and git refuses it to root.
      - run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          pacman -Syu --needed --noconfirm git make rust shellcheck shfmt zsh yamllint \
            actionlint zizmor gettext diffutils gitleaks kbd terminus-font tzdata
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Two deep: the pull request's merge commit and the main it lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The compiler comes from today's Arch and keys the cache with the lock
      # file: a cache built by another one is rebuilt whole and never saved.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('runtime/Cargo.lock') }}

      - run: make check

      # Nothing under docs/, no Markdown and no LICENSE reaches an image.
      - id: scope
        run: |
          image=true
          status=0
          git diff --quiet HEAD^1 HEAD -- ':!docs/' ':!*.md' ':!LICENSE' || status=$?
          case "$status" in
          0) image=false ;;
          1) ;;
          *) exit "$status" ;;
          esac
          echo "image=${image}" >>"$GITHUB_OUTPUT"

  # The images, built, booted and installed in one job: the gigabytes between
  # building and booting cost more to hand on than to make. On main only for a
  # release, under its version.
  image:
    name: Image
    needs: [release, check]
    if: ${{ !cancelled() && (needs.check.outputs.image == 'true' || needs.release.outputs.version != '') }}
    runs-on: ubuntu-24.04
    # Above the boot scripts' own limits, so they fail first and say why.
    timeout-minutes: 180
    container:
      image: archlinux:base-devel-20261011.0.609700@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
      # pacstrap mounts inside the airootfs, and qemu without KVM is too slow.
      options: --privileged --device /dev/kvm
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - run: |
          pacman -Syu --needed --noconfirm git make rust archiso systemd-ukify diffutils \
            kbd terminus-font qemu-base edk2-ovmf tesseract tesseract-data-eng openssh libisoburn

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The compiler comes from today's Arch and keys the cache with the lock
      # file: a cache built by another one is rebuilt whole and never saved.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            runtime/target
          key: cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('runtime/Cargo.lock') }}

      - run: make build image ${RELEASE:+VERSION="$RELEASE"}

      # What a release publishes. Before the boots, so a failed one still leaves
      # the image to look at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: arch-os
          path: |
            dist/*.iso
            dist/*.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - run: make smoke
        env:
          TIMEOUT: 600 # a slow boot is not a failed boot

      - run: make e2e

      # On a failure, what the machine was showing is all there is to go on.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: boot-tests
          path: |
            dist/smoke/*/*.png
            dist/e2e/*.png
            dist/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The files the image job booted, hung on the draft, which goes public last.
  publish:
    name: Publish
    needs: [release, image]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the assets and the page
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-os
          path: dist

      # Named, so a file built under any other version fails here.
      - run: |
          gh release upload "$TAG" --clobber \
            "dist/arch-os-${VERSION}-x86_64.iso" \
            "dist/arch-os-${VERSION}-recovery-x86_64.tar"
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
