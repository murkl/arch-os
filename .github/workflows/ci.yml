# Pull requests are checked, main releases, and Monday's Arch is tried weekly.
# Which job runs when is the table in docs/CONTRIBUTING.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Arch moves daily: the images are built, booted and installed on Monday's
  # packages, so a change upstream fails here before it fails a release.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# A new push replaces a pull request's run; main queues, so no release is cut
# short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release pull request, or once that is merged, the tag and a draft page.
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release branch, the tag and the page
      pull-requests: write # the release pull request
    outputs:
      version: ${{ steps.please.outputs.version }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: please

  # `make check` on today's Arch, as at a desk. On main only for a release: the
  # pull request checked everything else.
  check:
    name: Check
    needs: release
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.release.outputs.version != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: archlinux:latest # zizmor: ignore[unpinned-images] - upgraded below
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      # Restored everywhere, saved on main only: a pull request's cache serves
      # no other pull request.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-

      # multilib, since the Installer's lib32 package names are checked too. The
      # checkout is the runner's user's, and git refuses it to root.
      - run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          pacman -Syu --needed --noconfirm git pacman-contrib make curl shellcheck shfmt zsh yamllint \
            actionlint zizmor gettext diffutils gitleaks kbd terminus-font tzdata
          paccache -rk1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Two deep: a pull request's merge commit and the main it lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The runtime's checksum is an API call: sixty an hour per address
      # without a token.
      - run: make check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Nothing under docs/, no Markdown and no LICENSE reaches an image.
      - id: scope
        run: |
          image=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            status=0
            git diff --quiet HEAD^1 HEAD -- ':!docs/' ':!*.md' ':!LICENSE' || status=$?
            case "$status" in
            0) image=false ;;
            1) ;;
            *) exit "$status" ;;
            esac
          fi
          echo "image=${image}" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /var/cache/pacman/pkg
          key: ${{ github.job }}-${{ github.run_id }}

  # The images, built, booted and installed in one job: the gigabytes between
  # building and booting cost more to hand on than to make.
  image:
    name: Image
    needs: [release, check]
    if: ${{ !cancelled() && needs.check.outputs.image == 'true' }}
    runs-on: ubuntu-24.04
    # Above the boot scripts' own limits, so they fail first and say why.
    timeout-minutes: 180
    container:
      image: archlinux:latest # zizmor: ignore[unpinned-images] - upgraded below
      # pacstrap mounts inside the airootfs, and qemu without KVM is too slow.
      options: --privileged --device /dev/kvm
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-

      - run: |
          pacman -Syu --needed --noconfirm git pacman-contrib make curl archiso systemd-ukify diffutils \
            kbd terminus-font qemu-base edk2-ovmf tesseract tesseract-data-eng openssh libisoburn
          paccache -rk1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: make tarball image ${RELEASE:+VERSION="$RELEASE"}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # After the build, since mkarchiso fills the live systems through it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /var/cache/pacman/pkg
          key: ${{ github.job }}-${{ github.run_id }}

      # What a release publishes, or a run by hand offers to boot. Before the
      # boots, so a failed one still leaves the image to look at.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: arch-os
          path: |
            dist/*.iso
            dist/*.tar.gz
            dist/*.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - run: make smoke
        env:
          TIMEOUT: 600 # a slow boot is not a failed boot

      - run: make e2e

      # GNOME, the drivers, the browsers and the AUR, weekly and by hand.
      - run: make e2e START=desktop
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

      # On a failure, what the machine was showing is all there is to go on.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: boot-tests
          path: |
            dist/smoke/*/*.png
            dist/e2e/*.png
            dist/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The files the image job booted, signed and hung on the draft, which goes
  # public last.
  publish:
    name: Publish
    needs: [release, image]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the assets and the page
      id-token: write # signs the provenance
      attestations: write # stores it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch-os
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Named, so a file built under any other version fails here.
      - run: |
          gh release upload "$TAG" --clobber \
            "dist/arch-os-${VERSION}-x86_64.iso" \
            "dist/arch-os-${VERSION}-x86_64.tar.gz" \
            "dist/arch-os-${VERSION}-recovery-x86_64.tar"
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
