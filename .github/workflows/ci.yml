# A commit is built exactly once. The image and the tarball a tag produces here
# are the ones its release is published from, so what was checked and booted is
# bit for bit what is downloaded. See docs/CONTRIBUTING.md.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

# Keyed so a branch and its pull request share one group: only the newer of the
# two runs. On main and on a tag nothing is cancelled — that is the run that
# releases.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `make check` and nothing this file adds to it: what is checked lives in the
  # Makefiles, so a rule that holds in CI holds at a desk.
  #
  # Nothing here needs a Go toolchain. The runtime is Oak, a project of its own,
  # and every job that needs it downloads the release the Makefile pins.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      # Before the checkout: without git, actions/checkout falls back to a
      # tarball, and then there is no HEAD for a version to come from.
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make curl shellcheck shfmt yamllint actionlint gettext diffutils

      - run: make check

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: gitleaks

      # This project is installed by piping a script into a shell. A credential
      # that reached the repository would be handed to everybody who did that.
      - name: Secrets in the repository
        run: gitleaks dir . --redact --no-banner

  # The only job that assembles anything. Everything downstream downloads this
  # artefact rather than building again.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5
        with:
          # The version is `git describe`, which needs the tags to describe
          # anything. Without them every build here would be named after a SHA.
          fetch-depth: 0

      - uses: ./.github/actions/arch
        with:
          packages: make curl

      - run: make tarball

      # What ships is what was checked, rather than what was checked plus
      # whatever the packaging did to it. `--inspect` loads a product the way a
      # run does, so this asks of the whole unpacked release what `make check`
      # asks of each module in the tree.
      - name: The tarball holds a working release
        run: |
          unpacked="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          for release in "$unpacked"/*; do
            "$release/oak" --inspect
          done
          (cd dist && sha256sum -c ./*.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/
          retention-days: 7

  # An archiso build is a quarter of an hour, and a work in progress does not
  # need an image. Run this workflow by hand on a branch to get one.
  iso:
    name: ISO
    needs: [check, security, build]
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref_name == 'main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
      # pacstrap mounts /proc and /sys inside the airootfs it is filling.
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5
        with:
          # The image is named after the same version the tarball is.
          fetch-depth: 0

      - uses: ./.github/actions/arch
        with:
          packages: make archiso

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: tarball

      # The image is built out of the file that gets published, so what boots
      # here is what a download unpacks. Kept out of dist/, which this job fills
      # with the image.
      - name: Unpack the release
        run: |
          (cd tarball && sha256sum -c ./*.sha256)
          mkdir -p release
          tar -xzf tarball/*.tar.gz --strip-components=1 -C release

      - run: make -C iso build

      - uses: actions/upload-artifact@v7
        with:
          name: iso
          path: dist/
          retention-days: 7

  # The only job that finds out whether the thing actually starts.
  smoke:
    name: Boot test
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      # qemu falls back to emulation without it, which the timeout below would
      # not sit through.
      options: --device /dev/kvm
    permissions:
      contents: read
    env:
      # Generous on purpose: a slow boot is not a failed boot, and a run that
      # passes never waits this long.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Sy --needed --noconfirm git

      - uses: actions/checkout@v5

      - uses: ./.github/actions/arch
        with:
          packages: make qemu-base edk2-ovmf tesseract tesseract-data-eng

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      - run: make -C iso smoke

      # On a failure this is the only account of what the machine was showing
      # when it gave up.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console
          path: iso/smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Nothing is built here. A tag publishes the artefacts the jobs above checked
  # and booted — the same bytes, under a version.
  release:
    name: Release
    needs: [check, security, build, iso, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the provenance below is signed
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: iso
          path: dist

      # Two ways in, one outcome. A tag pushed from a terminal has no release
      # yet, so this writes one; a release published from the web page has the
      # tag and the notes already, so this only hangs the files on it. Either
      # way the step can be run again on a half-finished run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "Arch OS $VERSION" \
              --generate-notes
          fi

      # Which commit and which run these files came out of, signed.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.iso
            dist/*.tar.gz
