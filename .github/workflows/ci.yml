# One workflow, and a change is under exactly one run of it. Which job runs
# when is the table in docs/CONTRIBUTING.md.

name: CI

on:
  # Other branches are checked through their pull request.
  push:
    branches: [main]
  # Not the release pull request, which touches these three alone: it starts
  # no run, and the release job below reports its checks instead. A pull
  # request that changes only these three is held back for the same reason.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - oak.yaml
  workflow_dispatch:
  # Arch moves every day: the images are built, booted and installed on that
  # Monday's packages, so a change upstream fails a run before a release.
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

# -o pipefail on every step.
defaults:
  run:
    shell: bash

# A newer push replaces the run of the one before, except on main, which
# releases, and a run started by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_name != 'main' }}

# Runners and actions are pinned and raised by Dependabot. The container is
# not: every job upgrades it to today's Arch first, which is what this is
# checked against.
jobs:
  # `make check` is the whole gate, so what holds at a desk holds here.
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: archlinux:latest # zizmor: ignore[unpinned-images] - upgraded below
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      # Without git, actions/checkout falls back to a tarball, which is not a
      # repository.
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      # Two deep: a pull request's merge commit and the main it lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: make curl shellcheck shfmt zsh yamllint actionlint zizmor gettext diffutils gitleaks kbd terminus-font tzdata

      # The runtime's checksum is an API call, which gets sixty an hour per
      # address without a token.
      - run: make check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Nothing under docs/ and no Markdown goes into a release or an image.
      - name: The change reaches the image
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- ':!docs/' ':!*.md' ':!LICENSE'; then
            echo "image=false" >>"$GITHUB_OUTPUT"
          else
            echo "image=true" >>"$GITHUB_OUTPUT"
          fi

  # The version out of the commits since the last release. An ordinary merge
  # updates the release pull request, and merging that one writes the tag and
  # a draft release page. The release pull request starts no run, so this
  # reports the two checks main asks of it; its merge is checked on main.
  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release page
      pull-requests: write # the release pull request
      statuses: write # the two checks it is cleared by
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
      version: ${{ steps.please.outputs.version }}
      notes: ${{ steps.please.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: please

      # The branch of the release pull request this run left open, if any. The
      # label is read off the list, since a search lags the label this run has
      # just set.
      - name: The release pull request
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="$(gh pr list --state open --json headRefName,labels \
            --jq '[.[] | select(any(.labels[]; .name == "autorelease: pending")) | .headRefName] | first // empty')"
          echo "branch=${branch}" >>"$GITHUB_OUTPUT"

      # On the commit the branch ends on now, read off the branch rather than
      # the pull request, which follows a few seconds later.
      - name: The release pull request is cleared to merge
        if: steps.pending.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pending.outputs.branch }}
        run: |
          sha="$(gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          for check in Ready Title; do
            gh api --silent "repos/${GH_REPO}/statuses/${sha}" -f state=success -f context="$check" \
              -f description="Release pull request - checked on main once merged"
          done

  # The pictures in the docs, rendered onto a pull request's branch at the
  # release it leads to. The push starts no run, so Ready clears the commit it
  # pushes. A fork's branch is not ours to push to.
  #
  # On the runner itself: the pictures need an Arch container booted with
  # systemd, which a job container is not. See .github/pictures.sh.
  pictures:
    name: Pictures
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the pictures, onto the branch
    outputs:
      sha: ${{ steps.render.outputs.sha }}
    steps:
      # Two deep: the merge commit this run checks and the main it lands on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: render
        run: .github/pictures.sh "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}

  # The images, booted and installed: one job, because the gigabyte between
  # building and booting costs more to hand on than to make. A fork is not
  # handed a privileged container.
  image:
    name: Image
    needs: [check, release]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && (
        needs.release.outputs.created == 'true'
        || github.event_name == 'workflow_dispatch'
        || github.event_name == 'schedule'
        || (needs.check.outputs.image == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository)
      ) }}
    runs-on: ubuntu-24.04
    # Above the boot scripts' own limits, so they fail first and say why.
    timeout-minutes: 120
    container:
      image: archlinux:latest # zizmor: ignore[unpinned-images] - upgraded below
      # pacstrap mounts inside the airootfs, and qemu without KVM is too slow.
      options: --privileged --device /dev/kvm
    permissions:
      contents: read
    env:
      # A slow boot is not a failed boot.
      TIMEOUT: 600
    steps:
      - name: Make the checkout a repository
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/arch
        with:
          packages: make curl archiso systemd-ukify kbd terminus-font qemu-base edk2-ovmf tesseract tesseract-data-eng openssh libisoburn

      # Anything but a release is named after the next one, which the open
      # release pull request names.
      - name: The release pull request's version
        env:
          BRANCH: release-please--branches--main
        run: |
          status=0
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null || status=$?
          case "$status" in
          0) git fetch --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" ;;
          2) echo "No release pull request is open" ;;
          *) exit "$status" ;;
          esac

      # A release under its own number, which its run hands in.
      - run: make tarball ${RELEASED:+VERSION="$RELEASED"}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.release.outputs.version }}

      # Out of the release just packed, not a second build of it.
      - run: make image

      - run: make smoke

      - run: make e2e

      # On a failure, what the machine was showing is all there is to go on.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: boot-tests
          path: |
            dist/smoke/*/*.png
            dist/e2e/*.png
            dist/e2e/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Every download under one name: what a release offers, and what a review
      # can boot by hand. Kept after a failed boot, which is when that happens.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          if-no-files-found: ignore
          name: arch-os
          path: |
            dist/*.tar.gz
            dist/*.tar
            dist/*.iso
          retention-days: 7

  # The one check main requires of a pull request, so a job added above is
  # required the moment it is listed here.
  ready:
    name: Ready
    needs: [check, image, pictures]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read # the title's check on the commit this run checked
      statuses: write # Ready and Title on the pictures' commit
    steps:
      - name: Every job this pull request needed came out well
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
            success | skipped) ;;
            *)
              echo "::error::a job this pull request needs ended as ${result}"
              exit 1
              ;;
            esac
          done

      # The pictures' commit starts no run and sits on the merge commit this
      # run checked, so it carries this run's Ready and the title's check on
      # the pull request's head.
      - name: The pictures' commit is cleared to merge
        if: needs.pictures.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.pictures.outputs.sha }}
          CHECKED: ${{ github.event.pull_request.head.sha }}
        run: |
          checks=(Ready)
          title="$(gh api "repos/${GH_REPO}/commits/${CHECKED}/check-runs?check_name=Title" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$title" -gt 0 ]; then
            checks+=(Title)
          else
            echo "::warning::Title has not passed on ${CHECKED}, so ${SHA} waits for it - edit the title to check it again"
          fi
          for check in "${checks[@]}"; do
            gh api --silent "repos/${GH_REPO}/statuses/${SHA}" -f state=success -f context="$check" \
              -f description="Pictures on the merge of ${CHECKED:0:7} this run checked"
          done

  # The files this run built and booted, hung on the draft page under the
  # version it decided. The page is made public last, once all of them are on
  # it.
  publish:
    name: Publish
    needs: [release, image]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the assets and the page they hang on
      id-token: write # the provenance below is signed
      attestations: write # and stored beside the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch-os
          path: dist

      - name: The files are the ones this tag names
        run: |
          for file in "arch-os-${VERSION}-x86_64.tar.gz" "arch-os-${VERSION}-recovery-x86_64.tar" "arch-os-${VERSION}-x86_64.iso"; do
            if [ ! -f "dist/${file}" ]; then
              echo "::error::${file} is not among what this run built"
              ls -1 dist
              exit 1
            fi
          done

      - name: Sign the provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar
            dist/*.iso

      # Written whole rather than appended, so a repeated run leaves the page
      # saying the same thing.
      - name: Publish the release
        env:
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          [ -n "$NOTES" ] || {
            echo "::error::${TAG} was released with nothing written under it"
            exit 1
          }

          notes="${RUNNER_TEMP}/notes.md"
          printf '%s\n' "$NOTES" >"$notes"
          cat >>"$notes" <<FOOTER

          ---

          Boot the ISO on the machine to install, or run this on any Linux machine - what opens is decided by the machine it opened on:

          \`\`\`
          curl -Ls https://bit.ly/archos | bash
          \`\`\`

          | File | Description |
          | --- | --- |
          | \`arch-os-${VERSION}-x86_64.iso\` | The bootable image: Installer and Recovery, started on its own |
          | \`arch-os-${VERSION}-x86_64.tar.gz\` | The same program without the image: unpack it and run \`./oak\`. On a live image it installs or repairs, anywhere else the Imager writes the device above to a USB stick |
          | \`arch-os-${VERSION}-recovery-x86_64.tar\` | The Recovery the Installer writes to a partition of its own - carried by the ISO, and fetched from here on any other live image |

          All three carry signed build provenance: which repository the file came out of, and which run built it:

          \`\`\`
          gh attestation verify arch-os-${VERSION}-x86_64.iso -R ${GH_REPO}
          \`\`\`

          Without \`gh\`, GitHub prints each download's SHA-256 beside it on this page, which says only that the file arrived whole.
          FOOTER

          gh release upload "$TAG" dist/*.tar.gz dist/*.tar dist/*.iso --clobber
          gh release edit "$TAG" --notes-file "$notes" --draft=false --latest
