# The title becomes the commit on main, and the version and the changelog are
# read out of it. A file of its own, so renaming a pull request reads the title
# again and builds nothing.

name: Title

on:
  # synchronize too: main asks for this check on the commit a pull request
  # ends on. Not the release pull request - see ci.yml.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - oak.yaml

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The title says what kind of change this is
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .' <<<"$TITLE"; then
            echo "::error::'${TITLE}' opens on no type - feat:, fix:, feat!: … see docs/CONTRIBUTING.md"
            exit 1
          fi
          printf 'This title reads as a release line:\n\n    %s\n' "$TITLE" >>"$GITHUB_STEP_SUMMARY"
