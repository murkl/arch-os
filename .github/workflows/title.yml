# The title becomes the squash commit on main, the only target branch, which
# release-please reads. Separate, so editing a title reruns only this.

name: Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          [ "$BASE" = main ] || {
            echo "::error::Base branch is '${BASE}'. Set it to main."
            exit 1
          }
          grep -qE '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .' <<<"$TITLE" || {
            echo "::error::'${TITLE}' has no type prefix: feat:, fix:, feat!: …"
            exit 1
          }
