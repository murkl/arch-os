name: Build & Release Arch OS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded PR runs; let main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: pacman -Syu --noconfirm go shellcheck shfmt curl make

      - name: Check Go formatting
        run: |
          unformatted="$(cd runtime && gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: ${unformatted}"
            exit 1
          fi

      # Vets, tests and builds the runtime; loads the setup tree exactly as
      # the runtime does at startup and lints every task; shellchecks and
      # shfmts the ISO scripts. See each component's own Makefile.
      - name: Check runtime, setup tree and ISO scripts
        run: make check

  # Runs on every merge into main. There is no version to bump: the short
  # commit SHA that names the release is unique by construction, so a release
  # is built and published on every push.
  release:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # HEAD's short SHA is the version; nothing else needs history

      - name: Version
        id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: pacman -Syu --noconfirm archiso sudo go make

      - name: Build Arch OS ISO
        run: make iso

      # The image and its checksum out of release/iso, and beside them the two
      # files that turn a stock Arch ISO into the same installer. tasks/ is a
      # folder and a release asset is a file, so it is not among them — a
      # checkout is where that comes from.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Arch OS ${{ steps.version.outputs.version }}
          files: |
            ./release/iso/*
            ./release/installer
            ./release/installer.yaml
          generate_release_notes: true
