# Static analysis that follows a value across functions, which is the one thing
# vet and staticcheck do not do.
#
# Deliberately not part of CI: a finding here belongs in the security tab, not
# in the way of a release. It runs on what is about to be released and once a
# week on what already is, because a vulnerability found in a dependency last
# Tuesday is news about code that has not changed since.

name: CodeQL

on:
  push:
    branches: [dev, main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      # Manual, because the module is in runtime/ rather than at the root, which
      # is the one thing the automatic build looks for.
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - run: make -C runtime build

      - uses: github/codeql-action/analyze@v4
