# Actions kept current without anybody remembering to. The pull requests go to
# dev, like every other change.
#
# The runtime is not a dependency Dependabot can see: it is downloaded from its
# own project at build time — see the root Makefile.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
