# One pull request a week, titled as title.yml demands. A release is taken
# after a week: a compromised one is usually pulled by then. Oak is pinned in
# the Makefile, not here.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
