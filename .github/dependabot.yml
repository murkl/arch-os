# Titles pass title.yml. Releases wait 7 days, since a compromised one is
# usually pulled by then. Crates stay pinned by runtime/Cargo.lock and are
# raised by hand.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
