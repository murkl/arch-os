# Titled ci:. Releases wait 7 days, since a compromised one is usually pulled
# by then, except for murkl/workflows. Crates stay pinned by runtime/Cargo.lock
# and are raised by hand.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["murkl/*"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
