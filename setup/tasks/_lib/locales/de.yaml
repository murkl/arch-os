# Deutsch — Übersetzung des Installer-Ordners.
#
# Links steht der englische Quelltext aus den YAML-Dateien; er ist zugleich der
# Schlüssel. Was hier fehlt, bleibt englisch.
#
# Diese Datei erzeugen: `installer -strings` gibt jeden übersetzbaren Text des
# Ordners als leeren Katalog aus — nach jeder Änderung erneut ausführen, dann
# stehen neue Texte automatisch mit drin.
language: Deutsch
messages:
  "Arch OS Installer": "Arch OS Installer"

  ? |-
    Arch Linux will be installed on {{ARCH_OS_DISK}} as {{ARCH_OS_HOSTNAME}}.

    Everything on that disk will be erased. There is no undo, and nothing before this point has changed anything.
  : |-
    Arch Linux wird auf {{ARCH_OS_DISK}} als {{ARCH_OS_HOSTNAME}} installiert.

    Alles auf diesem Datenträger wird gelöscht. Das lässt sich nicht rückgängig machen, und bis zu diesem Punkt wurde nichts verändert.

  "Type installer at the prompt to start it again.": "Mit dem Befehl installer startest du ihn wieder."

  # ─── WLAN ──────────────────────────────────────────────────────────────────
  "WLAN": "WLAN"
  "Join a wireless network to continue.": "Verbinde dich mit einem WLAN, um fortzufahren."

  # ─── Presets ───────────────────────────────────────────────────────────────
  "Setup": "Einrichtung"
  "Choose what kind of system to install. Every detail can still be changed afterwards.": "Wähle, welche Art von System installiert werden soll. Jede Einzelheit lässt sich danach noch ändern."
  "Desktop": "Desktop"
  "A full GNOME desktop with drivers, codecs, fonts and everyday applications.": "Ein vollständiger GNOME-Desktop mit Treibern, Codecs, Schriften und den Programmen für den Alltag."
  "Minimal": "Minimal"
  "Arch Linux on the console only — no desktop, no extras, nothing that was not asked for.": "Arch Linux nur auf der Konsole — kein Desktop, keine Extras, nichts Ungefragtes."

  # ─── Region ────────────────────────────────────────────────────────────────
  "Region": "Region"
  "Language and region": "Sprache und Region"
  "The language and country this system is set up for, as a locale code — de_DE is German as it is written in Germany. It settles the system language and the formats for dates, numbers and currency, and — left on auto — the keyboard, the console font, the time zone and the mirror country follow from it. English is always installed alongside it as a fallback.": "Sprache und Land, für die dieses System eingerichtet wird, als Locale-Code — de_DE ist Deutsch, wie es in Deutschland geschrieben wird. Das legt die Sprache des Systems und die Formate für Datum, Zahlen und Währung fest; Tastatur, Konsolenschrift, Zeitzone und Spiegelserver-Land richten sich danach, solange sie auf auto stehen. Englisch wird immer zusätzlich als Rückfallebene installiert."
  "Console keyboard": "Konsolentastatur"
  "The keyboard you are typing on. It is loaded here and now, and it is what the new system uses on the text console. auto is the layout the system language is typed on, which is only settled further down.": "Die Tastatur, auf der du gerade tippst. Sie wird sofort geladen und ist zugleich die Belegung der Textkonsole des neuen Systems. auto ist die Belegung, auf der die Systemsprache getippt wird — die weiter unten festgelegt wird."
  "Console font": "Konsolenschrift"
  "The font of the text console. auto is the one that can draw the chosen language; a larger one helps on a high resolution screen.": "Die Schrift der Textkonsole. auto ist die, die die gewählte Sprache darstellen kann; eine größere hilft auf einem hochauflösenden Bildschirm."
  "Type a font name": "Schriftnamen eingeben"
  "Time zone": "Zeitzone"
  "Where this machine is, so the clock is right. The list opens on the zone the chosen country keeps — which is the only answer in a country that keeps one, and the one most of it lives in where there are several.": "Wo dieser Rechner steht, damit die Uhr stimmt. Die Liste öffnet auf der Zeitzone des gewählten Landes — in einem Land mit nur einer ist das die Antwort, in einem mit mehreren die, in der die meisten leben."
  "Mirror country": "Spiegelserver-Land"
  "Where package downloads are fetched from. auto is the country the chosen language belongs to; none ranks every mirror worldwide by speed, which is also what auto comes to where Arch has no mirror.": "Woher Pakete geladen werden. auto ist das Land, zu dem die gewählte Sprache gehört; none sortiert weltweit alle Spiegelserver nach Geschwindigkeit — worauf auch auto hinausläuft, wo Arch keinen Spiegelserver hat."
  "Type a country": "Land eingeben"

  # ─── Identität ─────────────────────────────────────────────────────────────
  "Identity": "Identität"
  "User name": "Benutzername"
  "The account you will log in with. Lower case letters, digits, hyphen and underscore. It must not start with a digit.": "Das Konto, mit dem du dich anmeldest. Kleinbuchstaben, Ziffern, Bindestrich und Unterstrich. Darf nicht mit einer Ziffer beginnen."
  "Lower case letters, digits, hyphen and underscore only, at most 32 characters. It must not start with a digit.": "Nur Kleinbuchstaben, Ziffern, Bindestrich und Unterstrich, höchstens 32 Zeichen. Darf nicht mit einer Ziffer beginnen."
  "Password": "Passwort"
  "Used for your account, for the root account, and — where disk encryption is on — to unlock the disk at boot. It is asked for immediately before the installation starts and is never written to a file.": "Gilt für dein Konto, für das Konto root und — bei aktiver Verschlüsselung — zum Entsperren des Datenträgers beim Start. Es wird unmittelbar vor der Installation abgefragt und nie in eine Datei geschrieben."
  "Host name": "Rechnername"
  "The name this machine has on the network.": "Der Name, unter dem dieser Rechner im Netzwerk erscheint."
  "Lower case letters, digits and hyphen only, at most 63 characters. It must not start or end with a hyphen.": "Nur Kleinbuchstaben, Ziffern und Bindestrich, höchstens 63 Zeichen. Darf nicht mit einem Bindestrich beginnen oder enden."

  # ─── Datenträger ───────────────────────────────────────────────────────────
  "Storage": "Speicher"
  "Disk": "Datenträger"
  "The disk Arch Linux is installed on. Unless dual boot is switched on, everything on it is erased.": "Der Datenträger, auf dem Arch Linux installiert wird. Ohne Dual-Boot wird alles darauf gelöscht."
  "Choose a disk that exists.": "Wähle einen vorhandenen Datenträger."
  "File system": "Dateisystem"
  "btrfs supports snapshots, so a system update can be rolled back. ext4 is simpler and does not.": "btrfs beherrscht Schnappschüsse, ein Update lässt sich damit zurücknehmen. ext4 ist einfacher und kann das nicht."
  "Disk encryption": "Verschlüsselung"
  "Encrypts the whole system with your password, so the data cannot be read by taking the disk out. The password is then asked for at every boot.": "Verschlüsselt das gesamte System mit deinem Passwort, sodass die Daten durch Ausbau des Datenträgers nicht lesbar sind. Das Passwort wird dann bei jedem Start abgefragt."
  "Snapshots": "Schnappschüsse"
  "Takes a snapshot before every package transaction and cleans up old ones on a timer, so a bad update can be undone.": "Legt vor jeder Paketänderung einen Schnappschuss an und räumt alte automatisch auf, sodass sich ein misslungenes Update zurücknehmen lässt."
  "Snapshot manager": "Schnappschuss-Verwaltung"
  "A desktop application for browsing and restoring snapshots.": "Ein Desktop-Programm zum Durchsehen und Wiederherstellen von Schnappschüssen."
  "Dual boot": "Dual-Boot"
  "Install alongside a system that is already on this disk: nothing is partitioned or erased, the existing EFI partition is reused, and only a boot entry is added. You then have to name the two partitions yourself.": "Neben einem System installieren, das schon auf diesem Datenträger liegt: es wird nicht partitioniert und nichts gelöscht, die vorhandene EFI-Partition wird weiterverwendet und nur ein Starteintrag ergänzt. Die beiden Partitionen musst du dann selbst angeben."
  "Boot partition": "Boot-Partition"
  "The existing EFI partition to add a boot entry to. It is not formatted.": "Die vorhandene EFI-Partition, die einen Starteintrag bekommt. Sie wird nicht formatiert."
  "Root partition": "System-Partition"
  "The partition Arch Linux is installed into. It is formatted and everything on it is lost.": "Die Partition, in die Arch Linux installiert wird. Sie wird formatiert, alles darauf geht verloren."

  # ─── Start ─────────────────────────────────────────────────────────────────
  "Boot": "Start"
  "Boot loader": "Bootloader"
  "systemd-boot is small and needs no maintenance. GRUB can show a menu of btrfs snapshots to boot into.": "systemd-boot ist klein und wartungsfrei. GRUB kann ein Menü mit btrfs-Schnappschüssen zum Starten anzeigen."
  "Kernel": "Kernel"
  "linux-zen is tuned for desktop responsiveness. linux is the stock kernel, linux-lts a long-term one, linux-hardened a security-focused one.": "linux-zen ist auf einen reaktionsschnellen Desktop abgestimmt. linux ist der Standardkernel, linux-lts der langfristig gepflegte, linux-hardened der sicherheitsgehärtete."
  "Kernel parameters": "Kernel-Parameter"
  "Extra parameters passed to the kernel at boot, separated by spaces. Leave empty unless you know you need one.": "Zusätzliche Parameter, die dem Kernel beim Start übergeben werden, durch Leerzeichen getrennt. Leer lassen, solange du keinen brauchst."
  "The characters comma, ampersand and backslash cannot be used here.": "Die Zeichen Komma, Und-Zeichen und Backslash sind hier nicht möglich."
  "Processor firmware": "Prozessor-Firmware"
  "Firmware updates loaded at boot. auto is whatever this processor turns out to be — which is the answer on every machine that is not being prepared for a different one.": "Firmware-Aktualisierungen, die beim Start geladen werden. auto ist das, was dieser Prozessor tatsächlich ist — also die Antwort auf jedem Rechner, der nicht für einen anderen vorbereitet wird."

  # ─── Desktop ───────────────────────────────────────────────────────────────
  "Install the GNOME desktop. Without it the system starts into a text console and nothing graphical is installed at all.": "Den GNOME-Desktop installieren. Ohne ihn startet das System in eine Textkonsole und es wird nichts Grafisches installiert."
  "Graphics driver": "Grafiktreiber"
  "mesa is the open driver and fits almost every machine. Pick one matching your card only if you know you need it.": "mesa ist der offene Treiber und passt auf fast jeden Rechner. Wähle nur dann einen zu deiner Karte passenden, wenn du weißt, dass du ihn brauchst."
  "Desktop keyboard": "Desktop-Tastatur"
  "The keyboard layout the desktop starts with. auto is the same choice as the console keyboard, in the names the desktop uses for it — de-latin1 and de are one layout.": "Die Tastaturbelegung, mit der der Desktop startet. auto ist dieselbe Wahl wie bei der Konsolentastatur, nur in den Namen des Desktops — de-latin1 und de sind eine Belegung."
  "Keyboard variant": "Tastaturvariante"
  "A variation of that layout — dead keys, a different punctuation arrangement. none is the standard one.": "Eine Abwandlung dieser Belegung — tote Tasten, eine andere Anordnung der Satzzeichen. none ist die Standardvariante."
  "Keyboard model": "Tastaturmodell"
  "The physical shape of the keyboard. pc105 fits almost every keyboard sold.": "Die Bauform der Tastatur. pc105 passt auf fast jede erhältliche Tastatur."
  "Desktop extras": "Desktop-Extras"
  "Codecs, fonts, printing, network protocols, development tools and the applications that make the desktop usable straight away.": "Codecs, Schriften, Druck, Netzwerkprotokolle, Entwicklungswerkzeuge und die Programme, die den Desktop sofort brauchbar machen."
  "Slim desktop": "Schlanker Desktop"
  "Removes the GNOME applications that come with the desktop and are rarely used.": "Entfernt die GNOME-Programme, die mit dem Desktop kommen und selten benutzt werden."
  "Log in automatically": "Automatisch anmelden"
  "Skips the login screen. auto follows disk encryption: with the disk already unlocked by a password at boot, a second one at login adds nothing — and without encryption the login screen is the only thing standing there.": "Überspringt die Anmeldemaske. auto folgt der Verschlüsselung: ist der Datenträger beim Start schon per Passwort entsperrt, bringt ein zweites bei der Anmeldung nichts — und ohne Verschlüsselung ist die Anmeldemaske das Einzige, was überhaupt davorsteht."
  "File sharing": "Dateifreigabe"
  "Shares your home folder and a public folder on the local network, readable by Windows and macOS.": "Gibt dein Benutzerverzeichnis und einen öffentlichen Ordner im lokalen Netz frei, lesbar von Windows und macOS."

  # ─── System ────────────────────────────────────────────────────────────────
  "System": "System"
  "System tweaks": "System-Feinschliff"
  "Small adjustments that do not change what is installed: parallel package downloads, a quieter boot, password feedback in the terminal.": "Kleine Anpassungen, die nichts an den installierten Paketen ändern: parallele Downloads, ein ruhigerer Start, Rückmeldung bei der Passworteingabe im Terminal."
  "Boot splash": "Startbildschirm"
  "Shows a logo while the system starts instead of a wall of text.": "Zeigt beim Start ein Logo statt einer Textwand."
  "32-bit support": "32-Bit-Unterstützung"
  "Needed by Steam, Wine and other software that is still 32-bit.": "Wird von Steam, Wine und anderer Software gebraucht, die noch 32-bittig ist."
  "AUR helper": "AUR-Helfer"
  "Installs software from the Arch User Repository as easily as from the official one.": "Installiert Software aus dem Arch User Repository so einfach wie aus dem offiziellen."
  "Housekeeping": "Systempflege"
  "Timers that keep the system tidy on their own: mirrors ranked weekly, the package cache trimmed, disk health watched.": "Zeitgesteuerte Aufgaben, die das System von selbst in Ordnung halten: Spiegelserver werden wöchentlich sortiert, der Paketzwischenspeicher geleert, die Laufwerksgesundheit überwacht."
  "Shell enhancement": "Bessere Shell"
  "A better terminal out of the box: a prompt showing git state, colourful listings, fuzzy search, useful aliases.": "Ein besseres Terminal ohne Nacharbeit: eine Eingabezeile mit Git-Status, farbige Auflistungen, unscharfe Suche, sinnvolle Kurzbefehle."
  "Fish shell": "Fish-Shell"
  "Installs fish alongside bash, with completion and suggestions as you type.": "Installiert fish neben bash, mit Vervollständigung und Vorschlägen beim Tippen."
  "Arch OS Manager": "Arch OS Manager"
  "A menu for updating, cleaning up and repairing the system after installation.": "Ein Menü zum Aktualisieren, Aufräumen und Reparieren des Systems nach der Installation."
  "Virtual machine support": "Unterstützung für virtuelle Maschinen"
  "Installs guest tools when this is running inside a virtual machine, so the screen resizes and the clipboard is shared. Does nothing on real hardware.": "Installiert Gasterweiterungen, wenn das hier in einer virtuellen Maschine läuft, damit sich der Bildschirm anpasst und die Zwischenablage geteilt wird. Auf echter Hardware passiert nichts."
  "Explicit congestion notification": "ECN-Überlastungsanzeige"
  "Leave on. Turning it off helps only behind old routers that drop connections which use it.": "Eingeschaltet lassen. Ausschalten hilft nur hinter alten Routern, die Verbindungen damit abbrechen."

  # ─── Stufen ────────────────────────────────────────────────────────────────
  "Prepare the installation": "Installation vorbereiten"
  "Set up the disk": "Datenträger einrichten"
  "Install the base system": "Basissystem installieren"
  "Configure the system": "System konfigurieren"
  "Install the boot loader": "Bootloader installieren"
  "Create your account": "Benutzerkonto anlegen"
  "Enable 32-bit support": "32-Bit-Unterstützung einschalten"
  "Install the AUR helper": "AUR-Helfer installieren"
  "Install the boot splash": "Startbildschirm installieren"
  "Set up housekeeping": "Systempflege einrichten"
  "Enhance the shell": "Shell verbessern"
  "Install the GNOME desktop": "GNOME-Desktop installieren"
  "Install the graphics driver": "Grafiktreiber installieren"
  "Install Arch OS Manager": "Arch OS Manager installieren"
  "Add virtual machine support": "Unterstützung für virtuelle Maschinen ergänzen"

  # ─── Nach der Installation ─────────────────────────────────────────────────

  # ─── Was die Tasks tun ─────────────────────────────────────────────────────
  System check: Systemprüfung
  Build the initial ram disk: Initiale Ramdisk bauen
  Apply the core tweaks: Systemfeinschliff anwenden
  Switch on the system services: Systemdienste einschalten
  Set up snapshots: Schnappschüsse einrichten
  Share files with other machines: Dateifreigabe einrichten
  Prepare the first login: Erste Anmeldung vorbereiten
  Snapshot on every update: Schnappschuss vor jedem Update
  Tidy up: Aufräumen
  Sign the boot chain: Boot-Kette signieren
  Keep a copy of this installation: Kopie dieser Installation ablegen
  Enter the new system: In das neue System wechseln
  Restart into the new system: In das neue System neu starten
  Unmount everything: Alles aushängen

  # ─── Was sie vorher fragen ─────────────────────────────────────────────────
  ? |-
    Open a shell inside the system that was just installed?

    Everything is still mounted, so this is the moment to look around or fix something by hand. Leave it again with `exit`.
  : |-
    Eine Shell im soeben installierten System öffnen?

    Es ist noch alles eingehängt — der richtige Moment, um sich umzusehen oder von Hand etwas zu richten. Mit `exit` geht es zurück.
  ? |-
    Restart into {{ARCH_OS_HOSTNAME}} now?

    Everything is unmounted first. Remove the installation medium once the screen goes blank.
  : |-
    Jetzt in {{ARCH_OS_HOSTNAME}} neu starten?

    Vorher wird alles ausgehängt. Nimm das Installationsmedium heraus, sobald der Bildschirm schwarz wird.
  ? |-
    Unmount the new system and stay in the live environment?

    Nothing is lost either way — the installation is finished. Leaving it mounted is only useful if you want to keep working on it from here.
  : |-
    Das neue System aushängen und in der Live-Umgebung bleiben?

    Verloren geht so oder so nichts, die Installation ist fertig. Eingehängt zu lassen lohnt nur, wenn du von hier aus weiterarbeiten willst.
