# Written into ~/.config/environment.d by the installer.

# The GNOME keyring's ssh agent, so keys are unlocked with the login.
# https://wiki.archlinux.org/title/GNOME/Keyring#Setup_gcr
SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/gcr/ssh

PATH="${PATH}:${HOME}/.local/bin:/var/lib/flatpak/exports/bin"

XDG_CONFIG_HOME="${HOME}/.config"
XDG_DATA_HOME="${HOME}/.local/share"
XDG_STATE_HOME="${HOME}/.local/state"
XDG_CACHE_HOME="${HOME}/.cache"
