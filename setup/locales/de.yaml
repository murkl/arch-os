  # ─── Nach der Installation ─────────────────────────────────────────────────

  # ─── Was die Tasks tun ─────────────────────────────────────────────────────
  Build the initial ram disk: Initiale Ramdisk bauen
  Apply the core tweaks: Systemfeinschliff anwenden
  Switch on the system services: Systemdienste einschalten
  Set up snapshots: Schnappschüsse einrichten
  Share files with other machines: Dateifreigabe einrichten
  Prepare the first login: Erste Anmeldung vorbereiten
  Snapshot on every update: Schnappschuss vor jedem Update
  Tidy up: Aufräumen
  Sign the boot chain: Boot-Kette signieren
  # "Share this configuration" is the name of the task that does it, and stands
  # up under Teilen with the rest of the sharing rather than here.
  Keep a copy of this installation: Kopie dieser Installation ablegen
  Enter the new system: In das neue System wechseln
  Restart into the new system: In das neue System neu starten
  Unmount everything: Alles aushängen

  # ─── Was der Lauf zwischendurch meldet ─────────────────────────────────────
  #
  # Der erste Absatz ist die Überschrift, alles danach der Text darunter.
  ? |-
    Arch OS is installed

    {{ARCH_OS_HOSTNAME}} is on {{ARCH_OS_DISK}} and ready to start. Everything from here on is offered rather than needed.
  : |-
    Arch OS ist installiert

    {{ARCH_OS_HOSTNAME}} liegt auf {{ARCH_OS_DISK}} und ist startbereit. Alles Weitere wird angeboten, nicht verlangt.

  ? |-
    Configuration shared

    Scan the code, or type the word at the end of the address into the paste.rs starting point of another installation.
  : |-
    Konfiguration geteilt

    Scanne den Code — oder tippe das Wort am Ende der Adresse beim paste.rs-Startpunkt einer weiteren Installation ein.

  # ─── Was sie vorher fragen ─────────────────────────────────────────────────
  ? |-
    Put these answers online now?

    Every answer of this installation goes to paste.rs, and its address comes back as a code to scan — enough to set another machine up exactly like this one. Anybody holding that address can read them. The password is not among them and was never written down anywhere.
  : |-
    Diese Antworten jetzt online ablegen?

    Jede Antwort dieser Installation geht zu paste.rs, und ihre Adresse kommt als Code zum Abscannen zurück — genug, um einen weiteren Rechner genau wie diesen einzurichten. Wer diese Adresse hat, kann sie alle lesen. Das Passwort ist nicht dabei und wurde nirgends gespeichert.

  ? |-
    Open a shell inside the system that was just installed?

    Everything is still mounted, so this is the moment to look around or fix something by hand. Leave it again with `exit`.
  : |-
    Eine Shell im soeben installierten System öffnen?

    Es ist noch alles eingehängt — der richtige Moment, um sich umzusehen oder von Hand etwas zu richten. Mit `exit` geht es zurück.
  ? |-
    Restart into {{ARCH_OS_HOSTNAME}} now?

    Everything is unmounted first. Remove the installation medium once the screen goes blank.
  : |-
    Jetzt in {{ARCH_OS_HOSTNAME}} neu starten?

    Vorher wird alles ausgehängt. Nimm das Installationsmedium heraus, sobald der Bildschirm schwarz wird.
  ? |-
    Unmount the new system and stay in the live environment?

    Nothing is lost either way — the installation is finished. Leaving it mounted is only useful if you want to keep working on it from here.
  : |-
    Das neue System aushängen und in der Live-Umgebung bleiben?

    Verloren geht so oder so nichts, die Installation ist fertig. Eingehängt zu lassen lohnt nur, wenn du von hier aus weiterarbeiten willst.

  # ─── Die Wiederherstellung ─────────────────────────────────────────────────
  "The disk holding the Arch OS installation to repair. Opening it changes nothing on it.": "Der Datenträger mit der Arch-OS-Installation, die repariert werden soll. Ihn zu öffnen ändert nichts daran."
  "Whether that disk is encrypted with LUKS. This is read off the disk, which can be done without the password — change it only if the answer is wrong.": "Ob dieser Datenträger mit LUKS verschlüsselt ist. Das wird vom Datenträger selbst gelesen, wofür kein Passwort nötig ist — ändere es nur, wenn die Antwort nicht stimmt."
  "Encryption password": "Verschlüsselungspasswort"
  "The password that unlocks that disk. It is asked for immediately before the recovery starts and is never written to a file.": "Das Passwort, das diesen Datenträger entsperrt. Es wird unmittelbar vor dem Start der Wiederherstellung abgefragt und nie in eine Datei geschrieben."
  "The file system of the system being repaired. btrfs can be rolled back to a snapshot; ext4 can be opened and worked in by hand. On an encrypted disk this cannot be read in advance, so check it.": "Das Dateisystem des Systems, das repariert wird. btrfs lässt sich auf einen Schnappschuss zurücksetzen, ext4 nur öffnen und von Hand bearbeiten. Auf einem verschlüsselten Datenträger lässt sich das vorher nicht auslesen — prüfe es also."
  "Snapshot": "Schnappschuss"
  "The snapshot to put in place of the root subvolume. Newest first, with the date it was taken and what took it.": "Der Schnappschuss, der an die Stelle des Wurzel-Subvolumes tritt. Der neueste zuerst, mit dem Zeitpunkt der Aufnahme und dem Anlass."

  "Unlock and mount the system": "System entsperren und einhängen"
  "Go back to a snapshot": "Auf einen Schnappschuss zurückgehen"
  "Rebuild the boot files": "Startdateien neu bauen"
  "Open a shell in the system": "Eine Shell im System öffnen"
  "Unmount and lock the disk": "Aushängen und Datenträger sperren"

  ? |-
    Put {{ARCH_OS_RECOVERY_SNAPSHOT}} in place of the root subvolume on {{ARCH_OS_RECOVERY_DISK}}?

    The system as it is now is deleted and replaced by that snapshot. Everything under /home is untouched, and so are the other snapshots — you can come back and choose a different one.
  : |-
    {{ARCH_OS_RECOVERY_SNAPSHOT}} an die Stelle des Wurzel-Subvolumes auf {{ARCH_OS_RECOVERY_DISK}} setzen?

    Das System, wie es jetzt ist, wird gelöscht und durch diesen Schnappschuss ersetzt. Alles unter /home bleibt unangetastet, die übrigen Schnappschüsse ebenfalls — du kannst also wiederkommen und einen anderen wählen.

  ? |-
    Rebuild the kernel images and the initial ram disks?

    Needed when the rollback went back past a kernel update: the modules in the restored system and the images in /boot are then two different kernels, and the machine comes up without a single module. Everything is taken from the package cache, so this needs no network.
  : |-
    Die Kernel-Abbilder und die Initial-RAM-Disks neu bauen?

    Nötig, wenn der Rücksprung über ein Kernel-Update hinweg ging: Die Module im wiederhergestellten System und die Abbilder in /boot sind dann zwei verschiedene Kernel, und der Rechner startet ohne ein einziges Modul. Alles kommt aus dem Paket-Cache, ein Netzwerk braucht es dafür nicht.

  ? |-
    Open a shell inside the system on {{ARCH_OS_RECOVERY_DISK}}?

    Everything is mounted, so this is where anything the recovery does not do by itself gets fixed by hand — a package reinstalled, a config file put back. Leave it again with `exit`.
  : |-
    Eine Shell in dem System auf {{ARCH_OS_RECOVERY_DISK}} öffnen?

    Es ist alles eingehängt — hier wird von Hand erledigt, was die Wiederherstellung nicht selbst tut: ein Paket neu installieren, eine Konfigurationsdatei zurücklegen. Mit `exit` geht es zurück.

  ? |-
    Unmount the system and lock the disk again?

    Nothing is lost either way — the recovery is finished. Leaving it mounted is only useful if you want to keep working on it from here.
  : |-
    Das System aushängen und den Datenträger wieder sperren?

    Verloren geht so oder so nichts, die Wiederherstellung ist fertig. Eingehängt zu lassen lohnt nur, wenn du von hier aus weiterarbeiten willst.
