# Every answer of a shared configuration but the disk and the kernel
# parameters, which are this machine's own.
title: Online (paste.rs)
error: No configuration found at {{ARCH_OS_CONFIG_SOURCE}}. Check the code and the internet connection.

inputs:
  - name: ARCH_OS_CONFIG_SOURCE
    type: text
    title: Configuration code
    description: The code at the end of a paste.rs address, or the whole address.
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9:/._-]*$'
    error: A code such as aBc12, or the whole address.
