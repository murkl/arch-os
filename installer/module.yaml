# The Installer in run order. A name() is a lib.sh function: runtime/README.md

title: Installer
start: Install now

# ─── The Way In ──────────────────────────────────────────────────────────────

# Internet last, after the keyboard a Wi-Fi password is typed on.
requires: [live-image, root, uefi, secure-boot-off, internet]

# Each sets every setting it has an opinion on, so only personal answers remain.
presets:
  - title: Desktop
    description: Core with GNOME, drivers, codecs and everyday apps.
    values:
      ARCH_OS_ENCRYPTION_ENABLED: true
      ARCH_OS_RECOVERY_ENABLED: true
      ARCH_OS_BOOTSPLASH_ENABLED: true
      ARCH_OS_MULTILIB_ENABLED: true
      ARCH_OS_AUR_HELPER_ENABLED: true
      ARCH_OS_CONTAINER_ENGINE: none
      ARCH_OS_FIREWALL_ENABLED: true
      ARCH_OS_SSH_SERVER_ENABLED: false
      ARCH_OS_HOUSEKEEPING_ENABLED: true
      ARCH_OS_SHELL_ENHANCEMENT_ENABLED: true
      ARCH_OS_MANAGER_ENABLED: true
      ARCH_OS_DESKTOP: gnome
      ARCH_OS_DESKTOP_EXTRAS_ENABLED: true
      ARCH_OS_DESKTOP_SLIM_ENABLED: true
      ARCH_OS_BROWSER: firefox
      ARCH_OS_BACKUP: pika-backup
      ARCH_OS_FLATPAK_ENABLED: true
      ARCH_OS_BAZAAR_ENABLED: false
      ARCH_OS_SAMBA_SHARE_ENABLED: false

  - title: Core
    description: Minimal Arch Linux on the console.
    values:
      ARCH_OS_ENCRYPTION_ENABLED: true
      ARCH_OS_RECOVERY_ENABLED: true
      ARCH_OS_BOOTSPLASH_ENABLED: false
      ARCH_OS_MULTILIB_ENABLED: false
      ARCH_OS_AUR_HELPER_ENABLED: false
      ARCH_OS_CONTAINER_ENGINE: none
      ARCH_OS_FIREWALL_ENABLED: false
      ARCH_OS_SSH_SERVER_ENABLED: false
      ARCH_OS_HOUSEKEEPING_ENABLED: false
      ARCH_OS_SHELL_ENHANCEMENT_ENABLED: false
      ARCH_OS_MANAGER_ENABLED: false
      ARCH_OS_DESKTOP: none
      ARCH_OS_DESKTOP_EXTRAS_ENABLED: false
      ARCH_OS_DESKTOP_SLIM_ENABLED: false
      ARCH_OS_BROWSER: none
      ARCH_OS_BACKUP: none
      ARCH_OS_FLATPAK_ENABLED: false
      ARCH_OS_BAZAAR_ENABLED: false
      ARCH_OS_SAMBA_SHARE_ENABLED: false

# A pattern on every answer that reaches the shell, since an answer file can
# hold anything.
settings:
  Identity:
    - name: ARCH_OS_USERNAME
      type: text
      title: Username
      description: The account to log in with.
      required: true
      pattern: '^[a-z_][a-z0-9_-]{0,31}$'
      error: |
        Up to 32 lowercase letters, digits, - or _, starting with a letter or _.

    - name: ARCH_OS_PASSWORD
      type: new-password
      title: Password
      description: For the account. Never saved.
      required: true

    - name: ARCH_OS_HOSTNAME
      type: text
      title: Hostname
      description: The name on the network.
      required: true
      default: arch-os
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
      error: |
        Up to 63 lowercase letters, digits or -, not starting or ending with -.

  # The keyboard comes first: a password typed on the wrong layout is wrong. It
  # is hardware, so the system language does not change it.
  Region:
    - name: ARCH_OS_LOCALE_LANG
      type: list
      title: Language and region
      description: |
        The system language and regional formats, such as de_DE. Font and time
        zone default to it.
      required: true
      options-from: options_locales()
      filter: open
      prefill: prefill_locale()
      pattern: '^[a-z]{2,3}(_[A-Z]{2})?$'

    - name: ARCH_OS_VCONSOLE_KEYMAP
      type: list
      title: Console keyboard
      description: The keyboard layout for this session and the console.
      first: true
      required: true
      options-from: options_keymaps()
      prefill: prefill_keymap()
      pattern: '^[A-Za-z0-9_.-]+$'
      apply: apply_vconsole_keymap()

    - name: ARCH_OS_VCONSOLE_FONT
      type: list
      title: Console font
      description: |
        The console font. Auto follows the language. Larger sizes suit HiDPI
        screens.
      required: true
      options-from: options_fonts()
      filter: open
      default: auto
      pattern: '^[A-Za-z0-9_.+-]+$'

    - name: ARCH_OS_TIMEZONE
      type: list
      title: Time zone
      description: Sets the system clock to local time.
      required: true
      options-from: options_timezones()
      filter: open
      prefill: prefill_timezone()
      pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
      apply: apply_timezone()

    - name: ARCH_OS_REFLECTOR_COUNTRY
      type: open-list
      title: Mirror country
      # Worldwide by default: one country may have few mirrors, and reflector
      # ranks by speed. https://wiki.archlinux.org/title/Reflector
      description: |
        The country of the package mirrors. None uses the fastest worldwide.
      required: true
      options-from: options_countries()
      filter: open
      default: none
      pattern: '^[^"\\]*$'

  Storage:
    - name: ARCH_OS_DISK
      type: list
      title: Disk
      description: The target disk. All data on it is erased.
      required: true
      options-from: options_disks()
      pattern: '^/dev/[A-Za-z0-9_-]+$'
      error: Disk not found.

    - name: ARCH_OS_ENCRYPTION_ENABLED
      type: bool
      title: Disk encryption
      description: Encrypts the system with LUKS.
      required: true

    # Automatic login passes the disk password to the keyring, so only with one
    # password: docs/REFERENCE.md#accounts
    - name: ARCH_OS_DISK_PASSWORD_ENABLED
      type: bool
      title: Separate disk password
      description: |
        Asks for a disk password at boot, before the login. For shared machines.
      when: ARCH_OS_ENCRYPTION_ENABLED == true
      default: false

    - name: ARCH_OS_DISK_PASSWORD
      type: new-password
      title: Disk password
      description: Unlocks the disk at every boot. Never saved.
      when:
        - ARCH_OS_ENCRYPTION_ENABLED == true
        - ARCH_OS_DISK_PASSWORD_ENABLED == true
      required: true

  Boot:
    - name: ARCH_OS_SECURE_BOOT_ENABLED
      type: bool
      title: Secure Boot
      description: |
        Signs kernel and boot loader with own keys. Enable Secure Boot after the
        installation.
      when: ARCH_OS_ENCRYPTION_ENABLED == true
      default: true

    - name: ARCH_OS_RECOVERY_ENABLED
      type: bool
      title: Recovery
      description: Repairs a system that no longer boots, from the boot menu.
      default: true

    - name: ARCH_OS_BOOTSPLASH_ENABLED
      type: bool
      title: Boot splash
      description: Shows a logo instead of boot messages.
      default: true

    - name: ARCH_OS_KERNEL_ARGS
      type: text
      title: Kernel parameters
      description: Additional kernel parameters, separated by spaces.

  System:
    - name: ARCH_OS_MULTILIB_ENABLED
      type: bool
      title: 32-bit support
      description: 32-bit libraries for Steam and Wine.
      default: true

    - name: ARCH_OS_AUR_HELPER_ENABLED
      type: bool
      title: AUR helper
      description: Paru as AUR helper. The build takes about 15 minutes.
      default: true

    - name: ARCH_OS_CONTAINER_ENGINE
      type: list
      title: Container engine
      description: |
        Docker uses a root daemon via sudo. Podman is daemonless and accepts
        docker commands. Both include Compose.
      required: true
      options: [docker, podman, none]
      default: none

    - name: ARCH_OS_FIREWALL_ENABLED
      type: bool
      title: Firewall
      description: |
        Blocks incoming connections except the SSH server and, with GNOME,
        printer discovery. File sharing works on networks marked home: nmcli
        connection modify <name> connection.zone home
      default: true

    - name: ARCH_OS_SSH_SERVER_ENABLED
      type: bool
      title: SSH server
      description: Remote login with the account, by key only.
      default: false

    # sshd takes no password, so the account needs a key from the start.
    - name: ARCH_OS_SSH_KEY
      type: text
      title: SSH key
      description: |
        The public key, or a URL serving keys, such as
        https://github.com/<user>.keys
      when: ARCH_OS_SSH_SERVER_ENABLED == true
      required: true
      pattern: '^(https://[^ ]+|(ssh|ecdsa|sk)-[^ ]+ [A-Za-z0-9+/=]+( .*)?)$'
      error: A public key such as ssh-ed25519 AAAA, or an https URL.

    - name: ARCH_OS_HOUSEKEEPING_ENABLED
      type: bool
      title: Housekeeping
      description: Ranks mirrors weekly and monitors disk health.
      default: true

    - name: ARCH_OS_EDITOR
      type: list
      title: Text editor
      description: The default editor for sudoedit, git and systemctl edit.
      required: true
      options: [nano, vim, neovim, micro, helix]
      default: nano

    - name: ARCH_OS_SHELL_ENHANCEMENT_ENABLED
      type: bool
      title: Shell enhancement
      description: |
        Zsh with completion, suggestions, Git prompt, colored listings, fuzzy
        search and aliases.
      default: true

    - name: ARCH_OS_MANAGER_ENABLED
      type: bool
      title: System Manager
      description: |
        Updates, maintains and repairs Arch Linux, in the terminal or on the
        desktop.
      default: true

    # Detected, never asked.
    - name: ARCH_OS_VIRTUAL_MACHINE
      type: bool
      title: Virtual machine
      value-from: value_virtual_machine()

  Desktop:
    - name: ARCH_OS_DESKTOP
      type: list
      title: Environment
      description: GNOME, or None for the console only.
      required: true
      options: [gnome, none]

    - name: ARCH_OS_DESKTOP_KEYBOARD_LAYOUT
      type: list
      title: Desktop keyboard
      description: The desktop keyboard layout. Auto follows the console.
      when: ARCH_OS_DESKTOP != none
      required: true
      options-from: options_layouts()
      filter: open
      default: auto
      pattern: '^[A-Za-z0-9_-]+$'

    - name: ARCH_OS_DESKTOP_KEYBOARD_VARIANT
      type: list
      title: Keyboard variant
      description: |
        A layout variant, such as dead keys. Auto follows the console.
      when: ARCH_OS_DESKTOP != none
      required: true
      options-from: options_variants()
      filter: open
      default: auto
      pattern: '^[A-Za-z0-9_-]+$'

    - name: ARCH_OS_DESKTOP_EXTRAS_ENABLED
      type: bool
      title: Desktop extras
      description: |
        Codecs, fonts, printing, network protocols, development tools and
        everyday apps.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_DESKTOP_SLIM_ENABLED
      type: bool
      title: Slim desktop
      description: Leaves out rarely used GNOME apps.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_BROWSER
      type: list
      title: Web browser
      description: |
        The default browser. Epiphany is GNOME Web. Vivaldi includes proprietary
        codecs.
      when: ARCH_OS_DESKTOP != none
      required: true
      options: [epiphany, firefox, chromium, vivaldi, none]
      default: firefox

    - name: ARCH_OS_BACKUP
      type: list
      title: Backup
      description: Scheduled backups of the home folder to a drive or server.
      when: ARCH_OS_DESKTOP != none
      required: true
      options: [pika-backup, deja-dup, none]
      default: pika-backup

    - name: ARCH_OS_FLATPAK_ENABLED
      type: bool
      title: Flatpak
      description: Apps from Flathub. Required for Parental Controls.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_BAZAAR_ENABLED
      type: bool
      title: Bazaar
      description: |
        Bazaar as Flatpak store instead of GNOME Software, plus GNOME Firmware.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_FLATPAK_ENABLED == true
      default: false

    - name: ARCH_OS_SAMBA_SHARE_ENABLED
      type: bool
      title: File sharing
      description: |
        Shares the home folder and a public folder via SMB, on home networks or,
        without the firewall, on all networks. Anyone there can try the account
        password.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true
      default: false

dashboard: [start, settings, reset, wifi]
language: Region

# ─── The Work ────────────────────────────────────────────────────────────────

# After the password, right before the work: it erases a disk.
confirm: |
  Install Arch OS on {{ARCH_OS_DISK}}?

  All data on the disk is erased. An internet connection is required throughout.

# installer.sh repeats the run from a live system, so its head checks that and
# the disk before the passwords.
script: script_head()

# Stage is when, task is what. Within a stage, needs first, then file order. A
# task the system works without allows failure, so a package Arch drops costs
# that task, not the installation.
stages:
  # Live system ready, disk partitioned and mounted.
  prepare:
    mirrors:
      title: Rank the mirrors and refresh the keyring
      errors:
        10: |
          Clock not set

          Check the connection and choose Install now again.

    partition:
      title: Partition and format the disk
      # The one step that destroys data, after everything that can fail.
      needs: [mirrors]
      # Before anything is written.
      errors:
        10: |
          {{ARCH_OS_DISK}} not available

          Choose another disk on the dashboard.
        11: |
          {{ARCH_OS_DISK}} in use

          Unmount it, then choose Install now again.
        12: |
          {{ARCH_OS_DISK}} too small

          Arch OS needs at least 16 GiB, or 32 GiB with GNOME. Choose another
          disk on the dashboard.
        13: |
          {{ARCH_OS_USERNAME}} reserved

          Choose another username on the dashboard.

  # Base system, configured and bootable.
  system:
    pacstrap:
      title: Install the base system

    config:
      title: Set language and time zone
      needs: [pacstrap]

    network:
      title: Set up the hostname and network
      needs: [pacstrap]

    tweaks:
      title: Tune the system
      needs: [pacstrap]

    bootloader:
      title: Install the boot loader
      # The initramfs embeds every modprobe.d file and the console keyboard.
      needs: [config, tweaks]

    recovery:
      title: Install the Recovery
      needs: [bootloader]
      when: ARCH_OS_RECOVERY_ENABLED == true

    user:
      title: Create the user account
      needs: [pacstrap]

  # What the settings enable.
  features:
    containers:
      title: Install the container engine
      when: ARCH_OS_CONTAINER_ENGINE != none
      allow-failure: true

    editor:
      title: Set up the text editor
      allow-failure: true

    firewall:
      title: Set up the firewall
      when: ARCH_OS_FIREWALL_ENABLED == true

    housekeeping:
      title: Set up housekeeping
      when: ARCH_OS_HOUSEKEEPING_ENABLED == true
      allow-failure: true
      # The heading of a disk warning, in the language of the installation.
      texts:
        DISK_ALERT: Disk at risk

    multilib:
      title: Enable 32-bit support
      when: ARCH_OS_MULTILIB_ENABLED == true

    aur:
      title: Install the AUR helper
      needs: [multilib]
      when: ARCH_OS_AUR_HELPER_ENABLED == true
      # The AUR can be down for days, and nothing else needs it.
      allow-failure: true

    bootsplash:
      title: Install the boot splash
      # multilib upgrades the system the theme builds against.
      needs: [multilib]
      when: ARCH_OS_BOOTSPLASH_ENABLED == true
      # From the AUR. Without it Plymouth draws its own logo.
      allow-failure: true

    manager:
      title: Install the System Manager
      needs: [multilib]
      when: ARCH_OS_MANAGER_ENABLED == true
      # The AUR can be down for days, and nothing else needs it.
      allow-failure: true

    shell:
      title: Set up the shell enhancement
      when: ARCH_OS_SHELL_ENHANCEMENT_ENABLED == true
      allow-failure: true

    ssh:
      title: Enable the SSH server
      # The firewall keeps ssh closed in public until something listens.
      needs: [firewall]
      when: ARCH_OS_SSH_SERVER_ENABLED == true
      # A key that cannot be fetched is added later.
      allow-failure: true
      errors:
        10: |
          SSH key not added

          Add one to ~/.ssh/authorized_keys after the first boot.

    vm-guest:
      title: Install the VM guest tools
      when: ARCH_OS_VIRTUAL_MACHINE == true
      allow-failure: true

  # Desktop and its apps.
  desktop:
    gnome:
      title: Install GNOME
      when: ARCH_OS_DESKTOP == gnome

    backup:
      title: Install the backup app
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_BACKUP != none
      allow-failure: true

    browser:
      title: Install the web browser
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_BROWSER != none
      allow-failure: true

    extras:
      title: Install the desktop extras
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true
      allow-failure: true

    flatpak:
      title: Set up Flatpak
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_FLATPAK_ENABLED == true
      allow-failure: true

    graphics:
      title: Install the graphics drivers
      needs: [gnome]
      when: ARCH_OS_DESKTOP != none

    manager-app:
      title: Add the System Manager to the apps
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_MANAGER_ENABLED == true
      # Missing without the AUR. Its first start sets it up anyway.
      allow-failure: true

    recovery-app:
      title: Add the Recovery to the apps
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_RECOVERY_ENABLED == true
      allow-failure: true

    samba:
      title: Set up file sharing
      needs: [gnome]
      # The question's conditions, so no server runs where sharing was declined.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true
        - ARCH_OS_SAMBA_SHARE_ENABLED == true
      allow-failure: true

  # Final touches.
  finish:
    orphans:
      title: Remove orphaned packages
      allow-failure: true

    snapper:
      title: Set up snapshots

    secure-boot:
      title: Set up Secure Boot
      # After every package change, so its check sees the final boot chain. A
      # task added to this stage belongs here too.
      needs: [orphans, snapper]
      when:
        - ARCH_OS_SECURE_BOOT_ENABLED == true
        - ARCH_OS_ENCRYPTION_ENABLED == true
      # Without enrolled keys the system boots with Secure Boot off.
      allow-failure: true
      errors:
        10: |
          Secure Boot keys not enrolled

          Clear the keys in the firmware settings, then run sudo sbctl
          enroll-keys -m -f.

    copy-config:
      title: Copy the answers, the log and the script into the system
      # Last, so the log and the script are complete.
      needs: [orphans, snapper, secure-boot]

report: |
  Arch OS installed

  {{ARCH_OS_HOSTNAME}} is ready to boot.

# The statuses lib.sh names.
errors:
  3: |
    Internet connection lost

    Reconnect and choose Install now to start over.
  5: |
    AUR unreachable

    Step skipped. Install the package later.

# ─── Around It ───────────────────────────────────────────────────────────────

on:
  leave: [restart, shutdown]
  success: [chroot]

actions:
  # Everything is downloaded. A cable continues by itself, with a card Wi-Fi
  # opens at once.
  internet:
    title: Internet
    run: check_online()
    error: No internet connection. Plug in a cable to continue.
    on:
      failure: [wifi]

  # The secure-boot task signs the boot chain itself.
  secure-boot-off:
    title: Secure Boot off
    run: secure_boot_off()
    error: |
      Secure Boot enabled. Disable it in the firmware settings and start again.

  uefi:
    title: Booted in UEFI mode
    run: booted_in_uefi()
    error: UEFI required. Switch the firmware to UEFI mode and start again.
