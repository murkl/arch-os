# The Installer in run order. A name() is a lib.sh function: runtime/README.md

title: Installer
start: Install now

# ─── The Way In ──────────────────────────────────────────────────────────────

# Internet last, after the keyboard a Wi-Fi password is typed on.
requires: [live-image, root, uefi, secure-boot-off, internet]

# Each sets every setting it has an opinion on, so only personal answers remain.
presets:
  - title: Desktop
    description: Core with GNOME, drivers, codecs and everyday apps.
    values:
      ARCH_OS_ENCRYPTION_ENABLED: true
      ARCH_OS_RECOVERY_ENABLED: true
      ARCH_OS_BOOTSPLASH_ENABLED: true
      ARCH_OS_CORE_TWEAKS_ENABLED: true
      ARCH_OS_MULTILIB_ENABLED: true
      ARCH_OS_AUR_HELPER_ENABLED: true
      ARCH_OS_CONTAINER_ENGINE: none
      ARCH_OS_FIREWALL_ENABLED: true
      ARCH_OS_SSH_SERVER_ENABLED: false
      ARCH_OS_HOUSEKEEPING_ENABLED: true
      ARCH_OS_SHELL_ENHANCEMENT_ENABLED: true
      ARCH_OS_MANAGER_ENABLED: true
      ARCH_OS_DESKTOP: gnome
      ARCH_OS_DESKTOP_EXTRAS_ENABLED: true
      ARCH_OS_DESKTOP_SLIM_ENABLED: true
      ARCH_OS_BROWSER: firefox
      ARCH_OS_BACKUP: pika-backup
      ARCH_OS_FLATPAK_ENABLED: true
      ARCH_OS_BAZAAR_ENABLED: false
      ARCH_OS_SAMBA_SHARE_ENABLED: false

  - title: Core
    description: Minimal Arch Linux on the text console.
    values:
      ARCH_OS_ENCRYPTION_ENABLED: true
      ARCH_OS_RECOVERY_ENABLED: true
      ARCH_OS_BOOTSPLASH_ENABLED: false
      ARCH_OS_CORE_TWEAKS_ENABLED: true
      ARCH_OS_MULTILIB_ENABLED: false
      ARCH_OS_AUR_HELPER_ENABLED: false
      ARCH_OS_CONTAINER_ENGINE: none
      ARCH_OS_FIREWALL_ENABLED: false
      ARCH_OS_SSH_SERVER_ENABLED: false
      ARCH_OS_HOUSEKEEPING_ENABLED: false
      ARCH_OS_SHELL_ENHANCEMENT_ENABLED: false
      ARCH_OS_MANAGER_ENABLED: false
      ARCH_OS_DESKTOP: none
      ARCH_OS_DESKTOP_EXTRAS_ENABLED: false
      ARCH_OS_DESKTOP_SLIM_ENABLED: false
      ARCH_OS_BROWSER: none
      ARCH_OS_BACKUP: none
      ARCH_OS_FLATPAK_ENABLED: false
      ARCH_OS_BAZAAR_ENABLED: false
      ARCH_OS_SAMBA_SHARE_ENABLED: false

  - title: Shared configuration
    description: Answers shared by another installation.
    action: import-config

# A pattern on every answer that reaches the shell, since an answer file can
# hold anything.
settings:
  Identity:
    - name: ARCH_OS_USERNAME
      type: text
      title: Username
      required: true
      pattern: '^[a-z_][a-z0-9_-]{0,31}$'
      error: |
        Up to 32 lowercase letters, digits, hyphens and underscores, starting
        with a letter or underscore.

    - name: ARCH_OS_PASSWORD
      type: new-password
      title: Password
      description: For the account and, with encryption, the disk. Never saved.
      required: true

    - name: ARCH_OS_HOSTNAME
      type: text
      title: Hostname
      description: Name of this machine on the network.
      required: true
      default: arch-os
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
      error: |
        Up to 63 lowercase letters, digits and hyphens, no hyphen at the start
        or end.

  # On auto everything follows the language, the mirrors via the time zone. The
  # keyboard comes first: a password typed on the wrong layout is wrong.
  Region:
    - name: ARCH_OS_LOCALE_LANG
      type: list
      title: Language and region
      description: |
        System language and formats, such as de_DE. Keyboard, console font and
        time zone follow it. English stays as fallback.
      required: true
      options-from: options_locales()
      filter: open
      prefill: prefill_locale()
      pattern: '^[a-z]{2,3}(_[A-Z]{2})?$'
      apply: apply_vconsole_keymap()

    - name: ARCH_OS_VCONSOLE_KEYMAP
      type: list
      title: Console keyboard
      description: |
        Active at once and on the text console. On auto it follows the system
        language.
      first: true
      required: true
      options-from: options_vconsole_keymaps()
      pattern: '^[A-Za-z0-9_.-]+$'
      apply: apply_vconsole_keymap()

    - name: ARCH_OS_VCONSOLE_FONT
      type: list
      title: Console font
      description: |
        On auto it suits the language. Larger sizes for high-resolution screens.
      required: true
      options-from: options_fonts()
      filter: open
      default: auto
      pattern: '^[A-Za-z0-9_.+-]+$'

    - name: ARCH_OS_TIMEZONE
      type: list
      title: Time zone
      description: Preselected from the language.
      required: true
      options-from: options_timezones()
      filter: open
      prefill: prefill_timezone()
      pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
      apply: apply_timezone()

    - name: ARCH_OS_REFLECTOR_COUNTRY
      type: open-list
      title: Mirror country
      description: |
        Package source. On auto it follows the time zone, on none worldwide.
      required: true
      options-from: options_countries()
      filter: open
      default: auto
      pattern: '^[^"\\]*$'

  Storage:
    - name: ARCH_OS_DISK
      type: list
      title: Disk
      description: Everything on it is erased.
      required: true
      options-from: options_disks()
      pattern: '^/dev/[A-Za-z0-9_-]+$'
      error: Choose a disk that exists.

    - name: ARCH_OS_ENCRYPTION_ENABLED
      type: bool
      title: Disk encryption
      description: Encrypts the system with LUKS.
      required: true

    # Automatic login passes the disk password to the keyring, so only with one
    # password: docs/REFERENCE.md#accounts
    - name: ARCH_OS_DISK_PASSWORD_ENABLED
      type: bool
      title: Separate disk password
      description: Own disk password, then the login screen. For shared machines.
      when: ARCH_OS_ENCRYPTION_ENABLED == true
      default: false

    - name: ARCH_OS_DISK_PASSWORD
      type: new-password
      title: Disk password
      description: Unlocks the disk at boot. Never saved.
      when:
        - ARCH_OS_ENCRYPTION_ENABLED == true
        - ARCH_OS_DISK_PASSWORD_ENABLED == true
      required: true

  Boot:
    - name: ARCH_OS_SECURE_BOOT_ENABLED
      type: bool
      title: Secure Boot
      description: |
        Signs kernel and boot loader with this machine's own keys, enrolled in
        setup mode. Turn Secure Boot on after the installation.
      when: ARCH_OS_ENCRYPTION_ENABLED == true
      default: true

    - name: ARCH_OS_RECOVERY_ENABLED
      type: bool
      title: Recovery
      description: |
        Repairs a system that no longer boots, from its own partition in the boot
        menu.
      default: true

    - name: ARCH_OS_BOOTSPLASH_ENABLED
      type: bool
      title: Boot splash
      description: Shows a logo instead of boot messages.
      default: true

    - name: ARCH_OS_KERNEL_ARGS
      type: text
      title: Kernel parameters
      description: Extra parameters, separated by spaces. Usually empty.

  System:
    - name: ARCH_OS_CORE_TWEAKS_ENABLED
      type: bool
      title: Core tweaks
      description: |
        Colored pacman, quiet boot, password asterisks, tuned memory, disk and
        log settings. Installs nothing.
      default: true

    - name: ARCH_OS_MULTILIB_ENABLED
      type: bool
      title: 32-bit support
      description: For Steam, Wine and other 32-bit software.
      default: true

    - name: ARCH_OS_AUR_HELPER_ENABLED
      type: bool
      title: AUR helper
      description: Paru for the Arch User Repository. Builds in about 15 minutes.
      default: true

    - name: ARCH_OS_CONTAINER_ENGINE
      type: list
      title: Container engine
      description: |
        Docker uses a root daemon, as most guides expect. Podman needs none and
        accepts docker commands. Both include Compose.
      required: true
      options: [docker, podman, none]
      default: none

    - name: ARCH_OS_FIREWALL_ENABLED
      type: bool
      title: Firewall
      description: |
        Blocks incoming connections except SSH and printer discovery. File
        sharing only on networks marked home: nmcli connection modify <name>
        connection.zone home
      default: true

    - name: ARCH_OS_SSH_SERVER_ENABLED
      type: bool
      title: SSH server
      description: Remote login for the account, not for root.
      default: false

    - name: ARCH_OS_HOUSEKEEPING_ENABLED
      type: bool
      title: Housekeeping
      description: |
        Ranks mirrors and trims the package cache weekly, monitors disk health.
      default: true

    - name: ARCH_OS_EDITOR
      type: list
      title: Text editor
      description: |
        Default for sudoedit, git and systemctl edit. Nano and Micro are
        beginner-friendly, Vim, Neovim and Helix modal.
      required: true
      options: [nano, vim, neovim, micro, helix]
      default: nano

    - name: ARCH_OS_SHELL_ENHANCEMENT_ENABLED
      type: bool
      title: Shell enhancement
      description: |
        Zsh with completion, suggestions, Git prompt, colored listings, fuzzy
        search and aliases.
      default: true

    - name: ARCH_OS_MANAGER_ENABLED
      type: bool
      title: System Manager
      description: |
        Updates, maintains and repairs Arch Linux, in the terminal or on the
        desktop.
      default: true

    # Detected, never asked.
    - name: ARCH_OS_VIRTUAL_MACHINE
      type: bool
      title: Virtual machine
      value-from: value_virtual_machine()

  Desktop:
    - name: ARCH_OS_DESKTOP
      type: list
      title: Environment
      description: GNOME on gnome, text console only on none.
      required: true
      options: [gnome, none]

    - name: ARCH_OS_DESKTOP_KEYBOARD_LAYOUT
      type: list
      title: Desktop keyboard
      description: On auto it matches the console keyboard.
      when: ARCH_OS_DESKTOP != none
      required: true
      options-from: options_layouts()
      filter: open
      default: auto
      pattern: '^[A-Za-z0-9_-]+$'

    - name: ARCH_OS_DESKTOP_KEYBOARD_VARIANT
      type: list
      title: Keyboard variant
      description: Such as dead keys. On none the standard layout.
      when: ARCH_OS_DESKTOP != none
      required: true
      options-from: options_variants()
      filter: open
      default: none
      pattern: '^[A-Za-z0-9_-]+$'

    - name: ARCH_OS_DESKTOP_KEYBOARD_MODEL
      type: text
      title: Keyboard model
      description: Almost every keyboard is a pc105.
      when: ARCH_OS_DESKTOP != none
      default: pc105
      pattern: '^[A-Za-z0-9_-]+$'

    - name: ARCH_OS_DESKTOP_EXTRAS_ENABLED
      type: bool
      title: Desktop extras
      description: |
        Codecs, fonts, printing, network protocols, development tools and
        everyday apps.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_DESKTOP_SLIM_ENABLED
      type: bool
      title: Slim desktop
      description: Leaves out rarely used GNOME apps.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_BROWSER
      type: list
      title: Web browser
      description: |
        Default browser, in the system language. Epiphany is GNOME Web. Vivaldi
        includes proprietary video codecs.
      when: ARCH_OS_DESKTOP != none
      required: true
      options: [epiphany, firefox, chromium, vivaldi, none]
      default: firefox

    - name: ARCH_OS_BACKUP
      type: list
      title: Backup
      description: Scheduled backups to a drive or a server.
      when: ARCH_OS_DESKTOP != none
      required: true
      options: [pika-backup, deja-dup, none]
      default: pika-backup

    - name: ARCH_OS_FLATPAK_ENABLED
      type: bool
      title: Flatpak
      description: |
        Apps from Flathub, through GNOME Software or Bazaar. Required for
        Parental Controls.
      when: ARCH_OS_DESKTOP != none
      default: true

    - name: ARCH_OS_BAZAAR_ENABLED
      type: bool
      title: Bazaar
      description: |
        Flatpak-only store instead of GNOME Software, plus GNOME Firmware for
        firmware updates.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_FLATPAK_ENABLED == true
      default: false

    - name: ARCH_OS_SAMBA_SHARE_ENABLED
      type: bool
      title: File sharing
      description: |
        Shares the home folder and a public folder with Windows and macOS, on
        home networks or, without firewall, on every network. Anyone there can
        try the account password.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true
      default: false

dashboard: [start, settings, reset, wifi]
language: Region

# ─── The Work ────────────────────────────────────────────────────────────────

# After the password, right before the work: it erases a disk.
confirm: |
  Install Arch OS on {{ARCH_OS_DISK}}?

  Everything on the disk is erased.

# Stage is when, task is what. Within a stage, needs first, then file order.
stages:
  # Live system ready, disk partitioned and mounted.
  prepare:
    mirrors:
      title: Rank the mirrors and refresh the keyring
      errors:
        10: |
          Clock not set

          Check the internet connection.

    partition:
      title: Partition and format the disk
      # The one step that destroys data, after everything that can fail.
      needs: [mirrors]
      # Before anything is written.
      errors:
        10: |
          Disk not available

          Choose the disk again.
        11: |
          Disk in use

          Unmount {{ARCH_OS_DISK}} or close what uses it.

  # Base system, configured and bootable.
  system:
    pacstrap:
      title: Install the base system

    config:
      title: Set language and time zone
      needs: [pacstrap]

    network:
      title: Set up the hostname and network
      needs: [pacstrap]

    tweaks:
      title: Apply the core tweaks
      needs: [pacstrap]
      when: ARCH_OS_CORE_TWEAKS_ENABLED == true

    bootloader:
      title: Install the boot loader
      # The initramfs embeds every modprobe.d file and the console keyboard.
      needs: [config, tweaks]

    recovery:
      title: Install the Recovery
      needs: [bootloader]
      when: ARCH_OS_RECOVERY_ENABLED == true

    user:
      title: Create the user account
      needs: [pacstrap]

  # What the settings enable.
  features:
    containers:
      title: Install the container engine
      when: ARCH_OS_CONTAINER_ENGINE != none

    editor:
      title: Set up the text editor

    firewall:
      title: Set up the firewall
      when: ARCH_OS_FIREWALL_ENABLED == true

    housekeeping:
      title: Set up housekeeping
      when: ARCH_OS_HOUSEKEEPING_ENABLED == true

    multilib:
      title: Enable 32-bit support
      when: ARCH_OS_MULTILIB_ENABLED == true

    aur:
      title: Install the AUR helper
      needs: [multilib]
      when: ARCH_OS_AUR_HELPER_ENABLED == true
      # The AUR can be down for days, and nothing else needs it.
      allow-failure: true

    bootsplash:
      title: Install the boot splash
      # multilib upgrades the system the theme builds against.
      needs: [multilib]
      when: ARCH_OS_BOOTSPLASH_ENABLED == true
      # From the AUR. Without it Plymouth draws its own logo.
      allow-failure: true

    manager:
      title: Install the System Manager
      needs: [multilib]
      when: ARCH_OS_MANAGER_ENABLED == true
      # The AUR can be down for days, and nothing else needs it.
      allow-failure: true

    shell:
      title: Set up the shell enhancement
      when: ARCH_OS_SHELL_ENHANCEMENT_ENABLED == true

    ssh:
      title: Enable the SSH server
      # The firewall keeps ssh closed in public until something listens.
      needs: [firewall]
      when: ARCH_OS_SSH_SERVER_ENABLED == true

    vm-guest:
      title: Install the VM guest tools
      when: ARCH_OS_VIRTUAL_MACHINE == true

  # Desktop and its apps.
  desktop:
    gnome:
      title: Install GNOME
      when: ARCH_OS_DESKTOP == gnome

    backup:
      title: Install the backup app
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_BACKUP != none

    browser:
      title: Install the web browser
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_BROWSER != none

    flatpak:
      title: Set up Flatpak
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_FLATPAK_ENABLED == true

    graphics:
      title: Install the graphics drivers
      needs: [gnome]
      when: ARCH_OS_DESKTOP != none

    manager-app:
      title: Add the System Manager to the apps
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_MANAGER_ENABLED == true
      # Missing without the AUR. Its first start sets it up anyway.
      allow-failure: true

    recovery-app:
      title: Add the Recovery to the apps
      needs: [gnome]
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_RECOVERY_ENABLED == true

    samba:
      title: Set up file sharing
      needs: [gnome]
      # The question's conditions, so no server runs where sharing was declined.
      when:
        - ARCH_OS_DESKTOP != none
        - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true
        - ARCH_OS_SAMBA_SHARE_ENABLED == true

  # Final touches.
  finish:
    orphans:
      title: Remove orphaned packages

    snapper:
      title: Set up snapshots

    secure-boot:
      title: Set up Secure Boot
      # After every package change, so its check sees the final boot chain. A
      # task added to this stage belongs here too.
      needs: [orphans, snapper]
      when:
        - ARCH_OS_SECURE_BOOT_ENABLED == true
        - ARCH_OS_ENCRYPTION_ENABLED == true

    copy-config:
      title: Copy the answers and the log into the system
      # Last, so the log is complete.
      needs: [orphans, snapper, secure-boot]

report: |
  Arch OS installed

  {{ARCH_OS_HOSTNAME}} on {{ARCH_OS_DISK}}.

# The statuses lib.sh names.
errors:
  3: |
    Internet connection lost

    Reconnect this machine.
  5: |
    AUR unreachable

    Install the package later.

# ─── Around It ───────────────────────────────────────────────────────────────

on:
  leave: [restart, shutdown]
  failure: [share-log]
  success: [chroot, share-config]

actions:
  # Everything is downloaded. A cable continues by itself, with a card Wi-Fi
  # opens at once.
  internet:
    title: Internet
    run: check_online()
    error: No internet connection. Plug in a cable.
    on:
      failure: [wifi]

  # Every shared answer except disk and kernel parameters, which belong to one
  # machine.
  import-config:
    title: Shared configuration
    inputs:
      - name: ARCH_OS_CONFIG_SOURCE
        type: text
        title: Configuration code
        description: End of the paste.rs address, or the whole address.
        required: true
        pattern: '^[A-Za-z0-9][A-Za-z0-9:/._-]*$'
        error: A code such as aBc12, or the whole address.
    run: import_config()
    error: |
      No configuration at {{ARCH_OS_CONFIG_SOURCE}}. Check the code and the
      connection.

  # The secure-boot task signs the boot chain itself.
  secure-boot-off:
    title: Secure Boot off
    run: secure_boot_off()
    error: Secure Boot on. Turn it off in the firmware and start again.

  # Choosing the row is the consent, so it names what leaves.
  share-config:
    title: Share the configuration
    description: |
      Uploads these answers to paste.rs for another installation, readable by
      anyone with the address. Passwords are excluded.
    run: share_config()
    simulates: true
    error: Upload to paste.rs failed.
    report: |
      Configuration shared

      Enter the end of the address under Shared configuration in another
      installation.
    qr: ARCH_OS_CONFIG_URL

  uefi:
    title: Booted in UEFI mode
    run: booted_in_uefi()
    error: Booted in BIOS mode. Set UEFI in the firmware and start again.
