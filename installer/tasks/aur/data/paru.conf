# Written by Arch OS. paru reads only the first configuration it finds, so this
# one repeats the defaults of /etc/paru.conf. See paru.conf(5).

[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil

# The newest results last, next to the prompt.
BottomUp
# One password for a whole batch of builds, not one per package.
SudoLoop
