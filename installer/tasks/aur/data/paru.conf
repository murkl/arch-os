# Written by the Arch OS Installer. Yours to change.
#
# paru reads the first configuration it finds and stops, so this one stands
# in place of /etc/paru.conf rather than adding to it, which is why the
# package's own defaults are repeated here.
# See paru.conf(5).

[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil

# The newest results last, next to the prompt.
BottomUp
# One password for a whole batch of builds, not one per package.
SudoLoop
