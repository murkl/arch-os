title: Partition and format the disk

# The one step that destroys data, so everything that can fail first has.
needs: [mirrors, recovery-image]

# What task.sh stops itself with, before anything is written.
errors:
  10: |
    Disk not available

    {{ARCH_OS_DISK}} is not available for the installation. Choose the disk
    again on the dashboard.
  11: |
    Disk in use

    {{ARCH_OS_DISK}} is still in use on this machine. Unmount it or close what
    uses it, then choose Install now again.
