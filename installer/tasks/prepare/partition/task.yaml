title: Partition and format the disk

# The one step that destroys data, so everything that can fail first has.
needs: [mirrors, recovery-image]

# What task.sh stops itself with, before anything is written.
errors:
  10: |
    The disk is not there

    {{ARCH_OS_DISK}} is not one of the disks Arch OS can be installed on here.
    Choose the disk again on the dashboard.
  11: |
    The disk is in use

    Something on this machine still holds {{ARCH_OS_DISK}} open. Unmount or
    close it, then choose Install now again.
