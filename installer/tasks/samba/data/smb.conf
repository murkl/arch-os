# Written by Arch OS. Only what differs from Samba's defaults, see `testparm -sv`.

[global]
   # Hides the version.
   server string = Samba Server

   # An unknown login becomes the guest, for the public share.
   map to guest = Bad User

   # The hostname as is through Avahi, not the NetBIOS name in capitals.
   # https://wiki.archlinux.org/title/Samba
   mdns name = mdns

[homes]
   comment = Home Directory
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = %S

# Writable by the account only, over the network and locally: anybody could
# fill a share every guest may write to.
[public]
   comment = Public Share
   path = /srv/samba/public
   guest ok = yes
   read only = yes
   write list = {{USERNAME}}
   force user = {{USERNAME}}
   create mask = 0644
   directory mask = 0755
