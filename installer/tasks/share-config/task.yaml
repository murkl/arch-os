name: Share this configuration
stage: finish
needs: [copy-config]

# Asked here rather than among the settings an hour earlier, and opening on no:
# nothing leaves the machine until somebody in front of it has said so, on the
# page that has just told them the installation is over. share_config in lib.sh
# is the only thing in this tree that sends anything anywhere.
confirm: |
  Put these answers online now?

  Every answer of this installation goes to paste.rs, and its address comes back as
  a code to scan — enough to set another machine up exactly like this one. Anybody
  holding that address can read them. The password is not among them and was never
  written down anywhere.
default: no

# The address, once there is one: as a code to scan, and as itself under it.
shows: ARCH_OS_CONFIG_URL
report: |
  Configuration shared

  Scan the code, or type the word at the end of the address into the paste.rs
  starting point of another installation.
