# Written by the Arch OS Installer. Only what differs from Samba's defaults,
# which `testparm -sv` prints in full.

[global]
   # Instead of announcing the version.
   server string = Samba Server

   # An unknown login is the guest, which reaches the public share.
   map to guest = Bad User

   # The hostname as it is, through Avahi, not the NetBIOS name in capitals.
   # https://wiki.archlinux.org/title/Samba
   mdns name = mdns

[homes]
   comment = Home Directory
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = %S

# Readable by anyone, writable only by the installing account: a share every
# guest may write to is a folder anybody on the network can fill.
[public]
   comment = Public Share
   path = /srv/samba/public
   guest ok = yes
   read only = yes
   write list = {{USERNAME}}
   force user = nobody
   force group = users
   create mask = 0777
   directory mask = 0777
