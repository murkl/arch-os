# What this installer is, what it asks, and in what order it works.
#
# The runtime beside it knows nothing about Arch Linux. Everything else in this
# tree is found by its own name — lib.sh, data/, locales/, hooks/, tasks/ — and
# nothing points at it from here.
#
# Repairing a system that is already on a disk is a program of its own, with a
# declaration of its own: see ../recovery.

title: Arch OS Installer

# Arch blue, pulled towards the terminal's background so it holds on a light one.
accent: "#1793d1"

# Above the blank line is the eyebrow, dimmed; below it the wordmark, in the
# accent.
logo: |
  Arch Linux

   █████  ██████   ██████ ██   ██      ██████  ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██ ██
  ███████ ██████  ██      ███████     ██    ██ ███████
  ██   ██ ██   ██ ██      ██   ██     ██    ██      ██
  ██   ██ ██   ██  ██████ ██   ██      ██████  ███████

# Read on the way out, when the installer closes and the machine keeps running.
# There is a root shell behind it on this image — see iso/.
console: Type installer at the prompt to start it again.

# What one run of this is: what it is called, the last thing it says before it
# starts, and the phases the work happens in.
#
# One of them, so there is nothing to choose and nobody is asked. It is here for
# the name: the interface reads it out wherever it says what is happening — the
# row that starts it, the last warning, the clock while it runs. ../recovery
# says the same about itself, in its own words.
modes:
  - id: install
    title: Installation
    description: Put Arch Linux on this machine.

    # The last thing shown before the first task runs. {{VAR}} is filled in from
    # the answers, so this names the actual disk.
    confirm: |
      Arch Linux will be installed on {{ARCH_OS_DISK}} as {{ARCH_OS_HOSTNAME}}.

      Everything on that disk will be erased. There is no undo, and nothing before
      this point has changed anything.

    # Top to bottom. Tasks sharing a stage run in the order `needs` demands.
    stages:
      - prepare # the live system, made ready to install from
      - disk # partitioned, encrypted, formatted, mounted
      - base # the system on the disk, configured, with an account on it
      - boot # the boot loader
      - system # everything that is switched on rather than installed
      - desktop # the chosen desktop, its driver, and what belongs to it
      - finalize # the last things done to the new system
      - finish # what is offered once it is installed

# A set of answers, not a mode the installer stays in: offered once, on a machine
# that has never answered anything, and every value it fills in is an ordinary
# answer from the next page on.
presets:
  - id: system
    title: Setup
    description: Choose what kind of system to install. Every detail can still be changed afterwards.
    options:
      # Each option names every setting it has an opinion about, including the
      # ones it turns off.
      - id: desktop
        title: Desktop
        description: A GNOME desktop with drivers, codecs, fonts and everyday applications.
        values:
          ARCH_OS_DESKTOP: gnome
          ARCH_OS_DESKTOP_GRAPHICS_DRIVER: mesa
          ARCH_OS_DESKTOP_EXTRAS_ENABLED: true
          ARCH_OS_DESKTOP_SLIM_ENABLED: true
          ARCH_OS_SAMBA_SHARE_ENABLED: true
          ARCH_OS_CORE_TWEAKS_ENABLED: true
          ARCH_OS_BOOTSPLASH_ENABLED: true
          ARCH_OS_MULTILIB_ENABLED: true
          ARCH_OS_HOUSEKEEPING_ENABLED: true
          ARCH_OS_SHELL_ENHANCEMENT_ENABLED: true
          ARCH_OS_SHELL_ENHANCEMENT_SHELL: zsh
          ARCH_OS_MANAGER_ENABLED: true
          ARCH_OS_BTRFS_SNAPPER_ENABLED: true
          ARCH_OS_BTRFS_ASSISTANT_ENABLED: true
          ARCH_OS_AUR_HELPER: paru

      - id: minimal
        title: Minimal
        description: Arch Linux on the console only — no desktop, no extras, nothing that was not asked for.
        values:
          ARCH_OS_DESKTOP: none
          ARCH_OS_DESKTOP_EXTRAS_ENABLED: false
          ARCH_OS_DESKTOP_SLIM_ENABLED: false
          ARCH_OS_SAMBA_SHARE_ENABLED: false
          ARCH_OS_CORE_TWEAKS_ENABLED: true
          ARCH_OS_BOOTSPLASH_ENABLED: false
          ARCH_OS_MULTILIB_ENABLED: false
          ARCH_OS_HOUSEKEEPING_ENABLED: false
          ARCH_OS_SHELL_ENHANCEMENT_ENABLED: false
          ARCH_OS_SHELL_ENHANCEMENT_SHELL: bash
          ARCH_OS_MANAGER_ENABLED: false
          ARCH_OS_BTRFS_SNAPPER_ENABLED: false
          ARCH_OS_BTRFS_ASSISTANT_ENABLED: false
          ARCH_OS_DESKTOP_GRAPHICS_DRIVER: none
          ARCH_OS_AUR_HELPER: none

      # Not a set of answers written out here but one fetched: a configuration
      # shared at the end of an earlier installation. A starting point like the
      # two above, so a row here rather than a page of its own.
      - id: shared
        title: paste.rs - Online
        description: Take every answer from a configuration that was shared at the end of an earlier installation.
        asks: ARCH_OS_CONFIG_SOURCE
        apply: ./tasks/share-config/import.sh

# Everything this installer needs to know, in the order it is asked. Required and
# unanswered is what makes the installer ask; an answer is what makes it stop.
# Each name reaches every script as an environment variable.
#
# Every key a row may use — see runtime/internal/spec/spec.go for the full
# rules:
#
#   name         the environment variable — ARCH_OS_UPPER_SNAKE_CASE
#   title        the row's label
#   description  the paragraph under it, on the page that asks the question
#   group        heading over this row and the ones after it, until the next
#   type         text (default), bool, or secret — a secret is never written
#                to the answer file and is asked right before the run
#   default      the value this starts with; empty means no default
#   required     the installer keeps asking until this has a value
#   values       a fixed list of answers, written out here
#   command      a fixed list of answers, printed one per line by this shell —
#                mutually exclusive with values; a single line starting with
#                ./ or ../ names a script file instead of inline shell (same
#                for prefill and apply below)
#   free         label of a text box under a list of answers, for a value the
#                list only suggests; closed sets leave this out
#   prefill      shell that prints a suggested answer into the box — a hint,
#                never the answer itself
#   apply        shell that puts the answer into effect on the live system
#                right away, for the one setting that has to take effect
#                before anything after it can be typed
#   pattern      a regex the answer must match
#   error        the sentence shown when it doesn't, or when required and
#                empty — leave out for the generic message
#   conditions   `VAR == value` / `VAR != value`, one or a list; all must hold
#   first        asked before everything else the program does, even the
#                network screen — sparingly
#   blind        keeps the filter box open from the start, since no key is
#                known to type what it looks like before the layout loads —
#                only meaningful together with first
variables:
  # ─── Region ────────────────────────────────────────────────────────────────
  #
  # What the installed system is set to, not the words this installer is read in.
  #
  # The console keyboard is asked `first` because it is the keyboard everything
  # after it is typed on — a passphrase typed on the wrong layout is not the
  # passphrase. The rest follows the language on `auto`.
  - name: ARCH_OS_LOCALE_LANG
    title: Language and region
    description: |
      The language and country this system is set up for, as a locale code —
      de_DE is German as it is written in Germany. It settles the system language
      and the formats for dates, numbers and currency, and — left on auto — the
      keyboard, the console font, the time zone and the mirror country follow
      from it. English is always installed alongside it as a fallback.
    group: Region
    required: true
    apply: load_console_keyboard
    command: |
      # Every locale the C library ships that /etc/locale.gen also knows about:
      # one that cannot be generated cannot be used. The @-suffixed variants are
      # the same language in another script or currency, and double a long list.
      comm -12 \
          <(basename -a /usr/share/i18n/locales/* | grep -v '@' | sort -u) \
          <(sed -n 's/^#\? *\([a-zA-Z_]*\)[. ].*/\1/p' /etc/locale.gen | sort -u)

  - name: ARCH_OS_VCONSOLE_KEYMAP
    title: Console keyboard
    description: |
      The keyboard you are typing on. It is loaded here and now, and it is what
      the new system uses on the text console. auto is the layout the system
      language is typed on, which is only settled further down.
    group: Region
    required: true
    first: true
    blind: true
    apply: load_console_keyboard
    command: |
      # The auto row carries what auto currently comes to, so it says what it is
      # about to do.
      printf 'auto\tauto — %s\n' "$(auto_keymap)"
      localectl list-keymaps

  - name: ARCH_OS_VCONSOLE_FONT
    title: Console font
    description: |
      The font of the text console. auto is the one that can draw the chosen
      language; a larger one helps on a high resolution screen.
    group: Region
    default: auto
    required: true
    free: Type a font name
    command: |
      printf 'auto\tauto — %s\n' "$(auto_font)"
      echo none
      find /usr/share/kbd/consolefonts -name '*.psf*' -printf '%f\n' 2>/dev/null |
          sed 's/\.psfu\?\(\.gz\)\?$//' | sort -u

  - name: ARCH_OS_TIMEZONE
    title: Time zone
    description: |
      Where this machine is, so the clock is right. The list opens on the zone
      the chosen country keeps — which is the only answer in a country that keeps
      one, and the one most of it lives in where there are several.
    group: Region
    required: true
    command: timedatectl list-timezones
    prefill: auto_timezone

  - name: ARCH_OS_REFLECTOR_COUNTRY
    title: Mirror country
    description: |
      Where package downloads are fetched from. auto is the country the chosen
      language belongs to; none ranks every mirror worldwide by speed, which is
      also what auto comes to where Arch has no mirror.
    group: Region
    default: auto
    required: true
    free: Type a country
    command: |
      printf 'auto\tauto — %s\n' "$(auto_country)"
      echo none
      # A "-" marks a country Arch has no mirror in.
      awk -F'\t' '!/^#/ && $2 != "-" { print $2 }' "${DATA}/countries"

  # ─── Identity ──────────────────────────────────────────────────────────────
  - name: ARCH_OS_USERNAME
    title: User name
    description: |
      The account you will log in with. Lower case letters, digits, hyphen and
      underscore. It must not start with a digit.
    group: Identity
    required: true
    pattern: '^[a-z_][a-z0-9_-]{0,31}$'
    error: Lower case letters, digits, hyphen and underscore only, at most 32 characters. It must not start with a digit.

  - name: ARCH_OS_PASSWORD
    title: Password
    description: |
      Used for your account, for the root account, and — where disk encryption
      is on — to unlock the disk at boot. It is asked for immediately before the
      installation starts and is never written to a file.
    group: Identity
    type: secret
    required: true

  - name: ARCH_OS_HOSTNAME
    title: Host name
    description: The name this machine has on the network.
    group: Identity
    default: arch-os
    required: true
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    error: Lower case letters, digits and hyphen only, at most 63 characters. It must not start or end with a hyphen.

  # ─── Storage ───────────────────────────────────────────────────────────────
  - name: ARCH_OS_DISK
    title: Disk
    description: |
      The disk Arch Linux is installed on. Unless dual boot is switched on,
      everything on it is erased.
    group: Storage
    required: true
    error: Choose a disk that exists.
    command: |
      # The device path is the answer, what follows the tab is what it is chosen
      # by. Nobody picks between /dev/sda and /dev/sdb by name. Whole disks only
      # — 8 is SCSI and SATA, 259 NVMe, 254 virtual block devices.
      lsblk -d -n -I 8,259,254 -o PATH,SIZE,MODEL |
          awk '{ path = $1; $1 = ""; sub(/^ +/, ""); sub(/ +$/, ""); printf "%s\t%s  %s\n", path, path, $0 }'

  - name: ARCH_OS_FILESYSTEM
    title: File system
    description: |
      btrfs supports snapshots, so a system update can be rolled back. ext4 is
      simpler and does not.
    group: Storage
    values: [btrfs, ext4]
    required: true

  - name: ARCH_OS_ENCRYPTION_ENABLED
    title: Disk encryption
    description: |
      Encrypts the whole system with your password, so the data cannot be read
      by taking the disk out. The password is then asked for at every boot.
    group: Storage
    type: bool
    required: true

  - name: ARCH_OS_BTRFS_SNAPPER_ENABLED
    title: Snapshots
    description: |
      Takes a snapshot before every package transaction and cleans up old ones
      on a timer, so a bad update can be undone.
    group: Storage
    type: bool
    default: true
    conditions: ARCH_OS_FILESYSTEM == btrfs

  - name: ARCH_OS_BTRFS_ASSISTANT_ENABLED
    title: Snapshot manager
    description: A desktop application for browsing and restoring snapshots.
    group: Storage
    type: bool
    default: true
    conditions:
      - ARCH_OS_FILESYSTEM == btrfs
      - ARCH_OS_BTRFS_SNAPPER_ENABLED == true

  - name: ARCH_OS_DUAL_BOOT_ENABLED
    title: Dual boot
    description: |
      Install alongside a system that is already on this disk: nothing is
      partitioned or erased, the existing EFI partition is reused, and only a
      boot entry is added. You then have to name the two partitions yourself.
    group: Storage
    type: bool
    default: false

  - name: ARCH_OS_BOOT_PARTITION
    title: Boot partition
    description: The existing EFI partition to add a boot entry to. It is not formatted.
    group: Storage
    required: true
    conditions: ARCH_OS_DUAL_BOOT_ENABLED == true
    prefill: |
      # The first vfat partition is almost always the one the other system boots
      # from.
      lsblk -n -o PATH,FSTYPE "$ARCH_OS_DISK" | awk '$2 == "vfat" { print $1; exit }'
    command: |
      # The size and file system are what tell the EFI partition apart from the
      # one the other operating system lives on.
      lsblk -n -o PATH,SIZE,FSTYPE,LABEL "$ARCH_OS_DISK" | tail -n +2 |
          awk '{ path = $1; $1 = ""; sub(/^ +/, ""); sub(/ +$/, ""); printf "%s\t%s  %s\n", path, path, $0 }'

  - name: ARCH_OS_ROOT_PARTITION
    title: Root partition
    description: The partition Arch Linux is installed into. It is formatted and everything on it is lost.
    group: Storage
    required: true
    conditions: ARCH_OS_DUAL_BOOT_ENABLED == true
    prefill: |
      # The largest partition that is not the EFI one: the likeliest candidate
      # for space freed up to install into.
      lsblk -bn -o PATH,SIZE,FSTYPE "$ARCH_OS_DISK" | tail -n +2 |
          awk '$3 != "vfat" { print $2, $1 }' | sort -rn | head -n1 | awk '{ print $2 }'
    command: |
      lsblk -n -o PATH,SIZE,FSTYPE,LABEL "$ARCH_OS_DISK" | tail -n +2 |
          awk '{ path = $1; $1 = ""; sub(/^ +/, ""); sub(/ +$/, ""); printf "%s\t%s  %s\n", path, path, $0 }'

  # ─── Boot ──────────────────────────────────────────────────────────────────
  - name: ARCH_OS_BOOTLOADER
    title: Boot loader
    description: |
      systemd-boot is small and needs no maintenance. GRUB can show a menu of
      btrfs snapshots to boot into.
    group: Boot
    values: [systemd, grub]
    required: true

  - name: ARCH_OS_SECURE_BOOT_ENABLED
    title: Secure Boot
    description: |
      Signs the kernel and the boot loader with keys made for this machine, so
      the firmware starts nothing else. Where the firmware is in setup mode the
      keys are enrolled straight away and Secure Boot only has to be switched on
      there afterwards; otherwise everything is signed and enrolling is left to
      you.
    group: Boot
    type: bool
    default: true
    conditions:
      - ARCH_OS_ENCRYPTION_ENABLED == true
      - ARCH_OS_BOOTLOADER == systemd

  - name: ARCH_OS_KERNEL
    title: Kernel
    description: |
      linux-zen is tuned for desktop responsiveness. linux is the stock kernel,
      linux-lts a long-term one, linux-hardened a security-focused one.
    group: Boot
    values: [linux-zen, linux, linux-lts, linux-hardened]
    default: linux-zen
    required: true

  - name: ARCH_OS_KERNEL_ARGS
    title: Kernel parameters
    description: |
      Extra parameters passed to the kernel at boot, separated by spaces.
      Leave empty unless you know you need one.
    group: Boot
    pattern: '^[^,&\\]*$'
    error: The characters comma, ampersand and backslash cannot be used here.

  - name: ARCH_OS_MICROCODE
    title: Processor firmware
    description: |
      Firmware updates loaded at boot. auto is whatever this processor turns out
      to be — which is the answer on every machine that is not being prepared for
      a different one.
    group: Boot
    default: auto
    required: true
    command: |
      # Read again at install time, so answers carried to another machine still
      # fit it.
      printf 'auto\tauto — %s\n' "$(auto_microcode)"
      echo intel-ucode
      echo amd-ucode
      echo none

  # ─── Desktop ───────────────────────────────────────────────────────────────
  - name: ARCH_OS_DESKTOP
    title: Desktop
    description: |
      gnome installs the GNOME desktop. none leaves the system on a text
      console, with nothing graphical installed at all.
    group: Desktop
    values: [gnome, none]
    required: true

  - name: ARCH_OS_DESKTOP_GRAPHICS_DRIVER
    title: Graphics driver
    description: |
      mesa is the open driver and fits almost every machine. Pick one matching
      your card only if you know you need it.
    group: Desktop
    values: [mesa, intel_i915, nvidia, amd, ati, none]
    required: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_DESKTOP_KEYBOARD_LAYOUT
    title: Desktop keyboard
    description: |
      The keyboard layout the desktop starts with. auto is the same choice as the
      console keyboard, in the names the desktop uses for it — de-latin1 and de
      are one layout.
    group: Desktop
    default: auto
    required: true
    conditions: ARCH_OS_DESKTOP != none
    command: |
      # Asked of the running system where it can answer, read from data/ where it
      # cannot: the Arch live image ships no xkeyboard-config.
      printf 'auto\tauto — %s\n' "$(auto_layout)"

      layouts="$(localectl list-x11-keymap-layouts 2>/dev/null)"
      if [ -n "$layouts" ]; then
          echo "$layouts"
          exit 0
      fi
      grep -v '^#' "${DATA}/x11-layouts"

  - name: ARCH_OS_DESKTOP_KEYBOARD_VARIANT
    title: Keyboard variant
    description: |
      A variation of that layout — dead keys, a different punctuation
      arrangement. none is the standard one.
    group: Desktop
    default: none
    required: true
    conditions: ARCH_OS_DESKTOP != none
    command: |
      # Same two sources as the layouts. The layout is already resolved — auto
      # became a real one before this ran.
      layout="$ARCH_OS_DESKTOP_KEYBOARD_LAYOUT"
      [ -n "$layout" ] || exit 0

      echo none

      variants="$(localectl list-x11-keymap-variants "$layout" 2>/dev/null)"
      if [ -n "$variants" ]; then
          echo "$variants"
          exit 0
      fi
      grep "^${layout} " "${DATA}/x11-variants" | cut -d' ' -f2- | tr ' ' '\n'

  - name: ARCH_OS_DESKTOP_KEYBOARD_MODEL
    title: Keyboard model
    description: The physical shape of the keyboard. pc105 fits almost every keyboard sold.
    group: Desktop
    default: pc105
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_DESKTOP_EXTRAS_ENABLED
    title: Desktop extras
    description: |
      Codecs, fonts, printing, network protocols, development tools and the
      applications that make the desktop usable straight away.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_DESKTOP_SLIM_ENABLED
    title: Slim desktop
    description: Removes the GNOME applications that come with the desktop and are rarely used.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_DESKTOP_AUTOLOGIN_ENABLED
    title: Log in automatically
    description: |
      Skips the login screen. auto follows disk encryption: with the disk already
      unlocked by a password at boot, a second one at login adds nothing — and
      without encryption the login screen is the only thing standing there.
    group: Desktop
    values: [auto, true, false]
    default: auto
    required: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_SAMBA_SHARE_ENABLED
    title: File sharing
    description: |
      Shares your home folder and a public folder on the local network, readable
      by Windows and macOS.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  # ─── System ────────────────────────────────────────────────────────────────
  - name: ARCH_OS_CORE_TWEAKS_ENABLED
    title: System tweaks
    description: |
      Small adjustments that do not change what is installed: parallel package
      downloads, a quieter boot, password feedback in the terminal.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_BOOTSPLASH_ENABLED
    title: Boot splash
    description: Shows a logo while the system starts instead of a wall of text.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_MULTILIB_ENABLED
    title: 32-bit support
    description: Needed by Steam, Wine and other software that is still 32-bit.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_AUR_HELPER
    title: AUR helper
    description: |
      Installs software from the Arch User Repository as easily as from the
      official one.
    group: System
    values: [paru, paru-bin, paru-git, yay, none]
    default: paru
    required: true

  - name: ARCH_OS_HOUSEKEEPING_ENABLED
    title: Housekeeping
    description: |
      Timers that keep the system tidy on their own: mirrors ranked weekly, the
      package cache trimmed, disk health watched.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_SHELL_ENHANCEMENT_ENABLED
    title: Shell enhancement
    description: |
      A better terminal out of the box: a prompt showing git state, colourful
      listings, fuzzy search, useful aliases.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_SHELL_ENHANCEMENT_SHELL
    title: Shell
    description: |
      bash is always set up; zsh or fish add completion and suggestions as you
      type and become the shell that opens instead.
    group: System
    values: [bash, zsh, fish]
    default: zsh
    required: true
    conditions: ARCH_OS_SHELL_ENHANCEMENT_ENABLED == true

  - name: ARCH_OS_MANAGER_ENABLED
    title: Arch OS Manager
    description: A menu for updating, cleaning up and repairing the system after installation.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_VM_SUPPORT_ENABLED
    title: Virtual machine support
    description: |
      Installs guest tools when this is running inside a virtual machine, so the
      screen resizes and the clipboard is shared. Does nothing on real hardware.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_ECN_ENABLED
    title: Explicit congestion notification
    description: |
      Leave on. Turning it off helps only behind old routers that drop
      connections which use it.
    group: System
    type: bool
    default: true

  # ─── Sharing ───────────────────────────────────────────────────────────────
  #
  # The two ends of one idea: an installation that says where its answers can be
  # picked up, and a starting point that picks them up. Neither is a question
  # here — the address is answered by the installation itself, and the code only
  # by somebody who chose the row that asks for it.
  #
  # There is no switch above them either. Whether this installation goes online is
  # asked at the end of the run, by the task that would do it: a switch set while
  # the disk is being partitioned is consent collected before there is anything to
  # consent to.
  - name: ARCH_OS_CONFIG_URL
    title: Shared at
    description: |
      Where this installation's answers ended up. Nothing is uploaded until the
      offer at the end of the run has been accepted; the installation then
      answers this one itself and shows it as a code to scan.
    group: System

  - name: ARCH_OS_CONFIG_SOURCE
    title: Configuration code
    description: |
      The code of a configuration somebody shared: the short word at the end of
      a paste.rs address, or the whole address pasted in. Every answer kept
      there becomes an answer here, and every one of them can still be changed
      afterwards.
    group: System
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9:/._-]*$'
    error: A code such as aBc12, or the whole address it sits at.
