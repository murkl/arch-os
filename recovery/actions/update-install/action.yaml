# Opened where update found a Recovery to install. An encrypted system is
# opened for it, since the system's keys sign the new one where it signs its
# boot chain.
title: Install the newest Recovery
error: Installing the Recovery failed. Until it goes through, the Recovery on the disk may not start. Choose Update the Recovery again. The log shows how far it got.

requires: [online]

inputs:
  - name: ARCH_OS_RECOVERY_UPDATE_PASSWORD
    type: password
    title: Encryption password
    description: Opens the system, whose own keys sign the new Recovery where it signs its boot chain. Asked right before the update and never written to a file.
    required: true
    check: ./check-password.sh
    error: That password does not unlock this disk.
    when: ARCH_OS_RECOVERY_ENCRYPTED == true

confirm: |
  Install the newest Recovery of this release series?

  It is downloaded, held to the checksum of its release and written to the
  Recovery's partition. It starts with the next restart.

# The statuses action.sh stops itself with. No internet and no GitHub are the
# module's.
errors:
  10: |
    The download broke off

    The release page stopped sending the Recovery. Nothing was changed. Try
    again.
  11: |
    The download is damaged

    It does not match the checksum of its release and was deleted. Nothing was
    changed. Try again.
  12: |
    The Recovery does not fit

    It is larger than its partition and was not installed. The Recovery on the
    disk stays as it is.
  13: |
    Writing the Recovery failed

    Its partition did not keep what was written. The system starts as before,
    the Recovery only once an update has gone through: try again. A disk that
    keeps refusing may be failing.

report: |
  Recovery updated

  The new one starts with the next restart.
