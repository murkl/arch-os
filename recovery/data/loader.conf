# Written by Arch OS.
console-mode auto
# The menu stays hidden, systemd-boot's default. Holding space at start shows
# it, for the fallback entry and the Recovery.
# No default: entries sort as system, fallback, Recovery, and one out of tries
# sorts last. A default starts regardless of its tries.
# An editable command line opens a root shell through init=/bin/sh, past the
# password and Secure Boot. Other parameters are a Recovery job.
editor no
