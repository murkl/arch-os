# What this recovery is, what it asks, and in what order it works.
#
# The runtime beside it knows nothing about Arch Linux. Everything else in this
# module is found by its own name — lib.sh, locales/, hooks/, tasks/ — and
# nothing points at it from here.
#
# Putting Arch Linux on a disk is a module of its own, with a declaration of its
# own: see ../installer. Which modules there are, what they are called together
# and what they look like is ../runtime.yaml, not here.

title: Arch OS Recovery

# The sentence under this module's row on the page that asks which to open.
description: Repair an Arch Linux system that is already on a disk.

# What one run of this is called. Without it the interface would fall back to the
# only thing an unnamed run can be, and call a repair an installation.
run: Recovery

# Read on the way out, when the recovery closes and the machine keeps running.
# There is a root shell behind it on this image — see iso/.
console: Type recovery at the prompt to start it again.

# The last thing shown before the first task runs. {{VAR}} is filled in from the
# answers, so this names the actual disk.
confirm: |
  The system on {{ARCH_OS_RECOVERY_DISK}} will be unlocked and mounted at /mnt.

  Nothing on it is changed by that. Going back to a snapshot, rebuilding the boot
  files and opening a shell are each offered on their own once it is open.

# The phases the work happens in, top to bottom. Every task names one, which is
# what puts it in the run and where; tasks sharing a stage run in the order
# `needs` demands.
stages:
  - open # unlocked and mounted, as the system mounts itself
  - repair # rolled back, made bootable again, worked in by hand
  - close # unmounted, and the disk locked again

# Everything this recovery needs to know, in the order it is asked. Required and
# unanswered is what makes it ask; an answer is what makes it stop. Each name
# reaches every script as an environment variable.
#
# The keys a row may use are the installer's — see ../installer/installer.yaml
# for the full list, and runtime/internal/spec/spec.go for the rules.
variables:
  # ─── The keyboard ──────────────────────────────────────────────────────────
  #
  # Asked `first`, before everything else this program does, because it is the
  # keyboard the password below is typed on — and a passphrase typed on the
  # wrong layout is not the passphrase. It is loaded on the live system the
  # moment it is given and never written to the system being repaired.
  - name: ARCH_OS_RECOVERY_KEYMAP
    title: Console keyboard
    description: |
      The keyboard you are typing on. It is loaded here and now, and it opens on
      the layout this live image was started with.
    group: Region
    required: true
    first: true
    blind: true
    command: localectl list-keymaps
    prefill: |
      # The keyboard the live image was started with. The Arch image records it
      # in root's shell history as the loadkeys command that set it, which is
      # the only place it can be read back from.
      grep -h 'loadkeys' /root/.bash_history /root/.zsh_history 2>/dev/null |
          tail -n1 | sed 's/.*loadkeys *//' | tr -d ' ' || true
    apply: |
      # DEBUG runs on somebody's own machine, whose keyboard is not ours to
      # touch.
      [ "$DEBUG" = "true" ] && exit 0
      loadkeys "$ARCH_OS_RECOVERY_KEYMAP"

  # ─── The system to repair ──────────────────────────────────────────────────
  #
  # The recovery asks for the disk and nothing else it can read for itself. The
  # two that follow are read off that disk and open on the answer, and are still
  # questions because behind LUKS nothing can be read until the password is
  # given — and because a disk laid out some other way has to stay answerable.
  - name: ARCH_OS_RECOVERY_DISK
    title: Disk
    description: |
      The disk holding the Arch OS installation to repair. Opening it changes
      nothing on it.
    group: Storage
    required: true
    error: Choose a disk that exists.
    command: |
      # The device path is the answer, what follows the tab is what it is chosen
      # by. Nobody picks between /dev/sda and /dev/sdb by name. Whole disks only
      # — 8 is SCSI and SATA, 259 NVMe, 254 virtual block devices.
      lsblk -d -n -I 8,259,254 -o PATH,SIZE,MODEL |
          awk '{ path = $1; $1 = ""; sub(/^ +/, ""); sub(/ +$/, ""); printf "%s\t%s  %s\n", path, path, $0 }'

  - name: ARCH_OS_RECOVERY_ENCRYPTION_ENABLED
    title: Disk encryption
    description: |
      Whether that disk is encrypted with LUKS. This is read off the disk, which
      can be done without the password — change it only if the answer is wrong.
    group: Storage
    type: bool
    required: true
    prefill: |
      # A LUKS header is readable without the password, so this one is reliable.
      [ "$(fstype "$(root_part)")" = "crypto_LUKS" ] && echo true || echo false

  - name: ARCH_OS_RECOVERY_PASSWORD
    title: Encryption password
    description: |
      The password that unlocks that disk. It is asked for immediately before
      the recovery starts and is never written to a file.
    group: Storage
    type: secret
    required: true
    conditions: ARCH_OS_RECOVERY_ENCRYPTION_ENABLED == true

  - name: ARCH_OS_RECOVERY_FILESYSTEM
    title: File system
    description: |
      The file system of the system being repaired. btrfs can be rolled back to
      a snapshot; ext4 can be opened and worked in by hand. On an encrypted disk
      this cannot be read in advance, so check it.
    group: Storage
    values: [btrfs, ext4]
    required: true
    prefill: |
      # Readable everywhere except behind LUKS, where the question is a real one.
      case "$(fstype "$(root_part)")" in
      btrfs) echo btrfs ;;
      ext4) echo ext4 ;;
      esac

  - name: ARCH_OS_RECOVERY_SNAPSHOT
    title: Snapshot
    description: |
      The snapshot to put in place of the root subvolume. Newest first, with the
      date it was taken and what took it.
    group: Storage
    required: true
    conditions: ARCH_OS_RECOVERY_FILESYSTEM == btrfs
    # Asked by the rollback task, which is also where the shell that lists them
    # lives: the snapshots cannot be listed until the disk they are on is
    # unlocked and mounted.
    command: ./tasks/rollback/snapshots.sh
