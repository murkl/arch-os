# The Recovery in run order. A name() is a lib.sh function: runtime/README.md

title: Recovery
start: Repair now

# ─── The Way In ──────────────────────────────────────────────────────────────

# No network: a repair downloads nothing, and the network may be what broke.
requires: [live-image, root]

# Answered beforehand on its own partition, see iso/recovery/. The rollback asks
# for the snapshot once the disk is open.
settings:
  Storage:
    - name: ARCH_OS_RECOVERY_DISK
      type: list
      title: Disk
      description: The disk with the installation to repair.
      required: true
      options-from: options_disks()
      pattern: '^/dev/[A-Za-z0-9_-]+$'
      error: Disk not found.

    # A LUKS header is readable without the password.
    - name: ARCH_OS_RECOVERY_ENCRYPTED
      type: bool
      title: Disk encryption
      value-from: value_disk_encrypted()

    # Typed once, tested on the disk.
    - name: ARCH_OS_RECOVERY_PASSWORD
      type: password
      title: Encryption password
      description: Unlocks the disk. Never saved.
      when: ARCH_OS_RECOVERY_ENCRYPTED == true
      required: true
      error: Wrong password.
      check: check_disk_password()

  # First, since the disk password is typed on it. Never written to the system.
  Region:
    - name: ARCH_OS_RECOVERY_KEYMAP
      type: list
      title: Console keyboard
      description: The keyboard layout for this session.
      first: true
      required: true
      options-from: options_keymaps()
      prefill: prefill_keymap()
      pattern: '^[A-Za-z0-9_.-]+$'
      apply: apply_recovery_keymap()

# No reset: each of the two answers has its own row.
dashboard: [start, settings, wifi, update]
language: Region

# ─── The Work ────────────────────────────────────────────────────────────────

# Stage is when, task is what.
stages:
  # System unlocked and mounted.
  open:
    system:
      title: Unlock and mount the system
      # A disk the Installer did not make.
      errors:
        10: |
          No Arch OS on {{ARCH_OS_RECOVERY_DISK}}

          Choose another disk on the dashboard.
        11: |
          Unsupported layout

          Use the Recovery of the release this system was installed with.

  # Snapshot in place of the system.
  rollback:
    snapshot:
      title: Roll back to a snapshot
      # Asked here, since the snapshots are on the disk just opened. An empty
      # list skips the step.
      asks:
        name: ARCH_OS_RECOVERY_SNAPSHOT
        title: Snapshot
        description: Replaces the current system.
        options-from: options_snapshots()
        filter: open
      confirm: |
        Roll back to {{ARCH_OS_RECOVERY_SNAPSHOT}}?

        The current system is kept as a snapshot. /home stays unchanged.

  # Boot files rebuilt from the system.
  rebuild:
    boot:
      title: Rebuild the boot files
      confirm: |
        Rebuild kernel images, initramfs and boot entries?

        Required after a rollback past a kernel update.
      # A snapshot may hold other kernel modules than /boot.
      yes-after: [snapshot]
      # Modules without the image Arch installs beside them.
      errors:
        10: |
          Kernel image missing

          Roll back to another snapshot.

# The statuses lib.sh names.
errors:
  3: |
    No internet connection

    Connect to Wi-Fi on the dashboard or plug in a cable.
  4: |
    GitHub unreachable

    Try again later.

# ─── Around It ───────────────────────────────────────────────────────────────

on:
  leave: [restart, shutdown]
  failure: [share-log]
  success: [chroot]

actions:
  # Without a network the update's own error says what to do.
  online:
    title: Internet
    run: check_online()

  # Itself, or from the ISO one that no longer starts.
  recovery-to-update:
    title: A Recovery to update
    run: recovery_to_update()

  # Choosing the row only looks. update-install asks before installing.
  update:
    title: Update the Recovery
    description: Checks for a Recovery update.
    group: Configuration
    requires: [recovery-to-update]
    run: recovery_up_to_date()
    error: |
      No internet connection. Connect to Wi-Fi on the dashboard or plug in a
      cable.
    report: Recovery is up to date
    on:
      failure: [update-install]

  # Opened where update found one. An encrypted system is opened, since its
  # keys sign the new Recovery where it has sbctl.
  update-install:
    title: Install the newest Recovery
    requires: [online]
    inputs:
      - name: ARCH_OS_RECOVERY_UPDATE_PASSWORD
        type: password
        title: Encryption password
        description: Unlocks the disk. Never saved.
        when: ARCH_OS_RECOVERY_ENCRYPTED == true
        required: true
        error: Wrong password.
        check: check_update_password()
    confirm: |
      Install the newest Recovery?

      It replaces the current one. Active after a restart.
    run: install_recovery_update()
    error: |
      Installation failed. The Recovery may not start until an update
      succeeds.
    # No internet and no GitHub are the module's.
    errors:
      10: |
        Download interrupted

        Try again.
      11: |
        Checksum mismatch

        Try again.
      12: Recovery too large for its partition
      13: |
        Write verification failed

        The Recovery does not start until an update succeeds. Try again.
    report: |
      Recovery updated

      Active after a restart.
