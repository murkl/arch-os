title: Rebuild the boot files
confirm: |
  Rebuild the kernel images, the initial ram disks and the boot entries?

  Needed after a rollback past a kernel update, or the system starts without
  its modules. An installation from before 2.1 gets the entries that fall back
  to the Recovery. Everything comes from the package cache, so no network is
  needed.

# A snapshot may hold other kernel modules than /boot starts.
yes-after: [snapshot]

# What task.sh stops itself with: a cache that no longer holds the kernel.
errors:
  10: |
    The kernel is missing from the package cache

    The boot files are made from the package of the installed kernel, and the
    cache no longer holds it. Roll back to a snapshot from before the kernel
    was updated.
