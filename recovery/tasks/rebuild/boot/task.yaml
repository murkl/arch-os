title: Rebuild the boot files
confirm: |
  Rebuild kernel images, initramfs and boot entries?

  Needed after a rollback past a kernel update, otherwise the system boots
  without its modules. Everything comes from the package cache, offline.

# A snapshot may hold other kernel modules than /boot starts.
yes-after: [snapshot]

# What task.sh stops itself with: a cache that no longer holds the kernel.
errors:
  10: |
    Kernel missing from the package cache

    The boot files are built from the installed kernel's package, which the
    cache no longer holds. Roll back to a snapshot from before the kernel
    update.
