title: Roll back to a snapshot

# The snapshots are on the disk this run has just opened, so they are asked
# here. Without any, the list is empty and the step is skipped.
asks:
  name: ARCH_OS_RECOVERY_SNAPSHOT
  title: Snapshot
  description: Replaces the system. Newest first, with date and description.
  filter: open
  options-from: ./snapshots.sh
confirm: |
  Roll back {{ARCH_OS_RECOVERY_DISK}} to {{ARCH_OS_RECOVERY_SNAPSHOT}}?

  The current system is replaced by this snapshot and stays as a snapshot of
  its own, so this can be undone. /home and the other snapshots stay.
