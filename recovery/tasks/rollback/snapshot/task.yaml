title: Go back to a snapshot

# The snapshots are on the disk this run has just opened, so they are asked
# here. Without any, the list is empty and the step is skipped.
asks:
  name: ARCH_OS_RECOVERY_SNAPSHOT
  title: Snapshot
  description: The snapshot to put in place of the system. Newest first, with its date and what took it.
  filter: open
  options-from: ./snapshots.sh
confirm: |
  Put {{ARCH_OS_RECOVERY_SNAPSHOT}} in place of the system on {{ARCH_OS_RECOVERY_DISK}}?

  The system as it is now is replaced by that snapshot. /home and the other
  snapshots stay as they are, so you can come back and choose another.
