title: Write the image to the device

# dd's progress, redrawn in place, under the step while it runs.
progress: true

# A device written and still plugged in is a boot that does not happen.
report: |
  The device is ready

  {{ARCH_OS_IMAGE_DEVICE}} now starts Arch OS. Unplug it, plug it into the
  machine to install, and start that machine from it.

# What task.sh stops itself with.
errors:
  10: |
    The USB stick is gone

    {{ARCH_OS_IMAGE_DEVICE}} is no longer plugged in. Plug it back in and choose
    Start again.
  11: |
    The USB stick is too small

    The image needs more room than {{ARCH_OS_IMAGE_DEVICE}} has. Choose Start
    again with a larger one.
  12: |
    The USB stick is still in use

    Something still holds {{ARCH_OS_IMAGE_DEVICE}} open. Close it, or unplug the
    stick and plug it in again, then choose Start again.
  13: |
    Writing the USB stick failed

    {{ARCH_OS_IMAGE_DEVICE}} stopped taking the image. It may be faulty or was
    pulled out: choose Start again, or try another stick.
