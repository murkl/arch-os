# Can this machine write a bootable device at all?
#
# Every check in this stage is read-only and every one of them is a hard stop.
# They run before the first question, because none of it can be fixed from
# inside this program.
#
# Which machines this module belongs on is not among them: that is `offered:` in
# module.yaml, and it is what decides whether this row is on the page at all.
# What is left for this stage is what has to be true once it has been chosen.
#
# What goes to stderr is what the user reads, so each message says what is wrong
# and what to do about it, in that order, and nothing else.
title: Running as root

script: |
  simulating && return 0

  [ "$(id -u)" -eq 0 ] && return 0
  echo "Writing a device needs root. Start this again with sudo." >&2
  exit 1
