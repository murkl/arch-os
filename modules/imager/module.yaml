# What this module is, what it asks and in what order it works. Everything else
# in it is found by its own name, and every list and suggestion below is a
# function in module.sh.
#
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

# What will happen, not what the program is called: this row is read as the
# thing somebody is about to do. The folder stays `imager`, which is what its
# answers and its log are named after.
title: Create boot medium
description: Write Arch OS to a USB device to boot another machine from.

# What starting the work is called: the first row of the menu, and the button on
# the last page before the device is written. Shorter than the title, which
# stands over both in the header and would only be read twice.
start: Create

# Where it runs its actions, each a folder under actions/: on any machine but
# the live image, with a way to become root and something to write to.
offered: [ordinary-machine]
requires: [access, device]
failure: [share-log]

# Each is a folder under tasks/, marked - tasks/@write/ - and lying in one is
# what puts a task in the run and where.
stages:
  - download # the image of the release oak.yaml names
  - verify # against the checksum that release publishes, before anything is written
  - write # the image onto the device

variables:
  - name: ARCH_OS_DOWNLOAD_DIR
    title: Download folder
    description: |
      Where the image is kept. It is reused, so a second run costs no
      bandwidth. The folder is created if it is not there, and the image needs
      about two gigabytes.
    group: Image
    required: true
    prefill: download_dir
    pattern: '^/.+$'
    error: Type the full path of a folder, starting with a slash.

  # A setting rather than a question in the middle of the run, so it reads in
  # the interface's language like every other one and is decided before the
  # run starts rather than halfway through it.
  - name: ARCH_OS_IMAGE_VERIFY
    title: Verify checksum
    description: |
      Holds the image to the checksum its release publishes before anything
      is written, and throws it away where the two disagree. Turned off, the
      image in the download folder goes to the device as it is - an image
      built rather than downloaded is the usual reason.
    group: Image
    type: bool
    default: true

  - name: ARCH_OS_IMAGE_DEVICE
    title: Device
    description: |
      The USB device to write to. Everything on it will be erased. Only USB
      disks are offered, and none this system is running from, so it cannot
      be chosen by accident.
    group: Device
    required: true
    error: Choose a device that exists.
    command: list_devices

  # Not asked: whether writing the device needs a password is a fact about this
  # machine. Root needs none, and a sudo rule may say this account needs none
  # either.
  - name: ARCH_OS_IMAGE_SUDO
    title: Password for the write
    description: Whether writing the device asks for your password.
    group: Device
    type: bool
    answer: needs_password

  # Asked in the interface rather than by sudo on the terminal, so the screen
  # stays where it is. Once, since it already exists, and tried with sudo right
  # where it is typed: a wrong one is refused on that page rather than after a
  # download of two gigabytes.
  - name: ARCH_OS_IMAGE_PASSWORD
    title: Your password
    description: |
      Writing the device needs root, and sudo asks for your password to allow
      it. It is asked for right before the run starts and is never written to
      a file.
    group: Device
    type: secret
    existing: true
    required: true
    check: sudo_accepts
    error: That is not your password, or this account may not use sudo.
    conditions: ARCH_OS_IMAGE_SUDO == true

  # Not a question on any page: the address a failed run's log was put at,
  # answered by actions/share-log where somebody chose to share it.
  - name: ARCH_OS_LOG_URL
    title: Shared log
    description: Where the log of a run that failed was put online.
