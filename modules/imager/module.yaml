# What this module is, what it asks and in what order it works. Everything else
# in it is found by its own name, and every list and suggestion below is a
# function in module.sh.
#
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

# What will happen, not what the program is called: this row is read as the
# thing somebody is about to do. The folder stays `imager`, which is what its
# answers and its log are named after.
title: Create boot medium
description: Write Arch OS to a USB device to boot another machine from.

# The other way round from the Installer and the Recovery, which is the whole
# division between the three: they work on the machine the image booted, this
# one makes that image.
requires: |
  on_live_image || return 0
  echo "Create boot medium writes a device from an ordinary Linux machine. On the live image there is a machine to work on instead - open the Installer or the Recovery." >&2
  exit 1

confirm: |
  Arch OS will be written to {{ARCH_OS_IMAGE_DEVICE}}.

  Everything on that device will be erased and this cannot be undone. Nothing
  has been changed so far.

# Each is a folder under tasks/, marked - tasks/@write/ - and lying in one is
# what puts a task in the run and where.
stages:
  - download # the image of the release this program came out of
  - verify # against the checksum that release publishes, before anything is written
  - write # the image onto the device

# Which image gets written is not among them: that is not a matter of opinion,
# it is the version beside the binary - see module.sh.
variables:
  - name: ARCH_OS_DOWNLOAD_DIR
    title: Download folder
    description: |
      Where the image is kept. It is reused, so a second run costs no
      bandwidth. The folder is created if it is not there, and the image needs
      about two gigabytes.
    group: Image
    required: true
    prefill: download_dir
    pattern: '^/.+$'
    error: Type the full path of a folder, starting with a slash.

  - name: ARCH_OS_IMAGE_DEVICE
    title: Device
    description: |
      The USB device to write to. Everything on it will be erased. Only disks
      on a USB bus are offered, so the disk this machine boots from cannot be
      chosen by accident.
    group: Device
    required: true
    error: Choose a device that exists.
    command: list_devices
