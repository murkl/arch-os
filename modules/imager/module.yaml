# What this Imager is, what it asks, and in what order it works. Everything else
# in this module is found by its own name — module.sh, locales/, tasks/ — and
# nothing points at it from here.
#
# The shell below is module.sh's: every list and every suggested value is a
# function named there, so this file stays the questions and nothing else.
#
# Every key this file may use:
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

# The one name this module has: the row that opens it, the trail across the top
# of every page once it is open, and every sentence the interface writes about
# it. It is what will happen rather than what the program is called, because
# that is what the row asking which module to open is read as — and a device
# somebody can boot a machine from is worth more than one word. The folder it
# lives in stays `imager`, which is what its answers and its log are named
# after.
title: Create boot medium

# The sentence under that row.
description: Write Arch OS to a USB device to boot another machine from.

# What a machine has to be for this module to be offered on it at all, asked
# before the row even exists. The other way round from the Installer and the
# Recovery, which is the whole division between the three: they work on the
# machine the image booted, this one makes that image.
#
# What goes to stderr is what somebody reads who named this module outright with
# --module=. A run started with --debug is offered every module, whatever this
# says.
requires: |
  on_live_image || return 0
  echo "Create boot medium writes a device from an ordinary Linux machine. On the live image there is a machine to work on instead - open the Installer or the Recovery." >&2
  exit 1

# The last thing shown before the first task runs. {{VAR}} is filled in from the
# answers, so this names the actual device.
confirm: |
  Arch OS will be written to {{ARCH_OS_IMAGE_DEVICE}}.

  Everything on that device will be erased and this cannot be undone. Nothing
  has been changed so far.

# The phases the work happens in, top to bottom. Each is a folder under tasks/,
# marked — tasks/@write/ — and lying in one is what puts a task in the run and
# where.
#
# What Oak runs of its own accord — the check that this machine can write a
# device at all — is a hook, and hooks live in hooks/ beside tasks/.
stages:
  - download # the image and the checksum published beside it, onto this machine
  - verify # the image, against that checksum, before anything is written
  - write # the image, onto the device

# Everything this Imager needs to know, in the order the run needs it. Which
# image gets written is not among them: that is not a matter of opinion, it is
# the version beside the binary — see module.sh.
variables:
  - name: ARCH_OS_DOWNLOAD_DIR
    title: Download folder
    description: |
      Where the image and the checksum beside it are kept. Both are reused, so
      a second run costs no bandwidth. The folder is created if it is not
      there, and the image needs about two gigabytes.
    group: Image
    required: true
    prefill: download_dir
    pattern: '^/.+$'
    error: Type the full path of a folder, starting with a slash.

  - name: ARCH_OS_IMAGE_DEVICE
    title: Device
    description: |
      The USB device to write to. Everything on it will be erased. Only disks
      on a USB bus are offered, so the disk this machine boots from cannot be
      chosen by accident.
    group: Device
    required: true
    error: Choose a device that exists.
    command: list_devices
