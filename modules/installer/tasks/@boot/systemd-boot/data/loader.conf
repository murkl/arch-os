default {{DEFAULT}}
console-mode auto
# No menu, since there is nothing to choose between. Holding space while the
# machine starts brings it up for the fallback entry.
timeout 0
# Off on every machine: an editable command line hands whoever sits at it a
# root shell through init=/bin/sh, past the password and past Secure Boot. A
# boot that needs other parameters is a Recovery job.
editor no
