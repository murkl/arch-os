title: Sign the boot chain

# Signing holds only as long as nothing rebuilds a boot image afterwards, and
# every one of these installs or removes packages. A task added to this stage
# belongs on this line.
needs: [first-login, remove-orphans, snapper, snapshot-hook]
conditions:
  - ARCH_OS_SECURE_BOOT_ENABLED == true
  - ARCH_OS_ENCRYPTION_ENABLED == true
  - ARCH_OS_BOOTLOADER == systemd
