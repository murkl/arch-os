title: Enable 32-bit support
conditions: ARCH_OS_MULTILIB_ENABLED == true

# Switched on before anything that needs it is installed: the desktop and the
# graphics driver both pull lib32 packages. The change goes into pacman.conf
# itself, because a repository is a section of that file and pacman reads no
# drop-in directory — the section is already there, commented out.
script: |
  simulating && return 0

  sed -i '/\[multilib\]/,/Include/s/^#//' "${MNT}/etc/pacman.conf"
  arch-chroot "$MNT" pacman -Syu --noconfirm
