title: Restart into the new system
stage: finish
needs: [chroot]
confirm: |
  Restart into {{ARCH_OS_HOSTNAME}} now?

  Everything is unmounted first. Remove the installation media once the screen
  goes blank.
quits: true

# A target that will not unmount does not hold the restart back: everything is
# on the disk, and systemd flushes whatever is left on the way down.
execute: |
  simulating && return 0

  close_target || echo "restarting with the target still mounted"
  reboot
