# Written to /etc/samba/smb.conf by the installer. Only what differs from
# Samba's own defaults - `testparm -sv` prints all of them.

[global]
   # The version the default would announce is nobody's business on the network.
   server string = Samba Server

   # A login nobody has an account for is let in as the guest rather than
   # refused, which is what makes the public share reachable without one.
   map to guest = Bad User

   # What this machine is called in a file manager on the network. The default
   # is the NetBIOS name, which is the hostname in capitals - so a machine
   # installed as tux-desktop announces itself as TUX-DESKTOP and is the one
   # entry in the list that shouts. This hands the name to Avahi instead, which
   # publishes the hostname as it stands.
   # https://wiki.archlinux.org/title/Samba
   mdns name = mdns

[homes]
   comment = Home Directory
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = %S

# Readable by anyone on the network, written only by the account this machine
# was installed with: a guest who may write is a folder anybody on the same
# wifi can fill.
[public]
   comment = Public Share
   path = /srv/samba/public
   guest ok = yes
   read only = yes
   write list = {{USERNAME}}
   force user = nobody
   force group = users
   create mask = 0777
   directory mask = 0777
