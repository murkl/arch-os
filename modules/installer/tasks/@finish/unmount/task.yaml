title: Unmount everything
needs: [reboot]
confirm: |
  Unmount the new system and stay in the live environment?

  Nothing is lost either way, the installation is finished. Leaving it
  mounted is only useful if you want to keep working on it from here.

# Close the new system cleanly: swap off, everything unmounted, the encrypted
# volume locked again.
script: |
  simulating && return 0

  close_target
