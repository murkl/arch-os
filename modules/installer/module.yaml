# What this module is, what it asks and in what order it works. Everything else
# in it is found by its own name, and every list and suggestion below is a
# function in module.sh.
#
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

title: Installer
description: Install Arch Linux on this machine.

# What a machine has to be for this module to be offered on it at all, asked
# before the row even exists. `requires:` decides whether the row exists;
# hooks/@preflight/ decides whether the machine behind it is ready.
requires: |
  arch_live && return 0
  echo "The Installer runs from a booted Arch Linux live image. Write one with Create boot medium, start the machine from it, and open this there." >&2
  exit 1

# Read on the way out, when the installer closes and the machine keeps running.
console: Type installer at the prompt to start it again.

confirm: |
  Arch Linux will be installed on {{ARCH_OS_DISK}} as {{ARCH_OS_HOSTNAME}}.

  Everything on that disk will be erased and this cannot be undone. Nothing
  has been changed so far.

# Each is a folder under tasks/, marked - tasks/@disk/ - and lying in one is
# what puts a task in the run and where; tasks sharing a stage run in the order
# `needs` demands.
stages:
  - prepare # the live system, made ready to install from
  - disk # partitioned, encrypted, formatted, mounted
  - base # the system on the disk, configured, with an account on it
  - boot # the boot loader
  - system # everything that is switched on rather than installed
  - desktop # the chosen desktop, its driver, and what belongs to it
  - finalize # the last things done to the new system
  - handover # what is offered once it is installed, and the ways out

# A set of answers, not a state the installer stays in: offered once, on a
# machine that has never answered anything, and every value it fills in is an
# ordinary answer from the next page on.
presets:
  - title: Setup
    description: Choose what kind of system to install. Every detail can still be changed afterwards.
    options:
      # Two starting points, and the second is the first without the desktop:
      # Core is what Arch OS is, Desktop is Core with GNOME built on top of it.
      # Each names every setting it has an opinion about, including the ones it
      # turns off, so what is left to ask is only what nobody but the person at
      # the machine can answer: the account, the region, the disk.
      - title: Desktop
        description: The Core, with a GNOME desktop on top of it - drivers, codecs, fonts and everyday applications.
        values:
          ARCH_OS_ENCRYPTION_ENABLED: true
          ARCH_OS_RECOVERY_ENABLED: true
          ARCH_OS_DESKTOP: gnome
          ARCH_OS_DESKTOP_EXTRAS_ENABLED: true
          ARCH_OS_DESKTOP_SLIM_ENABLED: true
          ARCH_OS_FLATPAK_ENABLED: true
          ARCH_OS_SAMBA_SHARE_ENABLED: false
          ARCH_OS_CORE_TWEAKS_ENABLED: true
          ARCH_OS_BOOTSPLASH_ENABLED: true
          ARCH_OS_MULTILIB_ENABLED: true
          ARCH_OS_AUR_HELPER: paru
          ARCH_OS_CONTAINER_ENGINE: none
          ARCH_OS_FIREWALL_ENABLED: true
          ARCH_OS_SSH_SERVER_ENABLED: false
          ARCH_OS_HOUSEKEEPING_ENABLED: true
          ARCH_OS_SHELL_ENHANCEMENT_ENABLED: true
          ARCH_OS_MANAGER_ENABLED: true
          ARCH_OS_VM_HOST_ENABLED: false

      # Everything off that can be off, but the Recovery: it is how a machine
      # that no longer starts comes back, on a console no less than on a
      # desktop.
      - title: Core
        description: A minimal Arch Linux on the text console, with nothing graphical on it and nothing beyond what you choose.
        values:
          ARCH_OS_ENCRYPTION_ENABLED: false
          ARCH_OS_RECOVERY_ENABLED: true
          ARCH_OS_DESKTOP: none
          ARCH_OS_DESKTOP_EXTRAS_ENABLED: false
          ARCH_OS_DESKTOP_SLIM_ENABLED: false
          ARCH_OS_FLATPAK_ENABLED: false
          ARCH_OS_SAMBA_SHARE_ENABLED: false
          ARCH_OS_CORE_TWEAKS_ENABLED: false
          ARCH_OS_BOOTSPLASH_ENABLED: false
          ARCH_OS_MULTILIB_ENABLED: false
          ARCH_OS_AUR_HELPER: none
          ARCH_OS_CONTAINER_ENGINE: none
          ARCH_OS_FIREWALL_ENABLED: false
          ARCH_OS_SSH_SERVER_ENABLED: false
          ARCH_OS_HOUSEKEEPING_ENABLED: false
          ARCH_OS_SHELL_ENHANCEMENT_ENABLED: false
          ARCH_OS_MANAGER_ENABLED: false
          ARCH_OS_VM_HOST_ENABLED: false

      # Not a set of answers written out here but one fetched: a configuration
      # shared at the end of an earlier installation.
      - title: Online (paste.rs)
        description: Load every answer from a configuration shared at the end of an earlier installation.
        asks: ARCH_OS_CONFIG_SOURCE
        apply: ./tasks/@handover/share-config/import.sh

# Everything this installer needs to know, in the order it is asked. Each name
# reaches every script as an environment variable.
#
# A list vouches only for the rows it offers: an answer file copied or fetched
# from somewhere else hands its values over as they stand, and they reach the
# shell. So every list whose answer does says with `pattern:` what its values
# look like, and a value that does not fit is asked again.
variables:
  # ─── Identity ──────────────────────────────────────────────────────────────
  #
  # Who this machine is for, asked first because it is the one thing nobody but
  # the person at it can answer. The password is a secret: it is asked for
  # immediately before the installation starts, never written down, and never a
  # row on the settings page.
  - name: ARCH_OS_USERNAME
    title: Username
    description: |
      The account you will log in with. Lowercase letters, digits, hyphens and
      underscores only. It cannot start with a digit.
    group: Identity
    required: true
    pattern: '^[a-z_][a-z0-9_-]{0,31}$'
    error: Lowercase letters, digits, hyphens and underscores only, up to 32 characters. It cannot start with a digit.

  - name: ARCH_OS_PASSWORD
    title: Password
    description: |
      Used for your account, the root account, and — if disk encryption is on
      — to unlock the disk at boot. It is asked for right before installation
      starts and is never written to a file.
    group: Identity
    type: secret
    required: true

  - name: ARCH_OS_HOSTNAME
    title: Hostname
    description: The name this machine has on the network.
    group: Identity
    default: arch-os
    required: true
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    error: Lowercase letters, digits and hyphens only, up to 63 characters. It cannot start or end with a hyphen.

  # ─── Region ────────────────────────────────────────────────────────────────
  #
  # What the installed system is set to, not the words this installer is read
  # in. Everything here follows the language on `auto`, except the console
  # keyboard, which is asked before all of it: a password typed on the wrong
  # layout is not the password. The mirror country follows the language only by
  # way of the time zone, which is the one answer that says where the machine
  # is.
  - name: ARCH_OS_LOCALE_LANG
    title: Language and region
    description: |
      The locale this system is set up for, for example de_DE for German as
      used in Germany. It sets the system language and the format for dates,
      numbers and currency, and on auto also the keyboard layout, console
      font and time zone. English is always installed as a fallback, and the
      list opens on it.
    group: Region
    required: true
    apply: load_console_keyboard
    filter: open
    command: list_locales
    pattern: '^[a-z]{2,3}(_[A-Z]{2})?$'
    # Not a default, which would take the question off the page - and not the
    # first row of a list that starts at Afar, which is what an enter meant for
    # the page before would otherwise answer with. Everything in this group
    # follows this one, so the row it opens on has to be one somebody could
    # have meant.
    prefill: default_locale

  - name: ARCH_OS_VCONSOLE_KEYMAP
    title: Console keyboard
    description: |
      The keyboard you are typing on right now. It is loaded immediately, and
      used by the new system on the text console. auto uses the layout for the
      system language chosen further down.
    group: Region
    required: true
    first: true
    apply: load_console_keyboard
    command: list_keymaps
    pattern: '^[A-Za-z0-9_.-]+$'

  - name: ARCH_OS_VCONSOLE_FONT
    title: Console font
    description: |
      The font used on the text console. auto picks one that can display the
      chosen language; a larger font helps on a high-resolution screen.
    group: Region
    default: auto
    required: true
    free: Type a font name
    filter: open
    command: list_fonts
    pattern: '^[A-Za-z0-9_.+-]+$'

  - name: ARCH_OS_TIMEZONE
    title: Time zone
    description: |
      Where this machine is located, so the clock is set correctly. The list
      opens on the time zone for the chosen country.
    group: Region
    required: true
    filter: open
    command: list_timezones
    pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
    prefill: auto_timezone

  - name: ARCH_OS_REFLECTOR_COUNTRY
    title: Mirror country
    description: |
      Where package downloads come from. auto uses the country of the chosen
      time zone, none ranks every mirror worldwide by speed. auto falls back to
      none when the time zone names no country or Arch has no mirror there.
    group: Region
    default: auto
    required: true
    free: Type a country
    filter: open
    command: list_countries
    # What reflector cannot read inside the quotes its file holds the country in.
    pattern: '^[^"\\]*$'

  # ─── Storage ───────────────────────────────────────────────────────────────
  - name: ARCH_OS_DISK
    title: Disk
    description: |
      The disk Arch Linux will be installed on. Everything on it will be
      erased. The medium this live image is running from is not offered.
    group: Storage
    required: true
    error: Choose a disk that exists.
    command: list_disks
    pattern: '^/dev/[A-Za-z0-9_-]+$'

  - name: ARCH_OS_ENCRYPTION_ENABLED
    title: Disk encryption
    description: |
      Encrypts the whole system with your password, so the data cannot be read
      by removing the disk. The password is then required at every boot.
    group: Storage
    type: bool
    required: true

  # ─── Boot ──────────────────────────────────────────────────────────────────
  - name: ARCH_OS_SECURE_BOOT_ENABLED
    title: Secure Boot
    description: |
      Signs the kernel and boot loader with keys generated for this machine, so
      the firmware starts nothing else. In firmware setup mode the keys are
      enrolled automatically and you only need to turn Secure Boot on
      afterwards. Otherwise everything is signed and enrolling the keys is
      left to you.
    group: Boot
    type: bool
    default: true
    conditions: ARCH_OS_ENCRYPTION_ENABLED == true

  - name: ARCH_OS_RECOVERY_ENABLED
    title: Recovery
    description: |
      Puts the Recovery on a small partition of its own and into the boot
      menu, so a system that no longer starts is repaired without a USB
      stick. Hold space while the machine starts to reach the menu. The Arch
      OS ISO carries it; any other live image downloads it first.
    group: Boot
    type: bool
    default: true

  - name: ARCH_OS_BOOTSPLASH_ENABLED
    title: Boot splash
    description: Shows a logo while the system starts instead of a wall of text.
    group: Boot
    type: bool
    default: true

  - name: ARCH_OS_KERNEL_ARGS
    title: Kernel parameters
    description: |
      Extra parameters passed to the kernel at boot, separated by spaces.
      Leave empty unless you know you need one.
    group: Boot

  # ─── System ────────────────────────────────────────────────────────────────
  - name: ARCH_OS_CORE_TWEAKS_ENABLED
    title: Core tweaks
    description: |
      Small adjustments to the Core that do not change what is installed:
      parallel package downloads, a quieter boot, password feedback in the
      terminal, and the memory, disk and log settings the system runs better
      on.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_MULTILIB_ENABLED
    title: 32-bit support
    description: Needed by Steam, Wine and other software that is still 32-bit.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_AUR_HELPER
    title: AUR helper
    description: |
      Installs software from the Arch User Repository just as easily as from
      the official repositories. Built here, against the pacman this machine
      has, which takes about a quarter of an hour.
    group: System
    values: [paru, none]
    default: paru
    required: true

  - name: ARCH_OS_CONTAINER_ENGINE
    title: Container engine
    description: |
      docker needs a daemon running as root, which is what most software and
      documentation assumes. podman has neither and still answers to the
      docker command. Both bring a compose command.
    group: System
    values: [docker, podman, none]
    default: none
    required: true

  - name: ARCH_OS_FIREWALL_ENABLED
    title: Firewall
    description: |
      Blocks incoming connections. Every network counts as public, a café's
      wifi included, and lets in only what this machine is set up to answer:
      SSH and finding printers. A network marked as home also reaches file
      sharing: nmcli connection modify <name> connection.zone home
    group: System
    type: bool
    default: true

  - name: ARCH_OS_SSH_SERVER_ENABLED
    title: SSH server
    description: |
      Lets you log in to this machine from another one over the network, with
      your account and password. Root cannot log in this way.
    group: System
    type: bool
    default: false

  - name: ARCH_OS_HOUSEKEEPING_ENABLED
    title: Housekeeping
    description: |
      Timers that keep the system tidy automatically: mirrors ranked weekly,
      the package cache trimmed, and disk health checked.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_EDITOR
    title: Text editor
    description: |
      The editor that opens wherever a command asks for one: sudoedit, git,
      systemctl edit. nano and micro are typed into straight away, micro with
      the shortcuts of a desktop editor. vim, neovim and helix are modal:
      typing and commands are separate modes.
    group: System
    values: [nano, vim, neovim, micro, helix]
    default: nano
    required: true

  - name: ARCH_OS_SHELL_ENHANCEMENT_ENABLED
    title: Shell enhancement
    description: |
      A better terminal out of the box: zsh with completion and suggestions as
      you type, a prompt showing git state, colourful listings, fuzzy search,
      useful aliases.
    group: System
    type: bool
    default: true

  - name: ARCH_OS_MANAGER_ENABLED
    title: Arch OS Manager
    description: A menu for updating, cleaning up and repairing the system after installation.
    group: System
    type: bool
    default: true

  # Not asked: whether this machine is a virtual one is a fact about it. Inside
  # one, the guest tools are installed without a question; on real hardware,
  # running virtual machines of one's own is the question below.
  - name: ARCH_OS_VIRTUAL_MACHINE
    title: Virtual machine
    description: Whether this machine is itself a virtual one.
    group: System
    type: bool
    answer: in_virtual_machine

  - name: ARCH_OS_VM_HOST_ENABLED
    title: Virtual machines
    description: |
      Runs virtual machines on this computer: QEMU and libvirt, and on a
      desktop the Virtual Machine Manager window. Inside a virtual machine this
      is not offered - the guest tools that make the screen resize and the
      clipboard work are installed there on their own.
    group: System
    type: bool
    default: false
    conditions: ARCH_OS_VIRTUAL_MACHINE == false

  # ─── Desktop ───────────────────────────────────────────────────────────────
  - name: ARCH_OS_DESKTOP
    title: Environment
    description: |
      gnome installs the GNOME desktop environment. none leaves the system on
      a text console, with nothing graphical installed.
    group: Desktop
    values: [gnome, none]
    required: true

  - name: ARCH_OS_DESKTOP_KEYBOARD_LAYOUT
    title: Desktop keyboard
    description: |
      The keyboard layout the desktop starts with. auto matches the console
      keyboard, using the desktop's own naming: de-latin1 and de are the same
      layout.
    group: Desktop
    default: auto
    required: true
    conditions: ARCH_OS_DESKTOP != none
    filter: open
    command: list_layouts
    pattern: '^[A-Za-z0-9_-]+$'

  - name: ARCH_OS_DESKTOP_KEYBOARD_VARIANT
    title: Keyboard variant
    description: |
      A variation of that layout, such as dead keys or a different
      punctuation arrangement. none is the standard one.
    group: Desktop
    default: none
    required: true
    conditions: ARCH_OS_DESKTOP != none
    # Three rows under one layout and forty under the next: the box is up on
    # every machine rather than on some of them.
    filter: open
    command: list_variants
    pattern: '^[A-Za-z0-9_-]+$'

  - name: ARCH_OS_DESKTOP_KEYBOARD_MODEL
    title: Keyboard model
    description: The physical shape of the keyboard. pc105 fits almost every keyboard sold.
    group: Desktop
    default: pc105
    conditions: ARCH_OS_DESKTOP != none
    pattern: '^[A-Za-z0-9_-]+$'

  - name: ARCH_OS_DESKTOP_EXTRAS_ENABLED
    title: Desktop extras
    description: |
      Codecs, fonts, printing, network protocols, development tools and the
      applications that make the desktop usable straight away.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_DESKTOP_SLIM_ENABLED
    title: Slim desktop
    description: Removes the GNOME applications that come with the desktop and are rarely used.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_FLATPAK_ENABLED
    title: Flatpak
    description: |
      Applications from Flathub, installed and updated through Bazaar, a store
      made for them.
    group: Desktop
    type: bool
    default: true
    conditions: ARCH_OS_DESKTOP != none

  - name: ARCH_OS_SAMBA_SHARE_ENABLED
    title: File sharing
    description: |
      Shares your home folder and a public folder with Windows and macOS, on
      networks marked as home. Anyone on such a network can try your password
      against it. Without the firewall, every network reaches it.
    group: Desktop
    type: bool
    default: false
    # The same two the task that shares carries, so this is never a row that is
    # answered and then never acted on.
    conditions:
      - ARCH_OS_DESKTOP != none
      - ARCH_OS_DESKTOP_EXTRAS_ENABLED == true

  # ─── Sharing ───────────────────────────────────────────────────────────────
  #
  # Neither is a question on any page: the address is answered by the
  # installation itself, the code only by somebody who chose the starting point
  # that asks for it. Whether anything goes online at all is asked at the end of
  # the run, by the task that would do it.
  - name: ARCH_OS_CONFIG_URL
    title: Shared at
    description: |
      Where this installation's answers ended up. Nothing is uploaded until
      you accept the offer at the end of the run. The installation then fills
      this in itself and shows it as a code to scan.

  - name: ARCH_OS_CONFIG_SOURCE
    title: Configuration code
    description: |
      The code of a shared configuration: the short word at the end of a
      paste.rs address, or the whole address. Every answer it contains can
      still be changed afterwards.
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9:/._-]*$'
    error: A code such as aBc12, or the whole address it belongs to.
