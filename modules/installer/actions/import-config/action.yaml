# Every answer of a shared configuration but the disk, which is this machine's
# own.
title: Online (paste.rs)
error: No Arch OS configuration could be loaded from {{ARCH_OS_CONFIG_SOURCE}}. Check the code, and that this machine is online.

variables:
  - name: ARCH_OS_CONFIG_SOURCE
    type: text
    title: Configuration code
    description: The code at the end of a paste.rs address, or the whole address. Every answer can still be changed afterwards.
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9:/._-]*$'
    error: A code such as aBc12, or the whole address it belongs to.
