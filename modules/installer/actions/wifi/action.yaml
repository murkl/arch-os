# In the configuration, and opened when there is no internet. An open or known
# network is joined as it is chosen; one that wants a passphrase says no, and
# the passphrase is asked next.
title: Configure the wireless network
description: Join a wireless network.

rules:
  offer-if: [wifi-card, no-cable]
  on-failure: wifi-passphrase

variable:
  name: ARCH_OS_WIFI_SSID
  title: Network
  required: true
  command: list_wifi_networks
