# Named under failure: a row under the report of a run that failed. It asks
# first and opens on no - nothing leaves the machine until somebody in front of
# it has said so - and the address comes back as a code to scan, for whoever
# is helping. The shell is oak.sh's, which every module shares the log with.
title: Share the log
description: Put the log of this run online, for whoever is helping.
simulates: true
script: share_log

confirm: |
  Put the log of this run online?

  It goes to paste.rs, and its address comes back as a code to scan. Anyone
  holding that address can read it. It holds every answer but the passwords,
  which were never written down anywhere.
default: no

shows: ARCH_OS_LOG_URL
report: |
  Log shared

  Scan the code, or read the address under it, and hand it to whoever is
  helping.
