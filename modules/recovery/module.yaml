# The Recovery: what it asks and the order it works in. Every name() is a
# function in oak.sh.
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

title: Recovery
description: |
  Ready to repair the Arch Linux system on the chosen disk. Start the repair,
  or review every value first.

# Opening changes nothing, and the steps that do ask on their own.
text:
  start: Repair
  settings: Configuration
  confirm: |
    Open the system on {{ARCH_OS_RECOVERY_DISK}}?

    Opening it changes nothing. Every step that does asks first.

# Nothing waits for a network: a repair downloads nothing, and the network may
# be what broke.
rules:
  offer-if: [live-image]
  start-if: [root]
  on-settings: [wifi]
  on-leave: [restart, shutdown]
  on-failure: [share-log]
  on-success: [chroot]

stages:
  - open # the system unlocked and mounted
  - rollback # a snapshot in place of the system
  - rebuild # the boot files made again from the package cache

# On its own partition both questions are answered already - see iso/recovery/.
variables:
  # First, because the password below is typed on it. Never written to the
  # system being repaired.
  - name: ARCH_OS_RECOVERY_KEYMAP
    type: list
    title: Console keyboard
    description: The keyboard you are typing on right now, loaded at once. Opens on the one the live image started with.
    group: Region
    required: true
    first: true
    options-from: options_keymaps()
    prefill: prefill_live_keymap()
    apply: apply_recovery_keymap()
    pattern: '^[A-Za-z0-9_.-]+$'

  - name: ARCH_OS_RECOVERY_DISK
    type: list
    title: Disk
    description: The disk with the Arch OS installation to repair. Opening it changes nothing.
    group: Storage
    required: true
    error: Choose a disk that exists.
    options-from: options_disks()
    pattern: '^/dev/[A-Za-z0-9_-]+$'

  # Not asked: a LUKS header is readable without the password.
  - name: ARCH_OS_RECOVERY_ENCRYPTED
    type: bool
    title: Disk encryption
    description: Whether that disk is encrypted with LUKS.
    group: Storage
    value-from: value_disk_encrypted()

  # Typed once and tried on the disk where it is typed.
  - name: ARCH_OS_RECOVERY_PASSWORD
    type: password
    title: Encryption password
    description: The password that unlocks that disk. Asked right before the repair and never written to a file.
    group: Storage
    required: true
    check: check_disk_password()
    error: That password does not unlock this disk.
    conditions: ARCH_OS_RECOVERY_ENCRYPTED == true

  # Asked by the rollback, once the disk is open.
  - name: ARCH_OS_RECOVERY_SNAPSHOT
    type: deferred
    title: Snapshot
    description: The snapshot to put in place of the system. Newest first, with its date and what took it.
    required: true
    filter: open
    options-from: ./tasks/@rollback/snapshot/snapshots.sh
