name: Rebuild the boot files
stage: repair
needs: [rollback]
conditions: ARCH_OS_RECOVERY_FILESYSTEM == btrfs
confirm: |
  Rebuild the kernel images and the initial ram disks?

  Needed when the rollback goes back past a kernel update: the modules in the
  restored system and the images in /boot would then belong to different
  kernels, and the machine would come up without a single module. Everything
  is taken from the package cache, so this needs no network.
