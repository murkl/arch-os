title: Go back to a snapshot
needs: [open]

# The snapshots are on the disk this run has only just opened. A system with
# none leaves the list empty, and the step is skipped.
asks: ARCH_OS_RECOVERY_SNAPSHOT
confirm: |
  Put {{ARCH_OS_RECOVERY_SNAPSHOT}} in place of the root subvolume on {{ARCH_OS_RECOVERY_DISK}}?

  The system as it is now is deleted and replaced by that snapshot. Everything
  under /home is untouched, and so are the other snapshots. You can come
  back and choose a different one.
