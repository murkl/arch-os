# A wireless network, for whatever somebody wants to fetch in the shell, joined
# with the shell the Installer joins one with - see THE NETWORK in oak.sh. On
# the menu wherever this machine has a card, and nothing waits for it: a repair
# downloads nothing, and the network may be what broke.
title: Wireless network
description: Join a wireless network.
menu: main
requires: wlan_card
script: wlan_join

variables:
  - name: ARCH_OS_WLAN_SSID
    title: Network
    required: true
    command: wlan_networks
  - name: ARCH_OS_WLAN_PASSPHRASE
    title: Passphrase
    description: Left empty for an open network.
    type: secret
    existing: true
