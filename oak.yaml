# What Arch OS is, as the runtime that draws it reads it: what no module can
# answer for its neighbours. Which modules there are is not written down here —
# they are whatever folders sit in modules/ beside the binary.
#
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

# Over the pages drawn before a module has been opened. Not translated: it is a
# name.
title: Arch OS

# The version of this project, and the only place it is written down. The build
# reads it, both downloads and the ISO label are named after it, and a release
# is the tag `v` + this — see /Makefile.
version: 2.0.0

# Arch blue, pulled towards the terminal's background so it holds on a light one.
accent: "#1793d1"

# Above the blank line is the eyebrow, dimmed; below it the wordmark, in the
# accent.
