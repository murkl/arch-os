# Arch OS as Oak reads it: what no module can answer for its neighbours. The
# modules are the folders in modules/, and `version:` is stamped by the build.
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

title: Arch OS

# Arch blue, pulled towards the background so it holds on a light one.
accent: "#1793d1"

# Whether this machine is online, opposite the name on every page.
status:
  check: check_online()
  pass: Online
  fail: Offline

# Pictures, printed by functions in oak.sh.
logo: logo_arch_os()
icon: icon_arch_linux()
