# What Arch OS is, as the runtime that draws it reads it: what no module can
# answer for its neighbours. Which modules there are is not written down here —
# they are whatever folders sit in modules/ beside the binary.
#
# https://github.com/murkl/oak/blob/main/docs/REFERENCE.md

# Over the pages drawn before a module has been opened. Not translated: it is a
# name.
title: Arch OS

# The version of this project: what the build names everything after — both
# downloads, the ISO label, and the tag `v` + this — see /Makefile. It says what
# was last published rather than what is being worked on, and nobody types it:
# the run that releases raises it here and in the release manifest together, and
# `make check` reads the two back against each other. The marks are around the
# line rather than at the end of it because everything here reads this file line
# by line.
# x-release-please-start-version
version: 2.1.0
# x-release-please-end

# Arch blue, pulled towards the terminal's background so it holds on a light one.
accent: "#1793d1"

# Opposite the name on every page: whether this machine reaches the internet.
# The Installer cannot do without it, the Recovery only for what somebody wants
# to fetch by hand, and Create boot medium downloads the image. See oak.sh.
status:
  script: header_online
  pass: Online
  fail: Offline

# Above the blank line is the eyebrow, dimmed; below it the wordmark, in the
# accent.
